<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos Hotel - Manage Rooms</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 min-h-screen pb-24 font-sans">

  <nav class="bg-white p-5 shadow-sm flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="bg-gray-100 p-2 rounded-xl text-gray-600 hover:bg-gray-200">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <div>
        <h1 class="font-bold text-gray-800 text-lg leading-tight">Manage Rooms</h1>
        <p class="text-xs text-gray-500">Manager Only</p>
      </div>
    </div>
  </nav>

  <main class="p-4 max-w-2xl mx-auto space-y-6">

    <!-- Add New Room -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
      <h2 class="font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="plus-circle" class="w-5 h-5 text-green-600"></i> Add New Room</h2>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Room Number</label>
          <input id="new-room-num" type="text" placeholder="e.g. 107" class="w-full px-3 py-2 bg-gray-50 border rounded-lg outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Price Per Night (₦)</label>
          <input id="new-room-price" type="number" placeholder="e.g. 25000" class="w-full px-3 py-2 bg-gray-50 border rounded-lg outline-none focus:border-blue-500">
        </div>
      </div>
      <button onclick="addRoom()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold shadow-md active:scale-95 transition">Save New Room</button>
      <p id="add-msg" class="mt-2 text-center text-sm font-bold text-green-600"></p>
    </div>

    <!-- Existing Rooms List -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
      <h2 class="font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="edit" class="w-5 h-5 text-blue-600"></i> Update Room Prices</h2>
      <div id="room-list" class="space-y-3">
        <p class="text-center text-gray-400 text-sm">Loading rooms...</p>
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    // --- SECURITY BOUNCER ---
    async function checkRole() {
      const { data: { user } } = await db.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }
      
      const { data: profile } = await db.from('profiles').select('role').eq('id', user.id).single();
      if (!profile || (profile.role !== 'manager' && profile.role !== 'admin')) {
        // SILENT REDIRECT (No alert)
        window.location.href = 'dashboard.html';
      } else {
        // If they are authorized, load the data
        loadRooms();
      }
    }

    async function loadRooms() {
      const { data: rooms } = await db.from('rooms').select('*').order('room_number');
      const list = document.getElementById('room-list');
      
      if (!rooms) return;
      
      list.innerHTML = rooms.map(room => `
        <div class="flex items-center gap-2 bg-gray-50 p-2 rounded-lg border">
          <span class="font-bold text-gray-800 w-16">Rm ${room.room_number}</span>
          <span class="text-xs text-gray-500 w-20">${room.status}</span>
          <input id="price-${room.id}" type="number" value="${room.price_per_night}" class="flex-1 px-2 py-1 border rounded text-sm outline-none focus:border-blue-500">
          <button onclick="updatePrice('${room.id}')" class="bg-blue-600 text-white px-3 py-1 rounded text-xs font-bold active:scale-95">Save</button>
        </div>
      `).join('');
    }

    async function addRoom() {
      const num = document.getElementById('new-room-num').value;
      const price = document.getElementById('new-room-price').value;
      const msg = document.getElementById('add-msg');

      if (!num || !price) return alert("Enter room number and price");

      const { error } = await db.from('rooms').insert({
        room_number: num,
        price_per_night: price,
        status: 'Available',
        room_type: 'Standard' // Default type
      });

      if (error) {
        msg.textContent = "Error: " + error.message;
        msg.className = "mt-2 text-center text-sm font-bold text-red-600";
      } else {
        msg.textContent = "Room Added!";
        msg.className = "mt-2 text-center text-sm font-bold text-green-600";
        document.getElementById('new-room-num').value = '';
        document.getElementById('new-room-price').value = '';
        loadRooms(); 
      }
    }

    async function updatePrice(id) {
      const newPrice = document.getElementById(`price-${id}`).value;
      await db.from('rooms').update({ price_per_night: newPrice }).eq('id', id);
      alert("Price updated!");
    }

    // Run the security check on page load
    checkRole();
  </script>
</body>
</html>
