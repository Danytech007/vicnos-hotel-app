<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos - Blog Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Image Compression -->
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; background-color: #f8fafc; }
    input, textarea { user-select: text; }
  </style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
</head>
<body class="min-h-screen pb-10">

  <nav class="bg-white p-5 shadow-sm flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="bg-gray-100 p-2 rounded-xl text-gray-600 hover:bg-gray-200">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <div>
        <h1 class="font-bold text-gray-800 text-lg leading-tight">Blog Studio</h1>
        <p class="text-xs text-gray-500">Vicnos Insider</p>
      </div>
    </div>
  </nav>

  <main class="p-4 max-w-2xl mx-auto space-y-5">
    
    <!-- Write Post Form -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
      <h2 class="font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="pen-tool" class="w-5 h-5 text-purple-600"></i> Write New Article</h2>
      
      <form id="blog-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Article Title</label>
          <input id="post-title" type="text" required placeholder="e.g. Top 5 Suya Spots in Benin" class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none focus:border-purple-500 font-bold">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">Content</label>
          <textarea id="post-content" required rows="6" placeholder="Write your article here..." class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none focus:border-purple-500 text-sm leading-relaxed"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-gray-500 mb-1">Cover Image</label>
              <input id="post-image" type="file" accept="image/*" class="w-full px-2 py-1.5 bg-gray-50 border rounded-xl outline-none text-xs">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-500 mb-1">Video Link (Optional)</label>
              <input id="post-video" type="url" placeholder="WhatsApp Channel Link" class="w-full px-3 py-2 bg-gray-50 border rounded-xl outline-none text-sm focus:border-purple-500">
            </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-purple-600 text-white py-3 rounded-xl font-bold shadow-md active:scale-95 transition">
          Publish to Guest App
        </button>
      </form>
      <p id="message" class="mt-3 text-center text-sm font-bold text-green-600"></p>
    </div>

    <!-- Recent Posts -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
      <h2 class="font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="newspaper" class="w-5 h-5 text-gray-500"></i> Published Articles</h2>
      <div id="blog-list" class="space-y-3">
        <p class="text-center text-gray-500 text-sm">Loading posts...</p>
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    let currentUser = null;

    async function init() {
        const { data: { user } } = await db.auth.getUser();
        if(!user) { window.location.href = 'index.html'; return; }
        currentUser = user;
        loadPosts();
    }

    async function loadPosts() {
      const list = document.getElementById('blog-list');
      const { data: posts } = await db.from('blog_posts').select('*').order('created_at', { ascending: false });
      
      if (!posts || posts.length === 0) {
        list.innerHTML = '<p class="text-center text-gray-500 text-sm py-4">No posts published yet.</p>';
        return;
      }

      list.innerHTML = posts.map(p => `
        <div class="flex items-center gap-3 bg-gray-50 p-3 rounded-xl border border-gray-100">
          ${p.image_url ? `<img src="${p.image_url}" class="w-16 h-16 rounded-lg object-cover">` : `<div class="w-16 h-16 rounded-lg bg-gray-200 flex items-center justify-center"><i data-lucide="image" class="w-6 h-6 text-gray-400"></i></div>`}
          <div class="flex-1">
            <p class="font-bold text-gray-800 text-sm">${p.title}</p>
            <p class="text-[10px] text-gray-500 mt-1">${new Date(p.created_at).toLocaleDateString()}</p>
          </div>
          <button onclick="deletePost('${p.id}')" class="text-red-500 p-2"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
        </div>
      `).join('');
      lucide.createIcons();
    }

    document.getElementById('blog-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('message');
      const file = document.getElementById('post-image').files[0];

      btn.innerText = "Publishing...";
      btn.disabled = true;

      try {
        let imageUrl = null;

        if (file) {
          // Compress image
          const options = { maxSizeMB: 0.3, maxWidthOrHeight: 1200, useWebWorker: true };
          const compressedFile = await imageCompression(file, options);
          
          const fileName = `blog-${Date.now()}.jpg`;
          const { error: uploadError } = await db.storage.from('blog_images').upload(fileName, compressedFile);
          if (uploadError) throw uploadError;

          const { data: urlData } = db.storage.from('blog_images').getPublicUrl(fileName);
          imageUrl = urlData.publicUrl;
        }

        const { error: dbError } = await db.from('blog_posts').insert({
            title: document.getElementById('post-title').value,
            content: document.getElementById('post-content').value,
            video_link: document.getElementById('post-video').value,
            image_url: imageUrl,
            author_name: currentUser.email
        });
        
        if (dbError) throw dbError;

        msg.textContent = "✅ Article Published Successfully!";
        msg.className = "mt-3 text-center text-sm font-bold text-green-600";
        document.getElementById('blog-form').reset();
        loadPosts();

      } catch (err) {
        msg.textContent = "Error: " + err.message;
        msg.className = "mt-3 text-center text-sm font-bold text-red-600";
      } finally {
        btn.innerText = "Publish to Guest App";
        btn.disabled = false;
      }
    });

    async function deletePost(id) {
        if(!confirm("Delete this article?")) return;
        await db.from('blog_posts').delete().eq('id', id);
        loadPosts();
    }

    init();
  </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg failed', err));
    });
  }
</script>
</body>
</html>
