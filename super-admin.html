<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DEKY - Super Admin Portal</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Outfit', sans-serif; background-color: #0f172a; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen pb-10">

  <nav class="bg-slate-900 border-b border-slate-700/50 p-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="bg-yellow-500/20 p-2 rounded-xl border border-yellow-500/30"><i data-lucide="shield-check" class="w-6 h-6 text-yellow-400"></i></div>
      <div><h1 class="font-bold text-white text-lg leading-tight">DEKY Network</h1><p class="text-[10px] text-yellow-400 uppercase tracking-widest font-bold">Command Center</p></div>
    </div>
    <button onclick="window.location.href='dashboard.html'" class="bg-slate-800 p-2 rounded-full text-slate-300 hover:bg-slate-700 transition"><i data-lucide="x" class="w-5 h-5"></i></button>
  </nav>

  <div class="bg-slate-900/80 backdrop-blur-md px-2 py-2 flex gap-2 overflow-x-auto hide-scroll border-b border-slate-700/50 sticky top-[68px] z-40">
    <button onclick="switchTab('overview')" id="btn-overview" class="tab-btn bg-yellow-500 text-black px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap shadow-md transition">Overview</button>
    <button onclick="switchTab('manage-vendors')" id="btn-manage-vendors" class="tab-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition">Vendors</button>
    <button onclick="switchTab('manage-ads')" id="btn-manage-ads" class="tab-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition">Manage Ads</button>
    <button onclick="switchTab('vendor')" id="btn-vendor" class="tab-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition">Add Vendor</button>
    <button onclick="switchTab('ad')" id="btn-ad" class="tab-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition">Add Ad</button>
  </div>

  <main class="p-4 max-w-4xl mx-auto mt-4">
    <!-- OVERVIEW -->
    <div id="section-overview" class="tab-content block fade-in">
      <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6">
          <div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50"><p class="text-xs text-slate-400 font-medium mb-1">Total Vendors</p><p id="stat-vendors" class="text-2xl font-bold text-white">...</p></div>
          <div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50"><p class="text-xs text-slate-400 font-medium mb-1">Total Inquiries</p><p id="stat-inquiries" class="text-2xl font-bold text-white">...</p></div>
          <div class="col-span-2 md:col-span-1 bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50 bg-gradient-to-br from-yellow-500/10 to-transparent"><p class="text-xs text-yellow-400 font-bold mb-1">DEKY Commission</p><p id="stat-commission" class="text-2xl font-bold text-yellow-400">₦...</p></div>
      </div>
    </div>

    <!-- MANAGE VENDORS -->
    <div id="section-manage-vendors" class="tab-content hidden fade-in">
      <div class="bg-slate-800/40 p-5 rounded-2xl border border-slate-700/50"><h2 class="font-bold text-white mb-4">Registered Vendors</h2><div id="vendor-list-admin" class="space-y-4"><p class="text-center text-slate-500 animate-pulse">Loading vendors...</p></div></div>
    </div>

    <!-- MANAGE ADS -->
    <div id="section-manage-ads" class="tab-content hidden fade-in">
      <div class="bg-slate-800/40 p-5 rounded-2xl border border-slate-700/50">
        <div class="flex justify-between items-center mb-4"><h2 class="font-bold text-white">All Sponsored Ads</h2><button onclick="switchTab('ad')" class="bg-yellow-500 text-black text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-1"><i data-lucide="plus" class="w-3 h-3"></i> New Ad</button></div>
        <div id="ad-list-admin" class="space-y-4"><p class="text-center text-slate-500 animate-pulse">Loading ads...</p></div>
      </div>
    </div>

    <!-- ADD VENDOR -->
    <div id="section-vendor" class="tab-content hidden bg-slate-800/40 p-5 rounded-2xl border border-slate-700/50 fade-in">
      <h2 class="font-bold text-white mb-4 text-lg">Manually Add Vendor</h2>
      <form id="vendor-form" class="space-y-4">
        <div><label class="block text-xs text-slate-400 mb-1">Business Name</label><input id="v-name" type="text" required placeholder="e.g. Diamond Fashion" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500"></div>
        <div><label class="block text-xs text-slate-400 mb-1">Category</label><select id="v-category" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500"><option value="Local Street Food">Local Street Food (Suya, Pizza)</option><option value="Transport">Transport & Rides</option><option value="Fashion & Tailoring">Fashion & Tailoring</option><option value="Spa & Wellness">Spa & Wellness</option><option value="Shopping & Artisans">Shopping & Artisans</option><option value="Tours & Guides">Tours & Guides</option><option value="Romance & Gifts">Romance & Gifts</option><option value="Events">Events</option><option value="Tech & Essentials">Tech & Essentials</option><option value="Pharmacy & Wellness">Pharmacy & Wellness (Manpower)</option><option value="Financial Services">Currency Exchange</option></select></div>
        <div><label class="block text-xs text-slate-400 mb-1">Physical Business Address</label><input id="v-address" type="text" required placeholder="e.g. 12 Ekewan, Benin City" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500"></div>
        <div><label class="block text-xs text-slate-400 mb-1">Passport Photograph</label><input id="v-image" type="file" accept="image/*" class="w-full bg-slate-900 border border-slate-700 p-2 rounded-xl text-white text-sm outline-none"></div>
        <div><label class="block text-xs text-slate-400 mb-1">WhatsApp Number</label><input id="v-whatsapp" type="text" required placeholder="2348012345678" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500"></div>
        <div class="border-t border-slate-700/50 pt-4 mt-4">
            <p class="text-xs text-yellow-400 font-bold mb-3">Create Vendor Login Account</p>
            <div class="space-y-3">
                <div><label class="block text-xs text-slate-400 mb-1">Vendor Email</label><input id="v-email" type="email" required placeholder="vendor@email.com" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500"></div>
                <div><label class="block text-xs text-slate-400 mb-1">Temporary Password</label><input id="v-password" type="text" required placeholder="Min 6 characters" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500"></div>
            </div>
        </div>
        <button type="submit" id="v-btn" class="w-full bg-yellow-500 text-black font-bold py-3 rounded-xl mt-2 active:scale-95 transition">Save Vendor & Create Login</button>
      </form>
      <p id="v-msg" class="mt-2 text-center text-sm font-bold text-green-400"></p>
    </div>

    <!-- ADD / EDIT AD -->
    <div id="section-ad" class="tab-content hidden bg-slate-800/40 p-5 rounded-2xl border border-slate-700/50 fade-in">
      <h2 id="ad-form-title" class="font-bold text-white mb-4 text-lg">Add Sponsored Ad</h2>
      <form id="ad-form" class="space-y-4">
        <div><label class="block text-xs text-slate-400 mb-1">Ad Title</label><input id="a-title" type="text" required placeholder="e.g. Learn crypto and Forex trading" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500"></div>
        <div><label class="block text-xs text-slate-400 mb-1">Short Description</label><input id="a-desc" type="text" required placeholder="e.g. Learn Basic and Advanced technical analysis..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500"></div>
        <div><label class="block text-xs text-slate-400 mb-1">Destination Link (Website or WhatsApp)</label><input id="a-link" type="url" placeholder="e.g. https://wa.me/2348012345678" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500"></div>
        <div><label class="block text-xs text-slate-400 mb-1">Ad Banner Image (Leave blank to keep existing when editing)</label><input id="a-image" type="file" accept="image/*" class="w-full bg-slate-900 border border-slate-700 p-2 rounded-xl text-white text-sm outline-none"></div>
        <div class="flex gap-2"><button type="button" onclick="resetAdForm()" id="a-cancel-btn" class="hidden w-1/3 bg-slate-700 text-white font-bold py-3 rounded-xl mt-2 active:scale-95 transition">Cancel</button><button type="submit" id="a-btn" class="flex-1 bg-yellow-500 text-black font-bold py-3 rounded-xl mt-2 active:scale-95 transition">Publish Ad</button></div>
      </form>
      <p id="a-msg" class="mt-2 text-center text-sm font-bold text-green-400"></p>
    </div>
  </main>

  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.log(err))); }
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    let editingAdId = null;
    window.history.replaceState({ tab: 'overview' }, '', '#overview');
    window.onpopstate = function(event) { if (event.state && event.state.tab) switchTab(event.state.tab, false); else switchTab('overview', false); };

    async function uploadImage(file, bucketName) {
        if (!file) return null;
        const options = { maxSizeMB: 0.3, maxWidthOrHeight: 800, useWebWorker: true };
        const compressedFile = await imageCompression(file, options);
        const fileName = `${bucketName}-${Date.now()}.jpg`;
        const { error } = await db.storage.from(bucketName).upload(fileName, compressedFile);
        if (error) throw error;
        const { data } = db.storage.from(bucketName).getPublicUrl(fileName);
        return data.publicUrl;
    }

    function switchTab(tabId, pushHistory = true) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.getElementById(`section-${tabId}`).classList.remove('hidden');
        document.querySelectorAll('.tab-btn').forEach(btn => { btn.className = 'tab-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition'; });
        document.getElementById(`btn-${tabId}`).className = 'tab-btn bg-yellow-500 text-black px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap shadow-md transition';
        if (pushHistory) window.history.pushState({ tab: tabId }, '', `#${tabId}`);
        if (tabId === 'overview') loadOverview();
        if (tabId === 'manage-vendors') loadAdminVendors();
        if (tabId === 'manage-ads') loadAdminAds();
    }

    async function loadOverview() {
        const cachedStats = localStorage.getItem('vicnos_admin_stats');
        if (cachedStats) { const s = JSON.parse(cachedStats); document.getElementById('stat-vendors').textContent = s.vendors; document.getElementById('stat-inquiries').textContent = s.inquiries; document.getElementById('stat-commission').textContent = `₦${Number(s.commission).toLocaleString()}`; }
        const { data: vendors } = await db.from('vendors').select('*');
        const { data: inquiries } = await db.from('vendor_inquiries').select('vendor_id');
        const { data: orders } = await db.from('vendor_orders').select('commission_amount').eq('status', 'Released');
        const vCount = vendors ? vendors.length : 0; const iCount = inquiries ? inquiries.length : 0;
        let totalComm = 0; if(orders) orders.forEach(o => totalComm += Number(o.commission_amount));
        document.getElementById('stat-vendors').textContent = vCount; document.getElementById('stat-inquiries').textContent = iCount; document.getElementById('stat-commission').textContent = `₦${totalComm.toLocaleString()}`;
        localStorage.setItem('vicnos_admin_stats', JSON.stringify({ vendors: vCount, inquiries: iCount, commission: totalComm }));
    }

    async function loadAdminVendors() {
        const list = document.getElementById('vendor-list-admin');
        const { data: vendors } = await db.from('vendors').select(`*, profiles (id)`).order('created_at', { ascending: false });
        if (!vendors || vendors.length === 0) { list.innerHTML = '<p class="text-center text-slate-500">No vendors registered yet.</p>'; return; }
        list.innerHTML = vendors.map(v => {
            const isActive = v.is_active; const profileId = v.profiles && v.profiles.length > 0 ? v.profiles[0].id : null;
            return `<div class="bg-slate-900 p-4 rounded-xl border border-slate-700 flex flex-col gap-3 fade-in"><div class="flex justify-between items-center"><div class="flex items-center gap-3"><img src="${v.image_url || 'https://via.placeholder.com/150'}" class="w-12 h-12 rounded-full object-cover border border-slate-600"><div><h3 class="font-bold text-white text-sm">${v.business_name}</h3><p class="text-[10px] text-yellow-400 uppercase">${v.category}</p><p class="text-[10px] text-slate-400 mt-1">${v.address || 'No address provided'}</p></div></div><span class="${isActive ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'} text-[10px] font-bold px-2 py-1 rounded">${isActive ? 'ACTIVE' : 'INACTIVE'}</span></div>${profileId ? `<div class="flex gap-2"><button onclick="resetVendorPassword('${profileId}', '${v.business_name}')" class="flex-1 bg-slate-800 text-white py-2 rounded-lg text-xs font-bold border border-slate-700">Reset PW</button><button onclick="toggleVendorStatus('${profileId}', '${v.id}', ${isActive})" class="flex-1 ${isActive ? 'bg-orange-500/20 text-orange-400' : 'bg-green-500/20 text-green-400'} py-2 rounded-lg text-xs font-bold">${isActive ? 'Deactivate' : 'Activate'}</button><button onclick="deleteVendor('${profileId}', '${v.id}', '${v.business_name}')" class="bg-red-500/20 text-red-400 px-3 py-2 rounded-lg text-xs font-bold"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>` : `<div class="flex gap-2"><button onclick="createVendorLogin('${v.id}', '${v.business_name}')" class="flex-1 bg-blue-500/20 text-blue-400 py-2 rounded-lg text-xs font-bold">Create Login</button><button onclick="deleteVendor(null, '${v.id}', '${v.business_name}')" class="flex-1 bg-red-500/20 text-red-400 py-2 rounded-lg text-xs font-bold">Delete Vendor</button></div>`}</div>`;
        }).join('');
        lucide.createIcons();
    }

    async function resetVendorPassword(userId, name) { const newPassword = prompt(`Enter new password for ${name}:`); if (!newPassword || newPassword.length < 6) return alert("Password must be at least 6 characters."); const { data, error } = await db.functions.invoke('manage-staff', { body: { action: 'reset_password', user_id: userId, new_password: newPassword } }); if (error || data.error) alert("Error: " + (error?.message || data.error)); else alert(`✅ Password reset for ${name}!`); }
    async function toggleVendorStatus(userId, vendorId, currentStatus) { const newStatus = !currentStatus; if (!confirm(`Are you sure you want to ${newStatus ? 'activate' : 'deactivate'} this vendor?`)) return; const { data, error } = await db.functions.invoke('manage-staff', { body: { action: 'toggle_active', user_id: userId, is_active: newStatus } }); if (error || data.error) return alert("Error: " + (error?.message || data.error)); await db.from('vendors').update({ is_active: newStatus }).eq('id', vendorId); loadAdminVendors(); }
    async function deleteVendor(userId, vendorId, name) { if (!confirm(`⚠️ Are you sure you want to PERMANENTLY delete ${name}?`)) return; if (userId) { await db.functions.invoke('manage-staff', { body: { action: 'delete_user', user_id: userId } }); } await db.from('vendors').delete().eq('id', vendorId); loadAdminVendors(); }
    async function createVendorLogin(vendorId, name) { const email = prompt(`Enter email address for ${name}:`); if (!email) return; const password = prompt(`Enter temporary password for ${name} (min 6 chars):`); if (!password || password.length < 6) return alert("Password must be at least 6 characters."); const { data: authData, error: authError } = await db.auth.signUp({ email, password }); if (authError) return alert("Error: " + authError.message); await db.from('profiles').insert({ id: authData.user.id, full_name: name, role: 'vendor', vendor_id: vendorId }); alert(`✅ Login created for ${name}!`); loadAdminVendors(); }

    document.getElementById('vendor-form').addEventListener('submit', async (e) => {
        e.preventDefault(); const btn = document.getElementById('v-btn'); const msg = document.getElementById('v-msg'); btn.innerText = "Creating Login & Vendor..."; btn.disabled = true;
        try {
            const file = document.getElementById('v-image').files[0];
            let imageUrl = null;
            if (file) { imageUrl = await uploadImage(file, 'vendor_images'); }
            const { data, error } = await db.functions.invoke('register-vendor', { body: { email: document.getElementById('v-email').value, password: document.getElementById('v-password').value, business_name: document.getElementById('v-name').value, category: document.getElementById('v-category').value, address: document.getElementById('v-address').value, whatsapp_number: document.getElementById('v-whatsapp').value, image_url: imageUrl } });
            if (error || data.error) throw new Error(error?.message || data.error);
            msg.textContent = "✅ Vendor & Login Created Successfully!"; document.getElementById('vendor-form').reset(); loadAdminVendors();
        } catch (err) { msg.textContent = "Error: " + err.message; msg.className = "mt-2 text-center text-sm font-bold text-red-400"; } 
        finally { btn.innerText = "Save Vendor & Create Login"; btn.disabled = false; setTimeout(() => { msg.textContent = ''; msg.className = "mt-2 text-center text-sm font-bold text-green-400"; }, 4000); }
    });

    async function loadAdminAds() {
        const list = document.getElementById('ad-list-admin');
        // OPTIMIZED: Added limit(20) and order by date to speed up loading
        const { data: ads, error } = await db.from('ads').select('*').order('created_at', { ascending: false }).limit(20);

        if (error) { list.innerHTML = `<p class="text-center text-red-500">Error: ${error.message}</p>`; return; }
        if (!ads || ads.length === 0) { list.innerHTML = '<p class="text-center text-slate-500">No ads found.</p>'; return; }

        list.innerHTML = ads.map(ad => {
            const isLive = ad.is_active && ad.moderation_status === 'approved';
            return `<div class="bg-slate-900 p-3 rounded-xl border border-slate-700 flex flex-col gap-3 fade-in"><div class="flex items-center gap-3"><img src="${ad.image_url || 'https://via.placeholder.com/150'}" loading="lazy" class="w-16 h-16 rounded-lg object-cover border border-slate-600"><div class="flex-1"><h3 class="font-bold text-white text-sm">${ad.title}</h3><p class="text-[10px] text-slate-400 line-clamp-1">${ad.description}</p><span class="${isLive ? 'text-green-400' : 'text-red-400'} text-[10px] font-bold uppercase mt-1 block">${isLive ? '● Live on Guest App' : '○ Hidden / Inactive'}</span></div></div><div class="flex gap-2"><button onclick="editAd('${ad.id}', '${ad.title.replace(/'/g, "\\'")}', '${ad.description.replace(/'/g, "\\'")}', '${ad.ad_link || ''}')" class="flex-1 bg-slate-800 text-white py-2 rounded-lg text-xs font-bold border border-slate-700 flex items-center justify-center gap-1"><i data-lucide="edit" class="w-3 h-3"></i> Edit</button><button onclick="toggleAdStatus('${ad.id}', ${ad.is_active})" class="flex-1 ${isLive ? 'bg-orange-500/20 text-orange-400' : 'bg-green-500/20 text-green-400'} py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1"><i data-lucide="${isLive ? 'eye-off' : 'eye'}" class="w-3 h-3"></i> ${isLive ? 'Take Down' : 'Activate'}</button><button onclick="deleteAd('${ad.id}')" class="bg-red-500/20 text-red-400 px-3 py-2 rounded-lg text-xs font-bold"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></div>`;
        }).join('');
        lucide.createIcons();
    }

    async function toggleAdStatus(id, currentStatus) { const newStatus = !currentStatus; const { error } = await db.from('ads').update({ is_active: newStatus }).eq('id', id); if (error) return alert("Error updating status: " + error.message); loadAdminAds(); }
    async function deleteAd(id) { if (!confirm("⚠️ Are you sure you want to permanently delete this ad?")) return; await db.from('ads').delete().eq('id', id); loadAdminAds(); }
    function editAd(id, title, description, link) { editingAdId = id; document.getElementById('ad-form-title').textContent = "Edit Sponsored Ad"; document.getElementById('a-title').value = title; document.getElementById('a-desc').value = description; document.getElementById('a-link').value = link; document.getElementById('a-btn').textContent = "Update Ad"; document.getElementById('a-cancel-btn').classList.remove('hidden'); switchTab('ad'); }
    function resetAdForm() { editingAdId = null; document.getElementById('ad-form-title').textContent = "Add Sponsored Ad"; document.getElementById('ad-form').reset(); document.getElementById('a-btn').textContent = "Publish Ad"; document.getElementById('a-cancel-btn').classList.add('hidden'); }

    document.getElementById('ad-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('a-btn'); const msg = document.getElementById('a-msg');
        btn.innerText = editingAdId ? "Updating..." : "Publishing..."; btn.disabled = true;
        try {
            const file = document.getElementById('a-image').files[0];
            let imageUrl = null;
            if (file) { imageUrl = await uploadImage(file, 'ad_images'); }
            const adData = { title: document.getElementById('a-title').value, description: document.getElementById('a-desc').value, ad_link: document.getElementById('a-link').value || null, payment_status: 'paid', moderation_status: 'approved', is_active: true };
            if (imageUrl) adData.image_url = imageUrl;
            if (editingAdId) { const { error } = await db.from('ads').update(adData).eq('id', editingAdId); if (error) throw error; msg.textContent = "✅ Ad Updated Successfully!"; } 
            else { const { error } = await db.from('ads').insert(adData); if (error) throw error; msg.textContent = "✅ Ad Published!"; }
            resetAdForm(); loadAdminAds(); switchTab('manage-ads');
        } catch (err) { msg.textContent = "Error: " + err.message; msg.className = "mt-2 text-center text-sm font-bold text-red-400"; } 
        finally { btn.disabled = false; setTimeout(() => { msg.textContent = ''; msg.className = "mt-2 text-center text-sm font-bold text-green-400"; }, 4000); }
    });

    loadOverview();
  </script>
</body>
</html>
