<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DEKY - Super Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Outfit', sans-serif; background-color: #0f172a; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
    .hide-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen pb-10">

  <nav class="bg-slate-900 border-b border-slate-700/50 p-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="bg-yellow-500/20 p-2 rounded-xl border border-yellow-500/30">
        <i data-lucide="shield-check" class="w-6 h-6 text-yellow-400"></i>
      </div>
      <div>
        <h1 class="font-bold text-white text-lg leading-tight">DEKY Network</h1>
        <p class="text-[10px] text-yellow-400 uppercase tracking-widest font-bold">Command Center</p>
      </div>
    </div>
    <a href="dashboard.html" class="bg-slate-800 p-2 rounded-full text-slate-300 hover:bg-slate-700 transition"><i data-lucide="x" class="w-5 h-5"></i></a>
  </nav>

  <!-- Tabs -->
  <div class="bg-slate-900/80 backdrop-blur-md px-2 py-2 flex gap-2 overflow-x-auto hide-scroll border-b border-slate-700/50 sticky top-[68px] z-40">
    <button onclick="switchTab('overview')" id="tab-overview" class="tab-btn bg-yellow-500 text-black px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">Overview</button>
    <button onclick="switchTab('vendor')" id="tab-vendor" class="tab-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">Add Vendor</button>
    <button onclick="switchTab('guide')" id="tab-guide" class="tab-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">Add Guide</button>
    <button onclick="switchTab('ad')" id="tab-ad" class="tab-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">Add Ad</button>
  </div>

  <main class="p-4 max-w-4xl mx-auto mt-4">
    
    <!-- TAB 1: OVERVIEW -->
    <div id="section-overview" class="tab-content block">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
          <div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50">
              <p class="text-xs text-slate-400 font-medium mb-1">Total Vendors</p>
              <p id="stat-vendors" class="text-2xl font-bold text-white">0</p>
          </div>
          <div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50">
              <p class="text-xs text-slate-400 font-medium mb-1">Total Inquiries</p>
              <p id="stat-inquiries" class="text-2xl font-bold text-white">0</p>
          </div>
          <div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50 bg-gradient-to-br from-yellow-500/10 to-transparent">
              <p class="text-xs text-yellow-400 font-bold mb-1">DEKY Commission</p>
              <p id="stat-commission" class="text-2xl font-bold text-yellow-400">₦0</p>
          </div>
          <div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50">
              <p class="text-xs text-slate-400 font-medium mb-1">Active Ads</p>
              <p id="stat-ads" class="text-2xl font-bold text-white">0</p>
          </div>
      </div>

      <div class="bg-slate-800/40 rounded-2xl border border-slate-700/50 overflow-hidden">
        <div class="p-4 border-b border-slate-700/50">
          <h2 class="font-bold text-white">Vendor Network (Ghosting Tracker)</h2>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-900/50 text-slate-400 text-xs uppercase border-b border-slate-700/50">
                <th class="p-3 font-bold">Vendor</th>
                <th class="p-3 font-bold">Category</th>
                <th class="p-3 font-bold text-center">Inquiries</th>
                <th class="p-3 font-bold text-center">Sales</th>
                <th class="p-3 font-bold text-center">Status</th>
              </tr>
            </thead>
            <tbody id="vendor-table-body">
              <tr><td colspan="5" class="p-6 text-center text-slate-500">Loading vendors...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- TAB 2: ADD VENDOR -->
    <div id="section-vendor" class="tab-content hidden bg-slate-800/40 p-5 rounded-2xl border border-slate-700/50">
      <h2 class="font-bold text-white mb-4 text-lg">Add New Vendor</h2>
      <form id="vendor-form" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Business Name</label>
          <input id="v-name" type="text" required placeholder="e.g. Uyi Suya Spot" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Category</label>
          <select id="v-category" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500">
            <option value="Food">Food (Suya, Pizza, etc.)</option>
            <option value="Taxi">Taxi / Ride</option>
            <option value="Spa">Spa / Massage</option>
            <option value="Artisan">Artisan / Shopping</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">WhatsApp Number (with country code, e.g., 2348012345678)</label>
          <input id="v-whatsapp" type="text" required placeholder="2348012345678" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500">
        </div>
        <button type="submit" class="w-full bg-yellow-500 text-black font-bold py-3 rounded-xl mt-2 active:scale-95">Save Vendor</button>
      </form>
      <p id="v-msg" class="mt-2 text-center text-sm font-bold text-green-400"></p>
    </div>

    <!-- TAB 3: ADD GUIDE -->
    <div id="section-guide" class="tab-content hidden bg-slate-800/40 p-5 rounded-2xl border border-slate-700/50">
      <h2 class="font-bold text-white mb-4 text-lg">Add Elite Guide (₦50k Fee)</h2>
      <form id="guide-form" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Full Name</label>
          <input id="g-name" type="text" required placeholder="e.g. Chinedu Okafor" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Bio / Skills</label>
          <textarea id="g-bio" required placeholder="Fluent in English & French. Expert in Benin City history..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500"></textarea>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Image URL (Link to their photo)</label>
          <input id="g-image" type="text" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">WhatsApp Number</label>
          <input id="g-whatsapp" type="text" required placeholder="2348012345678" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500">
        </div>
        <button type="submit" class="w-full bg-yellow-500 text-black font-bold py-3 rounded-xl mt-2 active:scale-95">Save Guide</button>
      </form>
      <p id="g-msg" class="mt-2 text-center text-sm font-bold text-green-400"></p>
    </div>

    <!-- TAB 4: ADD AD -->
    <div id="section-ad" class="tab-content hidden bg-slate-800/40 p-5 rounded-2xl border border-slate-700/50">
      <h2 class="font-bold text-white mb-4 text-lg">Add Sponsored Ad</h2>
      <form id="ad-form" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Ad Title</label>
          <input id="a-title" type="text" required placeholder="e.g. Rent a Prado" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Short Description</label>
          <input id="a-desc" type="text" required placeholder="e.g. XYZ Motors - 10% off for guests" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Image URL (Optional)</label>
          <input id="a-image" type="text" placeholder="https://..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500">
        </div>
        <button type="submit" class="w-full bg-yellow-500 text-black font-bold py-3 rounded-xl mt-2 active:scale-95">Publish Ad</button>
      </form>
      <p id="a-msg" class="mt-2 text-center text-sm font-bold text-green-400"></p>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.getElementById(`section-${tabId}`).classList.remove('hidden');
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.className = 'tab-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap';
        });
        document.getElementById(`tab-${tabId}`).className = 'tab-btn bg-yellow-500 text-black px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap';
        
        if(tabId === 'overview') loadOverview();
    }

    async function loadOverview() {
        const { data: vendors } = await db.from('vendors').select('*').order('created_at', { ascending: false });
        const { data: inquiries } = await db.from('vendor_inquiries').select('vendor_id');
        const { data: orders } = await db.from('vendor_orders').select('commission_amount').eq('status', 'Released');
        const { data: ads } = await db.from('ads').select('id').eq('is_active', true);

        document.getElementById('stat-vendors').textContent = vendors ? vendors.length : 0;
        document.getElementById('stat-inquiries').textContent = inquiries ? inquiries.length : 0;
        document.getElementById('stat-ads').textContent = ads ? ads.length : 0;
        
        let totalComm = 0;
        if(orders) orders.forEach(o => totalComm += Number(o.commission_amount));
        document.getElementById('stat-commission').textContent = `₦${totalComm.toLocaleString()}`;

        const tbody = document.getElementById('vendor-table-body');
        if (!vendors || vendors.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-slate-500">No vendors added yet.</td></tr>';
            return;
        }

        tbody.innerHTML = vendors.map(v => {
            const vInq = inquiries ? inquiries.filter(i => i.vendor_id === v.id).length : 0;
            let badge = v.is_active ? '<span class="text-green-400">Active</span>' : '<span class="text-red-400">Suspended</span>';
            if (v.is_active && vInq >= 5) badge = '<span class="text-yellow-400">Ghosting Warning</span>';
            
            return `
                <tr class="border-b border-slate-700/50">
                    <td class="p-3 text-sm text-white font-bold">${v.business_name}</td>
                    <td class="p-3 text-sm text-slate-300">${v.category}</td>
                    <td class="p-3 text-sm text-center text-slate-300">${vInq}</td>
                    <td class="p-3 text-sm text-center text-slate-300">0</td>
                    <td class="p-3 text-sm text-center">${badge}</td>
                </tr>
            `;
        }).join('');
    }

    // Form: Add Vendor
    document.getElementById('vendor-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('v-msg');
        msg.textContent = "Saving...";
        const { error } = await db.from('vendors').insert({
            business_name: document.getElementById('v-name').value,
            category: document.getElementById('v-category').value,
            whatsapp_number: document.getElementById('v-whatsapp').value,
            phone_number: document.getElementById('v-whatsapp').value,
            is_active: true
        });
        if(error) { msg.textContent = error.message; msg.className = "mt-2 text-center text-sm text-red-400"; }
        else { msg.textContent = "✅ Vendor Added!"; msg.className = "mt-2 text-center text-sm text-green-400"; document.getElementById('vendor-form').reset(); }
    });

    // Form: Add Guide
    document.getElementById('guide-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('g-msg');
        msg.textContent = "Saving...";
        const { error } = await db.from('vip_guides').insert({
            full_name: document.getElementById('g-name').value,
            bio: document.getElementById('g-bio').value,
            image_url: document.getElementById('g-image').value,
            whatsapp_number: document.getElementById('g-whatsapp').value,
            is_active: true
        });
        if(error) { msg.textContent = error.message; msg.className = "mt-2 text-center text-sm text-red-400"; }
        else { msg.textContent = "✅ Guide Added!"; msg.className = "mt-2 text-center text-sm text-green-400"; document.getElementById('guide-form').reset(); }
    });

    // Form: Add Ad
    document.getElementById('ad-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('a-msg');
        msg.textContent = "Saving...";
        const { error } = await db.from('ads').insert({
            title: document.getElementById('a-title').value,
            description: document.getElementById('a-desc').value,
            image_url: document.getElementById('a-image').value,
            is_active: true
        });
        if(error) { msg.textContent = error.message; msg.className = "mt-2 text-center text-sm text-red-400"; }
        else { msg.textContent = "✅ Ad Published!"; msg.className = "mt-2 text-center text-sm text-green-400"; document.getElementById('ad-form').reset(); }
    });

    loadOverview();
  </script>
</body>
</html>
