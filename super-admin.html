<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DEKY - Super Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Outfit', sans-serif; background-color: #0f172a; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
    .hide-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen pb-10">

  <nav class="bg-slate-900 border-b border-slate-700/50 p-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="bg-yellow-500/20 p-2 rounded-xl border border-yellow-500/30">
        <i data-lucide="shield-check" class="w-6 h-6 text-yellow-400"></i>
      </div>
      <div>
        <h1 class="font-bold text-white text-lg leading-tight">DEKY Network</h1>
        <p class="text-[10px] text-yellow-400 uppercase tracking-widest font-bold">Command Center</p>
      </div>
    </div>
    <a href="dashboard.html" class="bg-slate-800 p-2 rounded-full text-slate-300 hover:bg-slate-700 transition"><i data-lucide="x" class="w-5 h-5"></i></a>
  </nav>

  <!-- Tabs -->
  <div class="bg-slate-900/80 backdrop-blur-md px-2 py-2 flex gap-2 overflow-x-auto hide-scroll border-b border-slate-700/50 sticky top-[68px] z-40">
    <button onclick="switchTab('overview')" id="tab-overview" class="tab-btn bg-yellow-500 text-black px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap shadow-md">Overview</button>
    <button onclick="switchTab('manage-vendors')" id="tab-manage-vendors" class="tab-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">Manage Vendors</button>
    <button onclick="switchTab('vendor')" id="tab-vendor" class="tab-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">Add Vendor</button>
    <button onclick="switchTab('guide')" id="tab-guide" class="tab-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">Add Guide</button>
    <button onclick="switchTab('ad')" id="tab-ad" class="tab-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">Add Ad</button>
  </div>

  <main class="p-4 max-w-4xl mx-auto mt-4">
    
    <!-- TAB 1: OVERVIEW -->
    <div id="section-overview" class="tab-content block">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
          <div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50">
              <p class="text-xs text-slate-400 font-medium mb-1">Total Vendors</p>
              <p id="stat-vendors" class="text-2xl font-bold text-white">0</p>
          </div>
          <div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50">
              <p class="text-xs text-slate-400 font-medium mb-1">Total Inquiries</p>
              <p id="stat-inquiries" class="text-2xl font-bold text-white">0</p>
          </div>
          <div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50 bg-gradient-to-br from-yellow-500/10 to-transparent">
              <p class="text-xs text-yellow-400 font-bold mb-1">DEKY Commission</p>
              <p id="stat-commission" class="text-2xl font-bold text-yellow-400">₦0</p>
          </div>
      </div>
      <!-- Table removed here, moved to Manage Vendors -->
    </div>

    <!-- TAB 2: MANAGE VENDORS -->
    <div id="section-manage-vendors" class="tab-content hidden">
      <div class="bg-slate-800/40 p-5 rounded-2xl border border-slate-700/50">
        <h2 class="font-bold text-white mb-4">Registered Vendors</h2>
        <div id="vendor-list-admin" class="space-y-4">
            <p class="text-center text-slate-500">Loading vendors...</p>
        </div>
      </div>
    </div>

    <!-- TAB 3: ADD VENDOR (Manual) -->
    <div id="section-vendor" class="tab-content hidden bg-slate-800/40 p-5 rounded-2xl border border-slate-700/50">
      <h2 class="font-bold text-white mb-4 text-lg">Manually Add Vendor</h2>
      <form id="vendor-form" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Business Name</label>
          <input id="v-name" type="text" required placeholder="e.g. Uyi Suya Spot" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Category</label>
          <select id="v-category" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500">
            <option value="Local Street Food">Local Street Food (Suya, Pizza)</option>
            <option value="Transport">Transport & Rides</option>
            <option value="Fashion & Tailoring">Fashion & Tailoring</option>
            <option value="Spa & Wellness">Spa & Wellness</option>
            <option value="Shopping & Artisans">Shopping & Artisans</option>
            <option value="Tours & Guides">Tours & Guides</option>
            <option value="Romance & Gifts">Romance & Gifts</option>
            <option value="Events">Events</option>
            <option value="Tech & Essentials">Tech & Essentials</option>
            <option value="Pharmacy & Wellness">Pharmacy & Wellness (Manpower)</option>
            <option value="Financial Services">Currency Exchange</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Passport Photograph</label>
          <input id="v-image" type="file" accept="image/*" class="w-full bg-slate-900 border border-slate-700 p-2 rounded-xl text-white text-sm outline-none">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">WhatsApp Number</label>
          <input id="v-whatsapp" type="text" required placeholder="2348012345678" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500">
        </div>
        <button type="submit" id="v-btn" class="w-full bg-yellow-500 text-black font-bold py-3 rounded-xl mt-2 active:scale-95 transition">Save Vendor</button>
      </form>
      <p id="v-msg" class="mt-2 text-center text-sm font-bold text-green-400"></p>
    </div>

    <!-- TAB 4: ADD GUIDE -->
    <div id="section-guide" class="tab-content hidden bg-slate-800/40 p-5 rounded-2xl border border-slate-700/50">
      <h2 class="font-bold text-white mb-4 text-lg">Add Elite Guide (₦50k Fee)</h2>
      <form id="guide-form" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Full Name</label>
          <input id="g-name" type="text" required placeholder="e.g. Chinedu Okafor" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Bio / Skills</label>
          <textarea id="g-bio" required placeholder="Fluent in English & French..." class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500"></textarea>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Passport Photograph</label>
          <input id="g-image" type="file" accept="image/*" class="w-full bg-slate-900 border border-slate-700 p-2 rounded-xl text-white text-sm outline-none">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">WhatsApp Number</label>
          <input id="g-whatsapp" type="text" required placeholder="2348012345678" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500">
        </div>
        <button type="submit" id="g-btn" class="w-full bg-yellow-500 text-black font-bold py-3 rounded-xl mt-2 active:scale-95 transition">Save Guide</button>
      </form>
      <p id="g-msg" class="mt-2 text-center text-sm font-bold text-green-400"></p>
    </div>

    <!-- TAB 5: ADD AD -->
    <div id="section-ad" class="tab-content hidden bg-slate-800/40 p-5 rounded-2xl border border-slate-700/50">
      <h2 class="font-bold text-white mb-4 text-lg">Add Sponsored Ad</h2>
      <form id="ad-form" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Ad Title</label>
          <input id="a-title" type="text" required placeholder="e.g. Rent a Prado" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Short Description</label>
          <input id="a-desc" type="text" required placeholder="e.g. XYZ Motors - 10% off" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-yellow-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Ad Banner Image</label>
          <input id="a-image" type="file" accept="image/*" class="w-full bg-slate-900 border border-slate-700 p-2 rounded-xl text-white text-sm outline-none">
        </div>
        <button type="submit" id="a-btn" class="w-full bg-yellow-500 text-black font-bold py-3 rounded-xl mt-2 active:scale-95 transition">Publish Ad</button>
      </form>
      <p id="a-msg" class="mt-2 text-center text-sm font-bold text-green-400"></p>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    async function uploadImage(file, bucketName) {
        if (!file) return null;
        const options = { maxSizeMB: 0.3, maxWidthOrHeight: 800, useWebWorker: true };
        const compressedFile = await imageCompression(file, options);
        const fileName = `${bucketName}-${Date.now()}.jpg`;
        const { error } = await db.storage.from(bucketName).upload(fileName, compressedFile);
        if (error) throw error;
        const { data } = db.storage.from(bucketName).getPublicUrl(fileName);
        return data.publicUrl;
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.getElementById(`section-${tabId}`).classList.remove('hidden');
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.className = 'tab-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap';
        });
        document.getElementById(`tab-${tabId}`).className = 'tab-btn bg-yellow-500 text-black px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap shadow-md';
        
        if(tabId === 'overview') loadOverview();
        if(tabId === 'manage-vendors') loadAdminVendors();
    }

    async function loadOverview() {
        const { data: vendors } = await db.from('vendors').select('*');
        const { data: inquiries } = await db.from('vendor_inquiries').select('vendor_id');
        const { data: orders } = await db.from('vendor_orders').select('commission_amount').eq('status', 'Released');

        document.getElementById('stat-vendors').textContent = vendors ? vendors.length : 0;
        document.getElementById('stat-inquiries').textContent = inquiries ? inquiries.length : 0;
        
        let totalComm = 0;
        if(orders) orders.forEach(o => totalComm += Number(o.commission_amount));
        document.getElementById('stat-commission').textContent = `₦${totalComm.toLocaleString()}`;
    }

    // --- MANAGE VENDORS TAB ---
    async function loadAdminVendors() {
        const list = document.getElementById('vendor-list-admin');
        
        // Fetch vendors AND their linked profile IDs (for password resets)
        const { data: vendors } = await db.from('vendors').select(`
            *,
            profiles (id)
        `).order('created_at', { ascending: false });

        if (!vendors || vendors.length === 0) {
            list.innerHTML = '<p class="text-center text-slate-500">No vendors registered yet.</p>';
            return;
        }

        list.innerHTML = vendors.map(v => {
            const isActive = v.is_active;
            const profileId = v.profiles && v.profiles.length > 0 ? v.profiles[0].id : null;
            
            return `
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 flex flex-col gap-3">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <img src="${v.image_url || 'https://via.placeholder.com/150'}" class="w-12 h-12 rounded-full object-cover border border-slate-600">
                            <div>
                                <h3 class="font-bold text-white text-sm">${v.business_name}</h3>
                                <p class="text-[10px] text-yellow-400 uppercase">${v.category}</p>
                            </div>
                        </div>
                        <span class="${isActive ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'} text-[10px] font-bold px-2 py-1 rounded">
                            ${isActive ? 'ACTIVE' : 'INACTIVE'}
                        </span>
                    </div>
                    
                    ${profileId ? `
                    <div class="flex gap-2">
                        <button onclick="resetVendorPassword('${profileId}', '${v.business_name}')" class="flex-1 bg-slate-800 text-white py-2 rounded-lg text-xs font-bold border border-slate-700">Reset PW</button>
                        <button onclick="toggleVendorStatus('${profileId}', '${v.id}', ${isActive})" class="flex-1 ${isActive ? 'bg-red-500/20 text-red-400' : 'bg-green-500/20 text-green-400'} py-2 rounded-lg text-xs font-bold">
                            ${isActive ? 'Deactivate' : 'Activate'}
                        </button>
                    </div>` : `<p class="text-xs text-slate-500 text-center">No login linked</p>`}
                </div>
            `;
        }).join('');
    }

    async function resetVendorPassword(userId, name) {
        const newPassword = prompt(`Enter new password for ${name}:`);
        if (!newPassword || newPassword.length < 6) return alert("Password must be at least 6 characters.");
        
        const { data, error } = await db.functions.invoke('manage-staff', {
            body: { action: 'reset_password', user_id: userId, new_password: newPassword }
        });
        
        if (error || data.error) alert("Error: " + (error?.message || data.error));
        else alert(`✅ Password reset for ${name}!`);
    }

    async function toggleVendorStatus(userId, vendorId, currentStatus) {
        const newStatus = !currentStatus;
        if (!confirm(`Are you sure you want to ${newStatus ? 'activate' : 'deactivate'} this vendor?`)) return;

        // 1. Update Auth/Profile status (using manage-staff function)
        const { data, error } = await db.functions.invoke('manage-staff', {
            body: { action: 'toggle_active', user_id: userId, is_active: newStatus }
        });
        
        if (error || data.error) return alert("Error: " + (error?.message || data.error));

        // 2. Update Vendor table status
        await db.from('vendors').update({ is_active: newStatus }).eq('id', vendorId);
        
        loadAdminVendors();
    }

    // --- FORMS (Add Vendor, Guide, Ad) ---
    document.getElementById('vendor-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('v-btn');
        const msg = document.getElementById('v-msg');
        btn.innerText = "Saving..."; btn.disabled = true;

        try {
            const file = document.getElementById('v-image').files[0];
            const imageUrl = await uploadImage(file, 'vendor_images');

            await db.from('vendors').insert({
                business_name: document.getElementById('v-name').value,
                category: document.getElementById('v-category').value,
                whatsapp_number: document.getElementById('v-whatsapp').value,
                phone_number: document.getElementById('v-whatsapp').value,
                image_url: imageUrl,
                is_active: true
            });

            msg.textContent = "✅ Vendor Added!";
            document.getElementById('vendor-form').reset();
        } catch (err) {
            msg.textContent = "Error: " + err.message;
        } finally {
            btn.innerText = "Save Vendor"; btn.disabled = false;
            setTimeout(() => msg.textContent = '', 3000);
        }
    });

    document.getElementById('guide-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('g-btn');
        const msg = document.getElementById('g-msg');
        btn.innerText = "Saving..."; btn.disabled = true;

        try {
            const file = document.getElementById('g-image').files[0];
            const imageUrl = await uploadImage(file, 'vendor_images');

            await db.from('vip_guides').insert({
                full_name: document.getElementById('g-name').value,
                bio: document.getElementById('g-bio').value,
                image_url: imageUrl,
                whatsapp_number: document.getElementById('g-whatsapp').value,
                is_active: true
            });

            msg.textContent = "✅ Guide Added!";
            document.getElementById('guide-form').reset();
        } catch (err) {
            msg.textContent = "Error: " + err.message;
        } finally {
            btn.innerText = "Save Guide"; btn.disabled = false;
            setTimeout(() => msg.textContent = '', 3000);
        }
    });

    document.getElementById('ad-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('a-btn');
        const msg = document.getElementById('a-msg');
        btn.innerText = "Publishing..."; btn.disabled = true;

        try {
            const file = document.getElementById('a-image').files[0];
            const imageUrl = await uploadImage(file, 'ad_images');

            await db.from('ads').insert({
                title: document.getElementById('a-title').value,
                description: document.getElementById('a-desc').value,
                image_url: imageUrl,
                payment_status: 'paid', // Admin-created ads are auto-paid
                moderation_status: 'approved',
                is_active: true
            });

            msg.textContent = "✅ Ad Published!";
            document.getElementById('ad-form').reset();
        } catch (err) {
            msg.textContent = "Error: " + err.message;
        } finally {
            btn.innerText = "Publish Ad"; btn.disabled = false;
            setTimeout(() => msg.textContent = '', 3000);
        }
    });

    loadOverview();
  </script>
</body>
</html>
