<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vicnos Hotel - Live Orders</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen p-4">

  <div class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border border-gray-100 gap-4">
    <div class="flex items-center gap-3">
      <div class="bg-red-100 p-2 rounded-xl text-red-600 animate-pulse"><i data-lucide="bell" class="w-6 h-6"></i></div>
      <div>
        <h1 class="font-bold text-gray-800 text-lg">Kitchen Order Board</h1>
        <p class="text-xs text-gray-500">Voice alerts are active</p>
      </div>
    </div>
    
    <div class="flex gap-2">
        <button id="sound-btn" onclick="enableSound()" class="bg-yellow-100 text-yellow-800 px-4 py-2 rounded-xl text-sm font-bold shadow-sm animate-bounce">
            🔊 Enable Voice Alerts
        </button>
        <button onclick="window.location.href='dashboard.html'" class="bg-gray-100 px-4 py-2 rounded-xl text-sm font-bold text-gray-600">Back</button>
    </div>
  </div>

  <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <p class="text-gray-500 col-span-full text-center py-10">No active orders right now.</p>
  </div>

  <script>
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    let soundEnabled = false;

    function enableSound() {
        soundEnabled = true;
        document.getElementById('sound-btn').innerText = "✅ Voice Alerts Active";
        document.getElementById('sound-btn').className = "bg-green-100 text-green-800 px-4 py-2 rounded-xl text-sm font-bold shadow-sm";
        
        // Play a test voice to prove it works
        announceOrder("Test", [{qty: 1, name: "System Check"}]);
    }

    // --- THE TEXT-TO-SPEECH ENGINE ---
    function announceOrder(roomNum, items) {
        if (!soundEnabled) return;

        // 1. Create the text string
        let itemList = items.map(i => `${i.qty} ${i.name}`).join(", ");
        let text = `Attention Kitchen. New order from Room ${roomNum}. ${itemList}. Please check the screen.`;

        // 2. Set up the voice
        const utterance = new SpeechSynthesisUtterance(text);
        
        // Find an English voice (usually works best)
        const voices = window.speechSynthesis.getVoices();
        const englishVoice = voices.find(voice => voice.lang.includes('en'));
        if (englishVoice) utterance.voice = englishVoice;

        // 3. Make it sound urgent
        utterance.rate = 0.9; // Slightly slower
        utterance.pitch = 1.1; // Slightly higher pitch
        utterance.volume = 1.0; // Max volume

        // 4. Speak!
        window.speechSynthesis.speak(utterance);
    }

    async function loadOrders() {
      const grid = document.getElementById('orders-grid');
      
      const { data: orders, error } = await db.from('guest_orders')
        .select(`*, bookings ( guests ( full_name ) )`)
        .neq('status', 'Delivered')
        .order('created_at', { ascending: true });

      if (error) {
        grid.innerHTML = `<p class="text-red-500 col-span-full text-center">Error loading orders.</p>`;
        return;
      }

      if (!orders || orders.length === 0) {
        grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-10">No active orders right now. Relax! ☕</p>';
        return;
      }

      grid.innerHTML = orders.map(order => {
        const time = new Date(order.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        let guestName = order.bookings?.guests?.full_name || "Unknown Guest";
        
        let statusColor = "bg-yellow-100 text-yellow-800";
        if(order.status === 'Preparing') statusColor = "bg-blue-100 text-blue-800";
        if(order.status === 'On the Way') statusColor = "bg-purple-100 text-purple-800";

        let itemsHtml = '';
        order.items.forEach(item => {
            itemsHtml += `<li class="flex justify-between border-b border-gray-100 py-1 text-sm">
                            <span class="font-bold text-gray-800">${item.qty}x ${item.name}</span>
                          </li>`;
        });

        return `
          <div class="bg-white rounded-2xl shadow-md border-t-4 border-orange-500 overflow-hidden flex flex-col">
            <div class="bg-gray-50 p-3 flex justify-between items-center border-b">
              <div>
                <span class="bg-blue-600 text-white font-bold text-xs px-2 py-1 rounded">Room ${order.room_number || 'N/A'}</span>
                <span class="text-xs font-bold px-2 py-1 rounded ml-1 ${statusColor}">${order.status}</span>
                <p class="font-bold text-gray-800 text-sm mt-2">${guestName}</p>
                <p class="text-[10px] text-gray-500">Ordered at ${time}</p>
              </div>
              <p class="font-extrabold text-blue-600">₦${Number(order.total_amount).toLocaleString()}</p>
            </div>
            
            <div class="p-4 flex-1">
              <ul class="mb-4">${itemsHtml}</ul>
              
              <div class="bg-gray-50 p-2 rounded-xl border">
                <label class="block text-[10px] font-bold text-gray-500 mb-1">Update Status & ETA</label>
                <div class="flex gap-2">
                    <select id="status-${order.id}" class="flex-1 text-xs border rounded-lg p-1 outline-none">
                        <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
                        <option value="Preparing" ${order.status === 'Preparing' ? 'selected' : ''}>Preparing</option>
                        <option value="On the Way" ${order.status === 'On the Way' ? 'selected' : ''}>On the Way</option>
                        <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                    </select>
                    <input id="eta-${order.id}" type="number" value="${order.estimated_minutes || 30}" class="w-16 text-xs border rounded-lg p-1 outline-none" placeholder="Mins">
                    <button onclick="updateOrder('${order.id}')" class="bg-black text-white px-3 py-1 rounded-lg text-xs font-bold active:scale-95">Save</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function updateOrder(id) {
      const newStatus = document.getElementById(`status-${id}`).value;
      const newEta = document.getElementById(`eta-${id}`).value;
      
      await db.from('guest_orders').update({ 
          status: newStatus,
          estimated_minutes: newEta
      }).eq('id', id);
      
      loadOrders(); 
    }

    // Realtime Listener with Voice Announcement
    db.channel('custom-insert-channel')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'guest_orders' }, payload => {
        const newOrder = payload.new;
        // Trigger the voice announcement
        announceOrder(newOrder.room_number || 'Unknown', newOrder.items);
        loadOrders();
      })
      .subscribe();

    // Pre-load voices so they are ready when the order comes in
    window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };

    loadOrders();
  </script>
</body>
</html>
