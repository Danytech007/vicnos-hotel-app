<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos - Kitchen Display</title>
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) { registration.unregister(); }
      });
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Outfit', sans-serif; background-color: #0b1120; color: #f8fafc; -webkit-tap-highlight-color: transparent; user-select: none; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse-border { 0% { border-color: rgba(251, 191, 36, 0.3); } 50% { border-color: rgba(251, 191, 36, 1); box-shadow: 0 0 15px rgba(251, 191, 36, 0.5); } 100% { border-color: rgba(251, 191, 36, 0.3); } }
    .new-order { animation: pulse-border 2s infinite; }
  </style>
</head>
<body class="min-h-screen pb-10">

  <nav class="bg-slate-900/80 backdrop-blur-md border-b border-slate-700 sticky top-0 z-50 p-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="bg-slate-800 p-2 rounded-xl text-slate-300 hover:bg-slate-700 transition"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
      <div><h1 class="font-bold text-white text-lg leading-tight">Kitchen Board</h1><p class="text-[10px] text-amber-400 font-bold uppercase tracking-wider">Chef's Display</p></div>
    </div>
    <div class="bg-emerald-500/20 px-3 py-1 rounded-full border border-emerald-500/30 flex items-center gap-2">
      <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
      <span class="text-xs font-bold text-emerald-400">Live Sync</span>
    </div>
  </nav>

  <main class="p-4 max-w-7xl mx-auto space-y-6 mt-2">
    
    <div class="grid grid-cols-3 gap-3">
      <div class="glass-card p-4 rounded-xl text-center border-l-4 border-amber-500">
        <p class="text-[10px] text-slate-400 uppercase font-bold">New Orders</p>
        <p id="stat-new" class="text-3xl font-black text-amber-400">0</p>
      </div>
      <div class="glass-card p-4 rounded-xl text-center border-l-4 border-blue-500">
        <p class="text-[10px] text-slate-400 uppercase font-bold">Cooking</p>
        <p id="stat-preparing" class="text-3xl font-black text-blue-400">0</p>
      </div>
      <div class="glass-card p-4 rounded-xl text-center border-l-4 border-emerald-500">
        <p class="text-[10px] text-slate-400 uppercase font-bold">Ready to Serve</p>
        <p id="stat-ready" class="text-3xl font-black text-emerald-400">0</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div>
        <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider mb-3 flex items-center gap-2"><i data-lucide="bell" class="w-4 h-4 text-amber-500"></i> New Requests</h2>
        <div id="col-new" class="space-y-3"><p class="text-center text-slate-500 py-6 text-sm">No new orders.</p></div>
      </div>
      <div>
        <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider mb-3 flex items-center gap-2"><i data-lucide="flame" class="w-4 h-4 text-blue-500"></i> Currently Cooking</h2>
        <div id="col-preparing" class="space-y-3"><p class="text-center text-slate-500 py-6 text-sm">Nothing on the stove.</p></div>
      </div>
      <div>
        <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider mb-3 flex items-center gap-2"><i data-lucide="check-circle" class="w-4 h-4 text-emerald-500"></i> Ready for Pickup</h2>
        <div id="col-ready" class="space-y-3"><p class="text-center text-slate-500 py-6 text-sm">No food ready.</p></div>
      </div>
    </div>
  </main>

  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.log(err))); }

    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    let lastOrderCount = 0;

    async function loadOrders() {
      const { data: orders } = await db.from('guest_orders').select('*').eq('department', 'Kitchen').in('status', ['Pending', 'Preparing', 'Ready']).order('created_at', { ascending: true });

      if (orders && orders.length > lastOrderCount) playNotificationSound();
      lastOrderCount = orders ? orders.length : 0;

      const colNew = document.getElementById('col-new');
      const colPreparing = document.getElementById('col-preparing');
      const colReady = document.getElementById('col-ready');

      let countNew = 0, countPreparing = 0, countReady = 0;
      colNew.innerHTML = ''; colPreparing.innerHTML = ''; colReady.innerHTML = '';

      if (!orders || orders.length === 0) {
        colNew.innerHTML = '<p class="text-center text-slate-500 py-6 text-sm">No new orders.</p>';
        colPreparing.innerHTML = '<p class="text-center text-slate-500 py-6 text-sm">Nothing on the stove.</p>';
        colReady.innerHTML = '<p class="text-center text-slate-500 py-6 text-sm">No food ready.</p>';
        updateStats(0, 0, 0);
        return;
      }

      orders.forEach(order => {
        let itemsHtml = '';
        try {
          const items = typeof order.items === 'string' ? JSON.parse(order.items) : order.items;
          if (Array.isArray(items)) {
            itemsHtml = items.map(item => `<div class="flex justify-between border-b border-slate-700/50 py-1"><span class="text-white font-bold">${item.quantity || item.qty || 1}x ${item.name || item.item_name}</span></div>`).join('');
          }
        } catch(e) { itemsHtml = `<p class="text-white text-xs">Error reading items</p>`; }

        const orderCard = `
          <div class="glass-card p-4 rounded-xl ${order.status === 'Pending' ? 'new-order border-2 border-amber-500/50' : 'border border-slate-700'} fade-in">
            <div class="flex justify-between items-start mb-3 border-b border-slate-700 pb-2">
              <div>
                <h3 class="font-black text-lg text-white">${order.room_number ? 'Room ' + order.room_number : 'Table ' + (order.table_number || 'N/A')}</h3>
                <p class="text-[10px] text-slate-400">${new Date(order.created_at).toLocaleTimeString()}</p>
              </div>
            </div>
            <div class="space-y-1 mb-4">${itemsHtml}</div>
            <div class="mt-4">
              ${order.status === 'Pending' ? `<button onclick="updateStatus('${order.id}', 'Preparing')" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2 rounded-lg text-sm transition">Start Cooking</button>` : ''}
              ${order.status === 'Preparing' ? `<button onclick="updateStatus('${order.id}', 'Ready')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg text-sm transition">Food is Ready</button>` : ''}
              ${order.status === 'Ready' ? `<p class="text-center text-xs text-emerald-400 font-bold">Waiting for Waitress...</p>` : ''}
            </div>
          </div>
        `;

        if (order.status === 'Pending') { colNew.innerHTML += orderCard; countNew++; }
        if (order.status === 'Preparing') { colPreparing.innerHTML += orderCard; countPreparing++; }
        if (order.status === 'Ready') { colReady.innerHTML += orderCard; countReady++; }
      });

      if (countNew === 0) colNew.innerHTML = '<p class="text-center text-slate-500 py-6 text-sm">No new orders.</p>';
      if (countPreparing === 0) colPreparing.innerHTML = '<p class="text-center text-slate-500 py-6 text-sm">Nothing on the stove.</p>';
      if (countReady === 0) colReady.innerHTML = '<p class="text-center text-slate-500 py-6 text-sm">No food ready.</p>';

      updateStats(countNew, countPreparing, countReady);
    }

    function updateStats(n, p, r) {
      document.getElementById('stat-new').textContent = n;
      document.getElementById('stat-preparing').textContent = p;
      document.getElementById('stat-ready').textContent = r;
    }

    async function updateStatus(orderId, newStatus) {
      await db.from('guest_orders').update({ status: newStatus }).eq('id', orderId);
      loadOrders();
    }

    function playNotificationSound() {
      try { new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play().catch(e => {}); } catch(err) {}
    }

    loadOrders();
    setInterval(loadOrders, 10000);
  </script>
</body>
</html>
