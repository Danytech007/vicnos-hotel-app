<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vicnos Hotel - Live Orders</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen p-4">

  <!-- Header -->
  <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
    <div class="flex items-center gap-3">
      <div class="bg-red-100 p-2 rounded-xl text-red-600 animate-pulse"><i data-lucide="bell" class="w-6 h-6"></i></div>
      <div>
        <h1 class="font-bold text-gray-800 text-lg">Live Order Board</h1>
        <p class="text-xs text-gray-500">Listening for new orders...</p>
      </div>
    </div>
    <button onclick="window.location.href='dashboard.html'" class="bg-gray-100 px-4 py-2 rounded-xl text-sm font-bold text-gray-600">Back</button>
  </div>

  <!-- Orders Grid -->
  <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <p class="text-gray-500 col-span-full text-center py-10">No pending orders right now.</p>
  </div>

  <!-- Notification Sound -->
  <audio id="notification-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

  <script>
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    async function loadOrders() {
      const grid = document.getElementById('orders-grid');
      
      const { data: orders, error } = await db.from('guest_orders')
        .select('*')
        .eq('status', 'Pending')
        .order('created_at', { ascending: true });

      if (error) {
        grid.innerHTML = `<p class="text-red-500 col-span-full text-center">Error loading orders.</p>`;
        return;
      }

      if (!orders || orders.length === 0) {
        grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-10">No pending orders right now. Relax! ☕</p>';
        return;
      }

      grid.innerHTML = orders.map(order => {
        const time = new Date(order.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        let itemsHtml = '';
        order.items.forEach(item => {
            itemsHtml += `<li class="flex justify-between border-b border-gray-100 py-1">
                            <span class="font-bold text-gray-800">${item.qty}x ${item.name}</span>
                          </li>`;
        });

        return `
          <div class="bg-white rounded-2xl shadow-md border-t-4 border-orange-500 overflow-hidden flex flex-col">
            <div class="bg-gray-50 p-3 flex justify-between items-center border-b">
              <div>
                <span class="bg-blue-600 text-white font-bold text-xs px-2 py-1 rounded">Room ${order.room_number || 'N/A'}</span>
                <p class="text-[10px] text-gray-500 mt-1">Ordered at ${time}</p>
              </div>
              <p class="font-extrabold text-blue-600">₦${Number(order.total_amount).toLocaleString()}</p>
            </div>
            
            <div class="p-4 flex-1">
              <ul class="mb-4">
                ${itemsHtml}
              </ul>
            </div>

            <div class="p-3 bg-white border-t">
              <button onclick="fulfillOrder('${order.id}')" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold active:scale-95 transition shadow-lg shadow-green-500/30">
                ✅ Mark as Fulfilled
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function fulfillOrder(id) {
      await db.from('guest_orders').update({ status: 'Completed' }).eq('id', id);
      loadOrders(); 
    }

    // Realtime Listener for new orders
    db.channel('custom-insert-channel')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'guest_orders' }, payload => {
        document.getElementById('notification-sound').play();
        loadOrders();
      })
      .subscribe();

    loadOrders();
  </script>
</body>
</html>
