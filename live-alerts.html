<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VICNOS - LIVE ALERTS</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#dc2626">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap');
    
    body { 
      font-family: 'Outfit', sans-serif; 
      background-color: #0b1120; 
      color: #f8fafc; 
      -webkit-tap-highlight-color: transparent; 
      user-select: none; 
      overflow: hidden; /* Prevents scrolling */
    }
    
    .glass-card { 
      background: rgba(30, 41, 59, 0.7); 
      backdrop-filter: blur(12px); 
      border: 1px solid rgba(255, 255, 255, 0.08); 
    }
    
    /* The massive full-screen flash */
    @keyframes flash-red {
      0% { background-color: #dc2626; box-shadow: inset 0 0 0 0 rgba(220, 38, 38, 0); }
      50% { background-color: #7f1d1d; box-shadow: inset 0 0 150px 20px rgba(220, 38, 38, 0.8); }
      100% { background-color: #dc2626; box-shadow: inset 0 0 0 0 rgba(220, 38, 38, 0); }
    }
    
    .blink-active { 
      animation: flash-red 1s infinite; 
    }
    
    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }
    
    .ring-pulse {
      animation: pulse-ring 1.5s infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center transition-colors duration-300 relative">

  <!-- SOUND UNLOCK OVERLAY (Browsers block audio until user interaction) -->
  <div id="sound-unlock-overlay" class="absolute inset-0 z-[200] bg-black/80 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center">
    <i data-lucide="volume-x" class="w-16 h-16 text-slate-400 mb-4"></i>
    <h2 class="text-2xl font-bold text-white mb-2">Monitor Standing By</h2>
    <p class="text-slate-400 mb-8 max-w-md text-sm">Browsers block sound until you interact with the page. Click below to enable audio alerts and start the monitor.</p>
    <button onclick="enableMonitor()" class="bg-amber-500 hover:bg-amber-400 text-black font-black py-4 px-8 rounded-xl text-lg transition shadow-[0_0_20px_rgba(251,191,36,0.4)] flex items-center gap-2">
      <i data-lucide="power" class="w-6 h-6"></i> START LIVE MONITOR
    </button>
  </div>

  <!-- STANDY STATE (Hidden by default, shown when no pending orders) -->
  <div id="standby-screen" class="hidden text-center">
    <div class="bg-slate-800/50 p-8 rounded-full mb-6 inline-block ring-pulse border border-slate-700">
      <i data-lucide="shield-check" class="w-20 h-20 text-emerald-500"></i>
    </div>
    <h1 class="text-4xl font-black text-white mb-2">ALL CLEAR</h1>
    <p class="text-slate-400 text-lg">Monitoring for new orders...</p>
    <p class="text-slate-500 text-sm mt-8">Leaving this window open is safe.</p>
  </div>

  <!-- ALERT SCREEN (Hidden by default, shown when pending orders exist) -->
  <div id="alert-screen" class="hidden w-full h-full flex flex-col items-center justify-center p-6">
    <div class="animate-bounce mb-4">
      <i data-lucide="bell-ring" class="w-24 h-24 text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.8)]"></i>
    </div>
    
    <h1 class="text-6xl md:text-8xl font-black text-white tracking-tighter mb-2 drop-shadow-lg text-center leading-none">
      NEW ORDER!
    </h1>
    
    <div class="bg-black/40 backdrop-blur-md px-6 py-3 rounded-full border border-white/20 mb-10 shadow-2xl flex items-center gap-3">
      <span class="text-white font-bold text-xl uppercase tracking-widest" id="alert-count">1 PENDING</span>
    </div>

    <!-- Quick Action Links to open the actual board -->
    <div class="flex flex-wrap justify-center gap-4">
      <a href="dashboard.html" class="bg-black/50 hover:bg-black text-white font-bold py-3 px-6 rounded-xl border border-white/30 transition flex items-center gap-2 text-sm">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
      </a>
      <a href="order-board.html" class="bg-black/50 hover:bg-black text-white font-bold py-3 px-6 rounded-xl border border-white/30 transition flex items-center gap-2 text-sm">
        <i data-lucide="chef-hat" class="w-4 h-4"></i> Kitchen Board
      </a>
      <a href="bar-orders.html" class="bg-black/50 hover:bg-black text-white font-bold py-3 px-6 rounded-xl border border-white/30 transition flex items-center gap-2 text-sm">
        <i data-lucide="wine" class="w-4 h-4"></i> Bar Board
      </a>
    </div>

    <button onclick="acknowledgeAlerts()" class="mt-12 bg-white text-red-600 hover:bg-red-50 font-black py-4 px-12 rounded-full text-xl transition shadow-2xl flex items-center gap-2 transform hover:scale-105 active:scale-95">
      <i data-lucide="check" class="w-6 h-6"></i> SILENCE ALARM
    </button>
  </div>

  <div class="absolute bottom-4 w-full text-center">
    <p class="text-xs text-slate-500 font-medium tracking-wider uppercase">Powered by DEKY</p>
  </div>

  <script>
    if ('serviceWorker' in navigator) { 
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) { registration.unregister(); }
      });
    }

    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    let isMonitoring = false;
    let soundInterval = null;
    let currentPendingCount = 0;
    let isAcknowledged = false;

    // 1. Start Monitor & Unlock Audio
    function enableMonitor() {
      document.getElementById('sound-unlock-overlay').classList.add('hidden');
      isMonitoring = true;
      
      // Play a silent sound to unlock audio context on iOS/Chrome
      try {
        const unlockAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        unlockAudio.volume = 0;
        unlockAudio.play().catch(e => console.log(e));
      } catch(err){}

      checkAlerts(); // Initial check
      setInterval(checkAlerts, 5000); // Poll every 5 seconds
    }

    // 2. Acknowledge & Silence
    function acknowledgeAlerts() {
      isAcknowledged = true;
      stopSound();
      document.body.classList.remove('blink-active');
      document.getElementById('alert-screen').classList.add('hidden');
      document.getElementById('standby-screen').classList.remove('hidden');
    }

    // 3. Sound Logic
    function startSound() {
      if (soundInterval) return;
      playNotificationSound();
      soundInterval = setInterval(playNotificationSound, 4000); // Loop every 4s until silenced
    }

    function stopSound() {
      if (soundInterval) {
        clearInterval(soundInterval);
        soundInterval = null;
      }
    }

    function playNotificationSound() {
      try {
        const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        audio.volume = 0.6;
        audio.play().catch(e => console.log('Audio play blocked'));
      } catch(err) {}
    }

    // 4. Main Logic (Poll Supabase)
    async function checkAlerts() {
      if (!isMonitoring) return;

      // We query ALL pending orders (Kitchen, Bar, Housekeeping, etc.)
      const { data: pendingOrders, error } = await db.from('guest_orders')
        .select('id')
        .eq('status', 'Pending');

      if (error) {
        console.error("Alert Query Error:", error);
        return;
      }

      const newCount = pendingOrders ? pendingOrders.length : 0;

      if (newCount > 0) {
        // If count increased OR we haven't acknowledged yet, keep alerting
        if (newCount > currentPendingCount || !isAcknowledged) {
          isAcknowledged = false; // Reset acknowledgment state if new orders arrive
          
          document.getElementById('standby-screen').classList.add('hidden');
          document.getElementById('alert-screen').classList.remove('hidden');
          document.getElementById('alert-count').textContent = `${newCount} PENDING`;
          
          if (!document.body.classList.contains('blink-active')) {
            document.body.classList.add('blink-active');
          }
          
          startSound();
        }
      } else {
        // Zero pending orders -> Force standby mode and silence
        document.getElementById('alert-screen').classList.add('hidden');
        document.getElementById('standby-screen').classList.remove('hidden');
        document.body.classList.remove('blink-active');
        stopSound();
        isAcknowledged = false; 
      }

      currentPendingCount = newCount;
    }
  </script>
</body>
</html>
