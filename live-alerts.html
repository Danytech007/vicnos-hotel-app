<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Blinker</title>
  <style>
    /* Force the body to be full screen red */
    body { 
        margin: 0; 
        padding: 0; 
        height: 100vh; 
        background-color: #ff0000; 
        color: white; 
        display: flex; 
        flex-direction: column; 
        justify-content: center; 
        align-items: center; 
        font-family: Arial, sans-serif; 
        text-align: center;
        
        /* Force the animation */
        animation-name: flash;
        animation-duration: 0.5s;
        animation-iteration-count: infinite;
    }

    @keyframes flash {
        0% { background-color: #ff0000; }
        50% { background-color: #8b0000; }
        100% { background-color: #ff0000; }
    }

    h1 { font-size: 80px; margin: 0; text-shadow: 2px 2px 10px black; }
    p { font-size: 30px; font-weight: bold; }
  </style>
</head>
<body>

  <h1>🚨 TEST BLINKER 🚨</h1>
  <p>If you see this flashing, the browser works.</p>

  <!-- Play a loud beep immediately -->
  <script>
    setInterval(function() {
        try {
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
            audio.volume = 1.0;
            audio.play().catch(e => console.log("Audio blocked"));
        } catch(e) {}
    }, 1500);
  </script>

</body>
</html>
