<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos Hotel - Upgrade</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap');
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; background-color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
    h1, h2, h3 { font-family: 'Playfair Display', serif; }
    .fade-in { animation: fadeIn 0.5s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
  </style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
</head>
<body class="pb-24">

  <nav class="bg-white p-4 flex justify-between items-center sticky top-0 z-50 border-b border-gray-100">
    <div class="flex items-center gap-2">
      <a href="guest-portal.html" id="back-btn" class="bg-gray-50 p-2 rounded-full active:scale-95 transition"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-700"></i></a>
      <span class="font-bold text-gray-900 tracking-widest text-sm ml-2">UPGRADE</span>
    </div>
    <div class="text-right bg-blue-50 px-3 py-1 rounded-lg">
      <p class="text-[9px] uppercase text-blue-500 font-bold tracking-wider">Room</p>
      <p id="nav-room-num" class="font-bold text-blue-700 leading-none text-lg">---</p>
    </div>
  </nav>

  <main class="flex-grow max-w-md mx-auto w-full p-4 fade-in">
    
    <div class="mb-6 bg-slate-900 rounded-3xl p-6 text-center shadow-xl relative overflow-hidden">
      <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-500/20 rounded-full blur-2xl"></div>
      <i data-lucide="crown" class="w-10 h-10 text-yellow-400 mx-auto mb-3 relative z-10"></i>
      <h1 class="text-2xl font-bold text-white relative z-10">Upgrade Your Stay</h1>
      <p class="text-sm text-slate-400 mt-2 relative z-10">Treat yourself to our premium suites. Select an available room below.</p>
    </div>

    <div id="rooms-list" class="space-y-4">
        <p class="text-center text-gray-500 py-10">Checking for available rooms...</p>
    </div>

    <div class="mt-12 pt-6 text-center border-t border-gray-200">
      <p class="text-[10px] text-gray-400 tracking-wider">Vicnos HotelStack &copy; 2026</p>
      <p class="text-xs font-bold text-gray-500 tracking-widest mt-1">POWERED BY DEKY</p>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    const urlParams = new URLSearchParams(window.location.search);
    const currentRoomNum = urlParams.get('room') || '101'; 
    
    document.getElementById('nav-room-num').textContent = currentRoomNum;
    document.getElementById('back-btn').href = `guest-portal.html?room=${currentRoomNum}`;

    async function loadUpgrades() {
        const list = document.getElementById('rooms-list');
        
        // Fetch available rooms that are NOT the current room
        const { data: rooms, error } = await db.from('rooms')
            .select('*')
            .eq('status', 'Available')
            .neq('room_number', currentRoomNum)
            .order('price_per_night', { ascending: false });

        if (error || !rooms || rooms.length === 0) {
            list.innerHTML = '<p class="text-center text-gray-500 py-10">No upgrades available at the moment. You have the best room!</p>';
            return;
        }

        list.innerHTML = rooms.map(room => `
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                <div class="flex items-center p-4 border-b border-gray-50">
                    <div class="bg-blue-50 w-12 h-12 rounded-xl flex items-center justify-center mr-4">
                        <i data-lucide="bed-double" class="w-6 h-6 text-blue-600"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-800 text-lg">Room ${room.room_number}</h3>
                        <p class="text-xs text-gray-500">${room.room_type}</p>
                    </div>
                    <div class="ml-auto text-right">
                        <p class="text-xs text-gray-400">Per Night</p>
                        <p class="font-extrabold text-blue-600">₦${Number(room.price_per_night).toLocaleString()}</p>
                    </div>
                </div>
                <div class="p-4 bg-gray-50">
                    <button onclick="requestUpgrade('${room.room_number}')" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold active:scale-95 transition shadow-md flex items-center justify-center gap-2">
                        <i data-lucide="arrow-up-circle" class="w-5 h-5"></i> Request Upgrade
                    </button>
                </div>
            </div>
        `).join('');
        lucide.createIcons();
    }

    async function requestUpgrade(newRoom) {
        const confirmMsg = `Upgrade from Room ${currentRoomNum} to Room ${newRoom}? The difference will be added to your final bill.`;
        if (!confirm(confirmMsg)) return;

        // Here we would normally insert this into an 'upgrade_requests' table.
        // For now, we will alert and send a WhatsApp to the front desk.
        alert("✅ Upgrade Request Sent! The front desk will confirm shortly.");
    }

    loadUpgrades();
  </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg failed', err));
    });
  }
</script>
</body>
</html>
