<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos Hotel - My Bill</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap');
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; background-color: #f8fafc; }
    h1, h2, h3 { font-family: 'Playfair Display', serif; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body class="min-h-screen pb-24">

  <nav class="bg-white p-4 flex items-center gap-3 sticky top-0 z-50 border-b border-gray-100">
    <a href="guest-portal.html?room=101" class="bg-gray-50 p-2 rounded-full active:scale-95 transition"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-700"></i></a>
    <h1 class="font-bold text-gray-800 text-lg">My Folio</h1>
  </nav>

  <main class="max-w-md mx-auto p-4 space-y-5">
    
    <!-- CHECKOUT COUNTDOWN -->
    <div class="bg-gradient-to-br from-gray-900 to-gray-800 rounded-2xl p-6 text-center shadow-lg relative overflow-hidden">
      <div class="absolute top-0 right-0 p-4 opacity-10"><i data-lucide="clock" class="w-24 h-24 text-white"></i></div>
      <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Time until Checkout</p>
      <div id="countdown" class="text-4xl font-extrabold text-white font-mono tracking-wider">-- : -- : --</div>
      <p class="text-[10px] text-gray-400 mt-2" id="checkout-date-text">Checkout: --</p>
    </div>

    <!-- LIVE EXPENDITURE -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
      <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-4">Live Bill Breakdown</h2>
      
      <div class="space-y-3 text-sm">
        <div class="flex justify-between items-center">
          <span class="text-gray-600">Room Accommodation</span>
          <span class="font-bold text-gray-800" id="bill-room">₦0</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-gray-600">Food & Drinks (POS)</span>
          <span class="font-bold text-gray-800" id="bill-pos">₦0</span>
        </div>
        <!-- Add more here if needed (e.g., Laundry) -->
      </div>

      <div class="border-t border-dashed border-gray-200 my-4"></div>

      <div class="flex justify-between items-center">
        <span class="text-lg font-bold text-gray-800">Total Due</span>
        <span class="text-2xl font-extrabold text-blue-600" id="bill-total">₦0</span>
      </div>
    </div>

    <button onclick="alert('A receipt will be sent to your email. Please proceed to reception to pay.')" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg active:scale-95 transition">
      Settle Bill & Express Checkout
    </button>

  </main>

  <!-- BOTTOM NAV -->
  <div class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-100 pb-safe shadow-[0_-5px_10px_rgba(0,0,0,0.05)]">
    <div class="flex justify-around items-center h-16 max-w-md mx-auto">
      <a href="guest-portal.html?room=101" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition">
        <i data-lucide="home" class="w-6 h-6"></i>
        <span class="text-[10px] font-medium mt-1">Home</span>
      </a>
      <a href="#" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition">
        <i data-lucide="map" class="w-6 h-6"></i>
        <span class="text-[10px] font-medium mt-1">Local Hub</span>
      </a>
      <a href="#" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition">
        <i data-lucide="utensils" class="w-6 h-6"></i>
        <span class="text-[10px] font-medium mt-1">Food</span>
      </a>
      <a href="#" class="flex flex-col items-center text-blue-600">
        <i data-lucide="user" class="w-6 h-6"></i>
        <span class="text-[10px] font-bold mt-1">My Bill</span>
      </a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    const urlParams = new URLSearchParams(window.location.search);
    const roomNum = urlParams.get('room') || '101'; 
    let countdownInterval;

    async function loadBill() {
      try {
        // 1. Get Room and Price
        const { data: roomData } = await db.from('rooms').select('id, price_per_night').eq('room_number', roomNum).maybeSingle();
        if (!roomData) return;

        // 2. Get Booking Details
        const { data: booking } = await db.from('bookings')
          .select('id, expected_check_out, check_in_date')
          .eq('room_id', roomData.id)
          .eq('status', 'Checked In')
          .limit(1)
          .maybeSingle();

        if (!booking) return;

        // 3. Calculate Room Cost (Nights)
        const checkIn = new Date(booking.check_in_date);
        const checkOut = new Date(booking.expected_check_out);
        const diffTime = Math.abs(checkOut - checkIn);
        const nights = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) || 1;
        const roomCost = nights * roomData.price_per_night;

        // 4. Get POS Charges
        const { data: charges } = await db.from('folio_charges')
          .select('amount')
          .eq('booking_id', booking.id);
        
        let posTotal = 0;
        if (charges) {
          charges.forEach(c => posTotal += Number(c.amount));
        }

        // 5. Update UI
        document.getElementById('bill-room').textContent = `₦${roomCost.toLocaleString()}`;
        document.getElementById('bill-pos').textContent = `₦${posTotal.toLocaleString()}`;
        document.getElementById('bill-total').textContent = `₦${(roomCost + posTotal).toLocaleString()}`;

        // 6. Start Countdown
        startCountdown(checkOut);

      } catch (err) {
        console.error(err);
      }
    }

    function startCountdown(checkoutDate) {
      // Set checkout time to 12:00 PM (Noon) on the checkout date
      const targetDate = new Date(checkoutDate);
      targetDate.setHours(12, 0, 0, 0); 

      document.getElementById('checkout-date-text').textContent = `Checkout: ${targetDate.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })} at 12:00 PM`;

      if (countdownInterval) clearInterval(countdownInterval);

      countdownInterval = setInterval(() => {
        const now = new Date().getTime();
        const distance = targetDate.getTime() - now;

        if (distance < 0) {
          clearInterval(countdownInterval);
          document.getElementById('countdown').innerHTML = "EXPIRED";
          document.getElementById('countdown').classList.add('text-red-500');
          return;
        }

        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById('countdown').textContent = 
          `${hours.toString().padStart(2, '0')} : ${minutes.toString().padStart(2, '0')} : ${seconds.toString().padStart(2, '0')}`;
      }, 1000);
    }

    loadBill();
  </script>
</body>
</html>
