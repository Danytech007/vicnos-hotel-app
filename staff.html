<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos Hotel - Staff</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    input, select, textarea { user-select: text; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen pb-24 font-sans">

  <nav class="bg-white p-5 shadow-sm flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="bg-gray-100 p-2 rounded-xl text-gray-600 hover:bg-gray-200">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <div>
        <h1 class="font-bold text-gray-800 text-lg leading-tight">Staff Management</h1>
        <p class="text-xs text-gray-500">Add & Manage Team</p>
      </div>
    </div>
  </nav>

  <main class="p-4 max-w-2xl mx-auto space-y-5">
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
      <h2 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
        <i data-lucide="user-plus" class="w-5 h-5 text-blue-600"></i> Add New Staff & Login
      </h2>
      <form id="add-staff-form" class="space-y-3">
        
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Full Name</label>
          <input id="staff-name" type="text" required placeholder="e.g. John Doe" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:border-blue-500 outline-none transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Role</label>
          <select id="staff-role" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:border-blue-500 outline-none transition">
            <option value="md">MD (Managing Director)</option>
            <option value="manager">Manager</option>
            <option value="accountant">Accountant</option>
            <option value="supervisor">Supervisor</option>
            <option value="receptionist">Receptionist</option>
            <option value="housekeeping">Housekeeping / Porter</option>
            <option value="laundry">Laundry Staff</option>
            <option value="store_keeper">Store Keeper</option>
            <option value="barman">Barman</option>
            <option value="waitress">Waitress</option>
            <option value="chef">Chef / Kitchen</option>
            <option value="security">Security</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Email (For Login)</label>
          <input id="staff-email" type="email" required placeholder="staff@vicnoshotel.com" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:border-blue-500 outline-none transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Temporary Password</label>
          <input id="staff-password" type="text" required placeholder="e.g. Vicnos123!" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:border-blue-500 outline-none transition">
          <p class="text-[10px] text-gray-400 mt-1">Give this password to the staff member. They can change it later.</p>
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold shadow-lg shadow-blue-500/30 active:scale-[0.98] transition-all mt-2">
          Create Account & Profile
        </button>
      </form>
      <p id="message" class="mt-4 text-center text-sm font-medium"></p>
    </div>

    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
      <h2 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
        <i data-lucide="users" class="w-5 h-5 text-teal-600"></i> Current Staff
      </h2>
      <div id="staff-list" class="space-y-3">
        <p class="text-center text-gray-500 text-sm">Loading...</p>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    // --- SECURITY BOUNCER ---
    async function checkRole() {
      const { data: { user } } = await db.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }
      
      const { data: profile } = await db.from('profiles').select('role').eq('id', user.id).single();
      // MDs, Managers, Admins, and Accountants can access Staff Management
      if (!profile || !['md', 'manager', 'admin', 'accountant'].includes(profile.role)) {
        window.location.href = 'dashboard.html';
      } else {
        loadStaff();
      }
    }

    async function loadStaff() {
      const list = document.getElementById('staff-list');
      const { data: staff } = await db.from('profiles').select('*').order('created_at');
      list.innerHTML = '';
      if (!staff || staff.length === 0) {
        list.innerHTML = '<p class="text-center text-gray-500 text-sm">No staff added yet.</p>';
        return;
      }
      staff.forEach(s => {
        list.innerHTML += `
          <div class="flex justify-between items-center p-3 border border-gray-100 rounded-xl bg-gray-50 mb-2">
            <div>
              <p class="font-bold text-gray-800 text-sm">${s.full_name}</p>
              <p class="text-xs text-blue-600 uppercase font-semibold">${s.role.replace('_', ' ')}</p>
            </div>
          </div>
        `;
      });
    }

    document.getElementById('add-staff-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('message');
      msg.textContent = 'Creating account...';
      msg.className = 'mt-4 text-center text-sm font-medium text-gray-600';
      
      // Call the Edge Function we created earlier
      const { data, error } = await db.functions.invoke('create-staff', {
        body: {
          email: document.getElementById('staff-email').value,
          password: document.getElementById('staff-password').value,
          full_name: document.getElementById('staff-name').value,
          role: document.getElementById('staff-role').value
        }
      });

      if (error || data.error) {
        msg.textContent = 'Error: ' + (error?.message || data.error);
        msg.className = 'mt-4 text-center text-sm text-red-600';
      } else {
        msg.textContent = '✅ Staff Account Created Successfully!';
        msg.className = 'mt-4 text-center text-sm text-green-600';
        document.getElementById('add-staff-form').reset();
        loadStaff();
      }
    });

    // Run the security check on page load
    checkRole();
  </script>
</body>
</html>
