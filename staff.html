<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos Hotel - Staff Directory</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f8fafc">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .hide-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen pb-10">

  <nav class="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-50 border-b border-gray-100">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="bg-gray-50 p-2 rounded-xl text-gray-600 hover:bg-gray-200 transition">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <div>
        <h1 class="font-bold text-gray-900 text-lg leading-tight">Staff Directory</h1>
        <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Management</p>
      </div>
    </div>
    <div class="bg-indigo-50 p-2 rounded-full text-indigo-600">
      <i data-lucide="users" class="w-5 h-5"></i>
    </div>
  </nav>

  <main class="p-4 max-w-3xl mx-auto space-y-4">
    
    <!-- Search Bar -->
    <div class="bg-white p-2 rounded-xl shadow-sm border border-gray-200 flex items-center gap-2">
      <i data-lucide="search" class="w-5 h-5 text-gray-400 ml-2"></i>
      <input type="text" id="search-input" oninput="filterStaff()" placeholder="Search by name or role..." class="w-full bg-transparent outline-none text-sm text-gray-700 font-medium py-2">
    </div>

    <!-- Staff List -->
    <div id="staff-list" class="space-y-3">
      <p class="text-center text-gray-500 text-sm py-10 animate-pulse">Loading staff directory...</p>
    </div>

  </main>

  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.log(err))); }

    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    let allStaff = [];

    async function init() {
      try {
        const { data: { user } } = await db.auth.getUser();
        if (!user) { window.location.href = 'index.html'; return; }

        // Fetch current user's profile to check role access
        const { data: profile } = await db.from('profiles').select('role').eq('id', user.id).single();
        
        // ALLOW ACCOUNTANT, MANAGER, MD, SUPERVISOR, SUPER ADMIN
        const allowedRoles = ['md', 'admin', 'manager', 'super_admin', 'accountant', 'supervisor'];
        
        if (!profile || !allowedRoles.includes(profile.role)) {
          alert("Access Denied. You do not have permission to view the staff directory.");
          window.location.href = 'dashboard.html'; 
          return;
        }

        loadStaff();

      } catch (err) {
        alert("Initialization Error: " + err.message);
      }
    }

    async function loadStaff() {
      const list = document.getElementById('staff-list');
      
      const { data: staff, error } = await db.from('profiles').select('*').order('full_name');

      if (error) {
        list.innerHTML = `<p class="text-center text-red-500">Error: ${error.message}</p>`;
        return;
      }

      if (!staff || staff.length === 0) {
        list.innerHTML = '<p class="text-center text-gray-500 py-6">No staff records found.</p>';
        return;
      }

      allStaff = staff;
      renderStaff(allStaff);
    }

    function renderStaff(staffArray) {
      const list = document.getElementById('staff-list');
      
      list.innerHTML = staffArray.map(s => {
        const isActive = s.is_active !== false; // Defaults to true if null
        
        // Format Role nicely (e.g., 'store_keeper' -> 'Store Keeper')
        const roleName = s.role.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase());

        // Pick an icon based on role
        let icon = 'user';
        if (s.role === 'manager' || s.role === 'admin') icon = 'shield';
        if (s.role === 'chef' || s.role === 'kitchen') icon = 'chef-hat';
        if (s.role === 'barman') icon = 'wine';
        if (s.role === 'receptionist') icon = 'concierge-bell';
        if (s.role === 'waitress') icon = 'utensils';
        if (s.role === 'accountant') icon = 'calculator';
        if (s.role === 'security') icon = 'shield-alert';
        if (s.role === 'housekeeping') icon = 'sparkles';

        return `
          <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center fade-in">
            <div class="flex items-center gap-4">
              <div class="bg-indigo-50 p-3 rounded-full text-indigo-600">
                <i data-lucide="${icon}" class="w-6 h-6"></i>
              </div>
              <div>
                <h3 class="font-bold text-gray-900 text-sm">${s.full_name}</h3>
                <p class="text-xs text-gray-500 font-medium mt-0.5">${roleName}</p>
              </div>
            </div>
            
            <div class="text-right">
              <span class="${isActive ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-red-50 text-red-600 border-red-200'} text-[10px] font-bold px-2 py-1 rounded-md border uppercase tracking-wider">
                ${isActive ? 'Active' : 'Inactive'}
              </span>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function filterStaff() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = allStaff.filter(s => 
        s.full_name.toLowerCase().includes(query) || 
        s.role.toLowerCase().includes(query)
      );
      
      if (filtered.length === 0) {
        document.getElementById('staff-list').innerHTML = '<p class="text-center text-gray-500 py-6">No staff match your search.</p>';
      } else {
        renderStaff(filtered);
      }
    }

    init();
  </script>
</body>
</html>
