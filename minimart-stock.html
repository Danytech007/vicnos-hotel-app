<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos - Minimart Stock Request</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f8fafc">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .hide-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen pb-10">

  <nav class="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-50 border-b border-gray-100">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="bg-gray-50 p-2 rounded-xl text-gray-600 hover:bg-gray-200 transition">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <div>
        <h1 class="font-bold text-gray-900 text-lg leading-tight">Stock Requests</h1>
        <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Minimart</p>
      </div>
    </div>
    <div class="bg-indigo-50 p-2 rounded-full text-indigo-600">
      <i data-lucide="shopping-bag" class="w-5 h-5"></i>
    </div>
  </nav>

  <main class="p-4 max-w-2xl mx-auto space-y-6">
    
    <div class="bg-blue-50 border border-blue-200 p-4 rounded-xl text-blue-800 text-xs font-medium">
      <i data-lucide="info" class="w-4 h-4 inline-block mb-1 mr-1"></i> 
      You cannot add stock directly. Submit a request below, and the Manager or Accountant will approve it before it enters the system.
    </div>

    <!-- Action Buttons -->
    <div class="grid grid-cols-2 gap-3">
      <button onclick="openModal('new')" class="bg-indigo-600 text-white p-4 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-2 active:scale-95 transition">
        <i data-lucide="plus-circle" class="w-6 h-6"></i>
        <span class="font-bold text-sm">Request New Item</span>
      </button>
      <button onclick="openModal('restock')" class="bg-emerald-600 text-white p-4 rounded-2xl shadow-lg flex flex-col items-center justify-center gap-2 active:scale-95 transition">
        <i data-lucide="package-plus" class="w-6 h-6"></i>
        <span class="font-bold text-sm">Request Restock</span>
      </button>
    </div>

    <!-- Current Stock List -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
        <i data-lucide="boxes" class="w-5 h-5 text-indigo-500"></i> Current Minimart Stock
      </h2>
      <div id="stock-list" class="space-y-3">
        <p class="text-center text-gray-500 text-sm animate-pulse">Loading inventory...</p>
      </div>
    </div>

    <!-- My Pending Requests -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
        <i data-lucide="clock" class="w-5 h-5 text-amber-500"></i> My Pending Requests
      </h2>
      <div id="pending-list" class="space-y-3">
        <p class="text-center text-gray-500 text-sm">Loading...</p>
      </div>
    </div>

  </main>

  <!-- Modal for Requesting -->
  <div id="stock-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-[100] p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl fade-in">
      <div class="flex justify-between items-center mb-4">
        <h2 id="modal-title" class="text-lg font-bold text-gray-900">Request Item</h2>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>
      
      <form id="stock-form" class="space-y-4">
        <input type="hidden" id="action-type" value="new">
        
        <div id="new-item-fields" class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">Item Name</label>
            <input type="text" id="item-name" placeholder="e.g. Bottled Water" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">Selling Price (₦)</label>
            <input type="number" id="item-price" placeholder="e.g. 500" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-indigo-500">
          </div>
        </div>

        <div id="restock-fields" class="space-y-3 hidden">
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1">Select Item</label>
            <select id="restock-select" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-indigo-500"></select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">Quantity Requested</label>
          <input type="number" id="item-qty" placeholder="e.g. 10" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:border-indigo-500" required>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold shadow-lg active:scale-95 transition mt-2">Submit Request</button>
      </form>
      <p id="modal-msg" class="mt-2 text-center text-sm font-bold"></p>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.log(err))); }

    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    let currentUser = null;
    let minimartItems = [];

    async function init() {
      const { data: { user } } = await db.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }
      currentUser = user;
      loadStock();
      loadMyRequests();
    }

    async function loadStock() {
      const { data: items } = await db.from('inventory').select('*').eq('department', 'Minimart').order('item_name');
      minimartItems = items || [];
      const list = document.getElementById('stock-list');
      const select = document.getElementById('restock-select');

      if (minimartItems.length === 0) {
        list.innerHTML = '<p class="text-center text-gray-500 text-sm py-4">No items in the minimart yet.</p>';
        select.innerHTML = '<option value="">No items available</option>';
        return;
      }

      list.innerHTML = minimartItems.map(i => {
        const color = i.stock_quantity <= 5 ? 'text-red-600 bg-red-50' : 'text-emerald-600 bg-emerald-50';
        return `
          <div class="flex justify-between items-center p-3 border border-gray-100 rounded-xl bg-gray-50/50">
            <div><p class="font-bold text-gray-800 text-sm">${i.item_name}</p><p class="text-xs text-gray-500">₦${Number(i.price).toLocaleString()}</p></div>
            <span class="text-sm font-bold px-3 py-1 rounded-lg ${color}">${i.stock_quantity}</span>
          </div>
        `;
      }).join('');
      select.innerHTML = minimartItems.map(i => `<option value="${i.id}" data-price="${i.price}" data-name="${i.item_name}">${i.item_name}</option>`).join('');
    }

    async function loadMyRequests() {
      const list = document.getElementById('pending-list');
      const { data: requests } = await db.from('stock_restock_requests').select('*').eq('requested_by', currentUser.id).eq('status', 'Pending').order('created_at', { ascending: false });
      
      if (!requests || requests.length === 0) {
        list.innerHTML = '<p class="text-center text-gray-500 text-sm py-2">No pending requests.</p>';
        return;
      }

      list.innerHTML = requests.map(r => `
        <div class="flex justify-between items-center p-3 border border-amber-100 bg-amber-50 rounded-xl">
          <div><p class="font-bold text-gray-800 text-sm">${r.quantity}x ${r.item_name}</p><p class="text-[10px] text-amber-600 font-bold uppercase mt-1">Awaiting Approval</p></div>
        </div>
      `).join('');
    }

    function openModal(type) {
      document.getElementById('stock-modal').classList.remove('hidden');
      document.getElementById('stock-modal').classList.add('flex');
      document.getElementById('modal-msg').textContent = '';
      document.getElementById('stock-form').reset();
      document.getElementById('action-type').value = type;

      if (type === 'new') {
        document.getElementById('modal-title').textContent = "Request New Item";
        document.getElementById('new-item-fields').classList.remove('hidden');
        document.getElementById('restock-fields').classList.add('hidden');
        document.getElementById('item-name').required = true;
        document.getElementById('item-price').required = true;
      } else {
        document.getElementById('modal-title').textContent = "Request Restock";
        document.getElementById('new-item-fields').classList.add('hidden');
        document.getElementById('restock-fields').classList.remove('hidden');
        document.getElementById('item-name').required = false;
        document.getElementById('item-price').required = false;
      }
    }

    function closeModal() {
      document.getElementById('stock-modal').classList.add('hidden');
      document.getElementById('stock-modal').classList.remove('flex');
    }

    document.getElementById('stock-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn'), msg = document.getElementById('modal-msg');
      const type = document.getElementById('action-type').value, qty = parseInt(document.getElementById('item-qty').value);
      btn.disabled = true; btn.textContent = "Submitting...";

      try {
        let itemName, price;
        if (type === 'new') {
          itemName = document.getElementById('item-name').value;
          price = parseFloat(document.getElementById('item-price').value);
        } else {
          const select = document.getElementById('restock-select');
          const opt = select.options[select.selectedIndex];
          itemName = opt.dataset.name;
          price = parseFloat(opt.dataset.price);
        }

        const { error } = await db.from('stock_restock_requests').insert({
          requested_by: currentUser.id, department: 'Minimart', item_name: itemName, price: price, quantity: qty
        });
        if (error) throw error;

        msg.textContent = "✅ Request sent to Management!";
        msg.className = "mt-2 text-center text-sm font-bold text-emerald-600";
        setTimeout(() => { closeModal(); loadMyRequests(); }, 1500);
      } catch (err) {
        msg.textContent = "Error: " + err.message; msg.className = "mt-2 text-center text-sm font-bold text-red-600";
      } finally { btn.disabled = false; btn.textContent = "Submit Request"; }
    });

    init();
  </script>
</body>
</html>
