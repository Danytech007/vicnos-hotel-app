<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Join the Network - Vicnos HotelStack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Outfit', sans-serif; background-color: #0f172a; color: #f8fafc; -webkit-tap-highlight-color: transparent; user-select: none; }
  </style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
</head>
<body class="min-h-screen p-4 flex items-center justify-center">

  <div class="bg-slate-800/50 backdrop-blur-xl border border-slate-700/50 rounded-3xl p-6 w-full max-w-md shadow-2xl my-8">
    
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-yellow-500/20 rounded-2xl border border-yellow-500/30 mb-3">
        <i data-lucide="store" class="w-8 h-8 text-yellow-400"></i>
      </div>
      <h1 class="text-2xl font-bold text-white">Join the Network</h1>
      <p class="text-slate-400 text-sm mt-1">Partner with DEKY to serve premium hotel guests.</p>
    </div>

    <form id="signup-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Business Name</label>
        <input id="biz-name" type="text" required placeholder="e.g. Uyi Suya Spot" class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white outline-none focus:border-yellow-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Category</label>
        <select id="biz-category" required class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white outline-none focus:border-yellow-500">
            <option value="Local Street Food">Local Street Food (Suya, Pizza)</option>
            <option value="Transport">Transport & Rides</option>
            <option value="Fashion & Tailoring">Fashion & Tailoring</option>
            <option value="Spa & Wellness">Spa & Wellness</option>
            <option value="Shopping & Artisans">Shopping & Artisans</option>
            <option value="Tours & Guides">Tours & Guides</option>
            <option value="Romance & Gifts">Romance & Gifts</option>
            <option value="Events">Events</option>
            <option value="Tech & Essentials">Tech & Essentials</option>
            <option value="Pharmacy & Wellness">Pharmacy & Wellness (Manpower)</option>
            <option value="Financial Services">Financial Services</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">WhatsApp Number</label>
        <input id="biz-whatsapp" type="text" required placeholder="2348012345678" class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white outline-none focus:border-yellow-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Physical Business Address</label>
        <input id="biz-address" type="text" required placeholder="e.g. 12 Ekewan, Benin City" class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white outline-none focus:border-yellow-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Upload Passport Photograph</label>
        <input id="biz-image" type="file" accept="image/*" class="w-full px-2 py-1.5 bg-slate-900/50 border border-slate-700 rounded-xl text-white text-sm outline-none focus:border-yellow-500">
      </div>

      <div class="border-t border-slate-700/50 pt-4 mt-4">
        <label class="block text-xs font-semibold text-slate-400 mb-1">Login Email</label>
        <input id="biz-email" type="email" required placeholder="vendor@email.com" class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white outline-none focus:border-yellow-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Temporary Password</label>
        <input id="biz-password" type="text" required placeholder="Min 6 characters" class="w-full px-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl text-white outline-none focus:border-yellow-500">
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-yellow-500 text-black font-bold py-4 rounded-xl mt-4 active:scale-95 transition shadow-lg">
        Create Vendor Account
      </button>
    </form>

    <p id="message" class="mt-4 text-center text-sm font-bold"></p>

    <div class="text-center mt-6">
        <a href="index.html" class="text-xs text-slate-500 hover:text-slate-300">Already a vendor? Log in here.</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('message');
      const file = document.getElementById('biz-image').files[0];

      btn.innerText = "Processing...";
      btn.disabled = true;
      msg.textContent = "";

      try {
        let imageUrl = null;
        if (file) {
            btn.innerText = "Uploading Image...";
            const options = { maxSizeMB: 0.3, maxWidthOrHeight: 800, useWebWorker: true };
            const compressedFile = await imageCompression(file, options);
            const fileName = `vendor-${Date.now()}.jpg`;
            const { error: uploadError } = await db.storage.from('vendor_images').upload(fileName, compressedFile);
            if (uploadError) throw uploadError;
            const { data } = db.storage.from('vendor_images').getPublicUrl(fileName);
            imageUrl = data.publicUrl;
        }

        btn.innerText = "Creating Account...";
        const { data, error } = await db.functions.invoke('register-vendor', {
          body: {
            email: document.getElementById('biz-email').value,
            password: document.getElementById('biz-password').value,
            business_name: document.getElementById('biz-name').value,
            category: document.getElementById('biz-category').value,
            address: document.getElementById('biz-address').value,
            whatsapp_number: document.getElementById('biz-whatsapp').value,
            image_url: imageUrl
          }
        });

        if (error || data.error) throw new Error(error?.message || data.error);

        msg.textContent = "✅ Account Created! Logging you in...";
        msg.className = "mt-4 text-center text-sm font-bold text-green-400";
        
        const { error: loginError } = await db.auth.signInWithPassword({
            email: document.getElementById('biz-email').value,
            password: document.getElementById('biz-password').value
        });

        if (loginError) throw loginError;
        
        setTimeout(() => { window.location.href = 'vendor-dashboard.html'; }, 1000);

      } catch (err) {
        msg.textContent = "Error: " + err.message;
        msg.className = "mt-4 text-center text-sm font-bold text-red-400";
        btn.innerText = "Create Vendor Account";
        btn.disabled = false;
      }
    });
  </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg failed', err));
    });
  }
</script>
</body>
</html>
