<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos Hotel - The Insider</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f8fafc">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap');
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; background-color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
    h1, h2, h3 { font-family: 'Playfair Display', serif; }
    .fade-in { animation: fadeIn 0.5s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body class="pb-24">

  <!-- CHECKOUT LOCKOUT SCREEN -->
  <div id="checkout-lockout" class="hidden fixed inset-0 bg-slate-900 z-[200] flex flex-col items-center justify-center p-6 text-center fade-in">
    <div class="bg-white/10 p-6 rounded-full mb-6">
      <i data-lucide="door-closed" class="w-16 h-16 text-blue-400"></i>
    </div>
    <h1 class="text-2xl font-bold text-white mb-2">Session Expired</h1>
    <p class="text-slate-400 text-sm mb-8">You have checked out or your session is invalid. Please scan your room QR code to access The Insider.</p>
    <a href="guest-portal.html" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg active:scale-95 transition">Return to Home</a>
  </div>

  <!-- MAIN APP -->
  <div id="main-app" class="hidden flex-col flex-grow">

    <nav class="bg-white p-4 flex justify-between items-center sticky top-0 z-50 border-b border-gray-100">
      <div class="flex items-center gap-2">
        <button id="back-btn" class="bg-gray-50 p-2 rounded-full active:scale-95 transition hover:bg-gray-100"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-700"></i></button>
        <span class="font-bold text-gray-900 tracking-widest text-sm ml-2">THE INSIDER</span>
      </div>
      <div class="text-right bg-blue-50 px-3 py-1 rounded-lg">
        <p class="text-[9px] uppercase text-blue-500 font-bold tracking-wider">Room</p>
        <p id="nav-room-num" class="font-bold text-blue-700 leading-none text-lg">---</p>
      </div>
    </nav>

    <main class="flex-grow max-w-md mx-auto w-full p-4 fade-in">
      
      <div class="mb-6">
        <h1 class="text-3xl font-bold text-gray-800 mb-1">Vicnos Insider</h1>
        <p class="text-sm text-gray-500">Discover the best of Benin City, news, and exclusive offers.</p>
      </div>

      <div id="blog-list" class="space-y-6">
          <p class="text-center text-gray-500 py-10 animate-pulse">Loading articles...</p>
      </div>

      <div class="mt-12 pt-6 text-center border-t border-gray-200">
        <p class="text-[10px] text-gray-400 tracking-wider">Vicnos HotelStack &copy; 2026</p>
        <p class="text-xs font-bold text-gray-500 tracking-widest mt-1">POWERED BY DEKY</p>
      </div>

    </main>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.log(err)));
    }

    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    // --- SECURE AUTHENTICATION ---
    async function authenticateGuest() {
        let savedGuest = localStorage.getItem('vicnos_guest_session');
        const urlParams = new URLSearchParams(window.location.search);
        const urlRoom = urlParams.get('room');

        if (!savedGuest) {
            if (!urlRoom) return showLockout();
            
            const { data: roomData } = await db.from('rooms').select('id').eq('room_number', urlRoom).single();
            if (!roomData) return showLockout();

            const { data: booking } = await db.from('bookings')
                .select('id, guests(full_name)')
                .eq('room_id', roomData.id).eq('status', 'Checked In').limit(1).single();

            if (!booking) return showLockout();

            savedGuest = {
                booking_id: booking.id,
                room_number: urlRoom,
                guest_name: booking.guests.full_name
            };
            localStorage.setItem('vicnos_guest_session', JSON.stringify(savedGuest));
        } else {
            savedGuest = JSON.parse(savedGuest);
            
            const { data: booking } = await db.from('bookings').select('status').eq('id', savedGuest.booking_id).single();
            if (!booking || booking.status !== 'Checked In') return showLockout();

            if (urlRoom && urlRoom !== savedGuest.room_number) {
                window.history.replaceState(null, '', `?room=${savedGuest.room_number}`);
            }
        }

        // Load UI
        document.getElementById('main-app').classList.remove('hidden');
        document.getElementById('main-app').classList.add('flex');
        document.getElementById('nav-room-num').textContent = savedGuest.room_number;
        document.getElementById('back-btn').onclick = () => window.location.href = `guest-portal.html?room=${savedGuest.room_number}`;
        
        loadBlog();
    }

    function showLockout() {
        localStorage.removeItem('vicnos_guest_session');
        document.getElementById('main-app').classList.add('hidden');
        document.getElementById('checkout-lockout').classList.remove('hidden');
    }

    async function loadBlog() {
        const list = document.getElementById('blog-list');
        const { data: posts, error } = await db.from('blog_posts').select('*').order('created_at', { ascending: false });

        if (error) {
            list.innerHTML = '<p class="text-center text-red-500">Failed to load articles.</p>';
            return;
        }

        if (!posts || posts.length === 0) {
            list.innerHTML = '<p class="text-center text-gray-500">No articles have been published yet. Check back soon!</p>';
            return;
        }

        list.innerHTML = posts.map(post => `
            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden fade-in">
                ${post.image_url ? `<img src="${post.image_url}" class="w-full h-48 object-cover">` : ''}
                <div class="p-5">
                    <p class="text-[10px] text-blue-600 font-bold tracking-widest uppercase mb-2">${new Date(post.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}</p>
                    <h2 class="text-xl font-bold text-gray-800 mb-2 leading-tight">${post.title}</h2>
                    <p class="text-sm text-gray-600 leading-relaxed mb-4">${post.content}</p>
                    
                    ${post.video_link ? `
                        <a href="${post.video_link}" target="_blank" class="inline-flex items-center gap-2 bg-green-50 text-green-700 font-bold text-xs px-4 py-2 rounded-xl border border-green-200 active:scale-95 transition">
                            <i data-lucide="play-circle" class="w-4 h-4"></i> Watch Video on WhatsApp
                        </a>
                    ` : ''}
                </div>
            </div>
        `).join('');
        lucide.createIcons();
    }

    // Initialize
    authenticateGuest();
  </script>
</body>
</html>
