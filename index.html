<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos Hotel - Login</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1d4ed8">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    .fade-in { animation: fadeIn 0.5s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-700 via-blue-600 to-indigo-700 flex items-center justify-center p-4">

  <div class="w-full max-w-md fade-in">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-white/20 backdrop-blur-sm rounded-3xl mb-4 shadow-lg">
        <svg class="w-11 h-11 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white mb-1">Vicnos Hotel</h1>
      <p class="text-blue-100 text-sm">Sign in to continue</p>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl p-8">
      <div class="space-y-5">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Email</label>
          <input id="email" type="email" placeholder="staff@vicnoshotel.com"
            class="w-full px-4 py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:bg-white focus:border-blue-500 outline-none transition text-gray-800">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Password</label>
          <input id="password" type="password" placeholder="••••••••"
            class="w-full px-4 py-4 bg-gray-50 border border-gray-200 rounded-2xl focus:bg-white focus:border-blue-500 outline-none transition text-gray-800">
        </div>
        <button onclick="login()" id="login-btn"
          class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-4 rounded-2xl font-semibold shadow-lg shadow-blue-500/30 hover:shadow-xl active:scale-[0.98] transition-all">
          Sign In
        </button>
      </div>
      <p id="message" class="mt-4 text-center text-sm font-medium"></p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const message = document.getElementById('message');
      const btn = document.getElementById('login-btn');

      if (!email || !password) {
        message.textContent = 'Please enter email and password.';
        message.className = 'mt-4 text-center text-sm font-medium text-red-600';
        return;
      }

      btn.textContent = 'Signing in...';
      btn.disabled = true;

      const { data, error } = await db.auth.signInWithPassword({ email, password });

      if (error) {
        message.textContent = 'Login failed: ' + error.message;
        message.className = 'mt-4 text-center text-sm font-medium text-red-600';
        btn.textContent = 'Sign In';
        btn.disabled = false;
        return;
      }

      // Fetch the user's role to route them correctly
      const { data: profile } = await db.from('profiles').select('role, is_active').eq('id', data.user.id).single();

      if (!profile || profile.is_active === false) {
        await db.auth.signOut();
        message.textContent = 'Account deactivated. Contact Manager.';
        message.className = 'mt-4 text-center text-sm font-medium text-red-600';
        btn.textContent = 'Sign In';
        btn.disabled = false;
        return;
      }

      message.textContent = 'Login successful!';
      message.className = 'mt-4 text-center text-sm font-medium text-green-600';
      
      // ROUTING LOGIC: Send them to the right page based on their role
      setTimeout(() => {
        if (profile.role === 'manager' || profile.role === 'admin' || profile.role === 'receptionist') {
          window.location.href = 'dashboard.html';
        } else if (profile.role === 'barman' || profile.role === 'waitress' || profile.role === 'chef') {
          window.location.href = 'pos.html'; 
        } else if (profile.role === 'housekeeping') {
          window.location.href = 'rooms.html'; 
        } else if (profile.role === 'store_keeper') {
          window.location.href = 'store.html'; 
        } else {
          window.location.href = 'dashboard.html'; // Fallback
        }
      }, 500);
    }
  </script>
</body>
</html>
