<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos HotelStack - Login</title>
  
  <!-- PWA Setup -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
    body { 
      font-family: 'Outfit', sans-serif; 
      background-color: #0f172a; 
      background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%);
      -webkit-tap-highlight-color: transparent;
    }
    .fade-in { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Custom Checkbox */
    .custom-checkbox {
      appearance: none;
      background-color: #0f172a;
      margin: 0;
      font: inherit;
      color: currentColor;
      width: 1.15em;
      height: 1.15em;
      border: 1px solid #475569;
      border-radius: 0.25em;
      display: grid;
      place-content: center;
    }
    .custom-checkbox::before {
      content: "";
      width: 0.65em;
      height: 0.65em;
      transform: scale(0);
      transition: 120ms transform ease-in-out;
      box-shadow: inset 1em 1em #3b82f6;
      transform-origin: center;
      clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
    }
    .custom-checkbox:checked::before {
      transform: scale(1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Loading Screen (Shows while checking session) -->
  <div id="loading-screen" class="flex flex-col items-center justify-center">
    <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="text-slate-400 text-sm font-bold animate-pulse">Loading Vicnos...</p>
  </div>

  <!-- MAIN LOGIN CONTAINER -->
  <div id="login-container" class="hidden w-full max-w-md fade-in">
    
    <!-- Logo Area -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600/20 rounded-2xl border border-blue-500/30 mb-4 shadow-[0_0_20px_rgba(37,99,235,0.3)]">
        <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white mb-1 tracking-wide">Vicnos HotelStack</h1>
      <p class="text-slate-400 text-sm">Staff & Management Portal</p>
    </div>

    <!-- Glassmorphic Login Card -->
    <div class="bg-slate-800/50 backdrop-blur-xl border border-slate-700/50 rounded-3xl p-8 shadow-2xl">
      <div class="space-y-5">
        
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Email / Staff ID</label>
          <input id="email" type="email" placeholder="staff@vicnoshotel.com"
            class="w-full px-4 py-4 bg-slate-900/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
          <input id="password" type="password" placeholder="••••••••"
            class="w-full px-4 py-4 bg-slate-900/50 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between mt-2">
          <label class="flex items-center gap-2 cursor-pointer group">
            <input type="checkbox" id="rememberMe" class="custom-checkbox">
            <span class="text-xs text-slate-400 group-hover:text-white transition">Remember Me</span>
          </label>
          <button onclick="forgotPassword()" class="text-xs text-blue-400 hover:text-blue-300 transition">Forgot Password?</button>
        </div>

        <button onclick="login()" id="login-btn"
          class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-4 rounded-xl font-bold shadow-[0_0_20px_rgba(37,99,235,0.4)] hover:shadow-[0_0_25px_rgba(37,99,235,0.6)] active:scale-[0.98] transition-all mt-2 flex items-center justify-center gap-2">
          <i data-lucide="log-in" class="w-5 h-5"></i> Sign In
        </button>
      </div>
      <p id="message" class="mt-4 text-center text-sm font-medium"></p>
    </div>

    <!-- Guest & Vendor Links -->
    <div class="flex flex-col gap-3 mt-6 text-center">
        <a href="guest-login.html" class="bg-white/10 hover:bg-white/20 border border-white/20 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-lg">
            <i data-lucide="smartphone" class="w-4 h-4"></i> I am a Hotel Guest
        </a>
        <a href="vendor-signup.html" class="text-xs text-blue-300 hover:text-white transition mt-2">Are you a local vendor? Join the DEKY Network here.</a>
    </div>

    <!-- DEKY Branding -->
    <p class="text-center text-slate-500 text-xs mt-8 tracking-wide">
      Vicnos HotelStack App &copy; 2026<br>
      <span class="font-bold text-slate-400">Powered by DEKY</span>
    </p>
  </div>

  <!-- FORGOT PASSWORD MODAL -->
  <div id="forgot-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-[100] p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-3xl p-6 shadow-2xl fade-in">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-white">Reset Password</h2>
        <button onclick="closeForgotModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>
      <p class="text-xs text-slate-400 mb-4">Enter your email address and we'll send you a secure link to reset your password.</p>
      
      <input id="reset-email" type="email" placeholder="staff@vicnoshotel.com" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white outline-none focus:border-blue-500 mb-4">
      
      <button onclick="sendResetLink()" id="reset-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition">Send Reset Link</button>
      <p id="reset-msg" class="mt-2 text-center text-sm font-bold"></p>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
      });
    }

    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    function routeUser(role) {
      if (role === 'vendor') {
        window.location.replace('vendor-dashboard.html');
      } else if (['super_admin', 'admin', 'manager', 'md', 'accountant', 'receptionist', 'supervisor', 'chef', 'barman', 'waitress', 'housekeeping', 'store_keeper', 'laundry', 'security', 'blogger'].includes(role)) {
        window.location.replace('dashboard.html');
      } else {
        window.location.replace('dashboard.html'); 
      }
    }

    async function checkSession() {
      const { data: { session } } = await db.auth.getSession();
      
      if (session) {
        const cachedRole = localStorage.getItem('vicnos_role');
        if (cachedRole) {
          routeUser(cachedRole);
          return; 
        }

        const { data: profile } = await db.from('profiles').select('role, is_active').eq('id', session.user.id).single();
        
        if (profile && profile.is_active !== false) {
          localStorage.setItem('vicnos_role', profile.role); 
          routeUser(profile.role);
        } else {
          document.getElementById('loading-screen').classList.add('hidden');
          document.getElementById('login-container').style.display = 'block';
        }
      } else {
        document.getElementById('loading-screen').classList.add('hidden');
        document.getElementById('login-container').style.display = 'block';
        
        window.history.pushState(null, null, window.location.href);
        window.onpopstate = function () { window.history.go(1); };
      }
    }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      const message = document.getElementById('message');
      const btn = document.getElementById('login-btn');

      if (!email || !password) {
        message.textContent = 'Please enter email and password.';
        message.className = 'mt-4 text-center text-sm font-medium text-red-400';
        return;
      }

      btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Authenticating...';
      btn.disabled = true;
      message.textContent = '';

      const { data, error } = await db.auth.signInWithPassword({ email, password });

      if (error) {
        message.textContent = 'Login failed: ' + error.message;
        message.className = 'mt-4 text-center text-sm font-medium text-red-400';
        btn.innerHTML = '<i data-lucide="log-in" class="w-5 h-5"></i> Sign In';
        btn.disabled = false;
        return;
      }

      const { data: profile } = await db.from('profiles').select('role, is_active').eq('id', data.user.id).single();

      if (!profile || profile.is_active === false) {
        await db.auth.signOut();
        message.textContent = 'Account deactivated. Contact Admin.';
        message.className = 'mt-4 text-center text-sm font-medium text-red-400';
        btn.innerHTML = '<i data-lucide="log-in" class="w-5 h-5"></i> Sign In';
        btn.disabled = false;
        return;
      }

      // Remember Me logic
      if (rememberMe) {
        localStorage.setItem('vicnos_role', profile.role);
      } else {
        localStorage.removeItem('vicnos_role');
      }
      
      message.textContent = 'Login successful!';
      message.className = 'mt-4 text-center text-sm font-medium text-green-400';
      
      setTimeout(() => routeUser(profile.role), 500);
    }

    // --- FORGOT PASSWORD LOGIC ---
    function forgotPassword() {
      document.getElementById('forgot-modal').classList.remove('hidden');
      document.getElementById('forgot-modal').classList.add('flex');
      document.getElementById('reset-email').value = document.getElementById('email').value; // Auto-fill if they typed it
    }

    function closeForgotModal() {
      document.getElementById('forgot-modal').classList.add('hidden');
      document.getElementById('forgot-modal').classList.remove('flex');
      document.getElementById('reset-msg').textContent = '';
    }

    async function sendResetLink() {
      const email = document.getElementById('reset-email').value;
      const btn = document.getElementById('reset-btn');
      const msg = document.getElementById('reset-msg');

      if (!email) {
        msg.textContent = "Please enter your email.";
        msg.className = "mt-2 text-center text-sm font-bold text-red-400";
        return;
      }

      btn.textContent = "Sending...";
      btn.disabled = true;

      const { error } = await db.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://vicnos-hotel-app-7vyp.vercel.app/update-password.html' // We will create this later if needed
      });

      if (error) {
        msg.textContent = "Error: " + error.message;
        msg.className = "mt-2 text-center text-sm font-bold text-red-400";
      } else {
        msg.textContent = "✅ Reset link sent! Check your email.";
        msg.className = "mt-2 text-center text-sm font-bold text-emerald-400";
        setTimeout(() => closeForgotModal(), 3000);
      }

      btn.textContent = "Send Reset Link";
      btn.disabled = false;
    }

    checkSession();
  </script>
</body>
</html>
