<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos Hotel - Outside Bar</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Outfit', sans-serif; background-color: #0b1120; color: #f8fafc; -webkit-tap-highlight-color: transparent; user-select: none; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen pb-24">

  <nav class="bg-slate-900/80 backdrop-blur-md border-b border-slate-700 sticky top-0 z-50 p-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="bg-yellow-500 p-2 rounded-xl text-black"><i data-lucide="wine" class="w-5 h-5"></i></div>
      <div>
        <h1 class="font-bold text-white text-lg leading-tight">Vicnos Outside Bar</h1>
        <p class="text-[10px] text-amber-400 font-bold uppercase tracking-wider">Table <span id="nav-table-num">---</span></p>
      </div>
    </div>
    <button onclick="openCart()" class="relative bg-slate-800 p-2 rounded-full text-white border border-slate-700">
      <i data-lucide="shopping-cart" class="w-5 h-5"></i>
      <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full hidden">0</span>
    </button>
  </nav>

  <main class="p-4 max-w-md mx-auto">
    <div class="grid grid-cols-2 gap-3" id="product-grid">
      <p class="text-center text-slate-500 col-span-2 py-10 animate-pulse">Loading drinks...</p>
    </div>
  </main>

  <!-- FLOATING CART BAR -->
  <div id="floating-cart" class="fixed bottom-0 left-0 right-0 z-40 bg-slate-900 border-t border-slate-700 p-4 shadow-2xl hidden">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <p class="text-[10px] text-slate-400 font-bold uppercase">Total</p>
        <p id="floating-total" class="text-xl font-black text-white">₦0</p>
      </div>
      <button onclick="openCart()" class="bg-yellow-500 text-black px-6 py-3 rounded-xl font-bold shadow-lg active:scale-95 transition">
        View Order
      </button>
    </div>
  </div>

  <!-- CART MODAL -->
  <div id="cart-modal" class="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm hidden flex-col justify-end">
    <div class="bg-white w-full max-w-md mx-auto rounded-t-3xl p-5 pb-safe h-[85vh] flex flex-col fade-in">
      
      <div class="flex justify-between items-center border-b pb-4 mb-4">
        <h2 class="text-xl font-bold text-gray-800">Your Order</h2>
        <button onclick="closeCart()" class="bg-gray-100 p-2 rounded-full active:scale-95"><i data-lucide="x" class="w-5 h-5 text-gray-600"></i></button>
      </div>

      <div id="cart-items-list" class="flex-1 overflow-y-auto space-y-3 hide-scroll"></div>

      <div class="border-t pt-4 mt-4">
        <div class="flex justify-between items-center mb-4">
          <span class="text-gray-600 font-bold">Total:</span>
          <span id="modal-cart-total" class="text-2xl font-extrabold text-gray-900">₦0</span>
        </div>

        <p class="text-xs font-bold text-gray-500 mb-2 uppercase">Select Payment Method</p>
        
        <div class="grid grid-cols-2 gap-2 mb-4">
          <button onclick="selectPayment('Cash')" id="pay-cash" class="py-3 rounded-xl font-bold bg-gray-100 text-gray-600 transition border-2 border-transparent flex items-center justify-center gap-2"><i data-lucide="banknote" class="w-4 h-4"></i> Cash</button>
          <button onclick="selectPayment('POS')" id="pay-pos" class="py-3 rounded-xl font-bold bg-gray-100 text-gray-600 transition border-2 border-transparent flex items-center justify-center gap-2"><i data-lucide="credit-card" class="w-4 h-4"></i> POS</button>
          <button onclick="selectPayment('Transfer')" id="pay-transfer" class="py-3 rounded-xl font-bold bg-gray-100 text-gray-600 transition border-2 border-transparent flex items-center justify-center gap-2"><i data-lucide="smartphone" class="w-4 h-4"></i> Transfer</button>
          <button onclick="selectPayment('Call_Waiter')" id="pay-waiter" class="py-3 rounded-xl font-bold bg-gray-100 text-gray-600 transition border-2 border-transparent flex items-center justify-center gap-2"><i data-lucide="bell" class="w-4 h-4"></i> Call Waiter</button>
        </div>

        <button onclick="submitOrder()" id="checkout-btn" class="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-emerald-500/30 active:scale-95 transition flex items-center justify-center gap-2">
          <i data-lucide="check-circle" class="w-5 h-5"></i> Place Order
        </button>
      </div>
    </div>
  </div>

  <!-- WAITING SCREEN -->
  <div id="waiting-modal" class="fixed inset-0 z-[200] bg-slate-900 flex flex-col items-center justify-center p-6 text-center hidden">
    <div class="bg-yellow-500/20 p-6 rounded-full mb-6">
      <i data-lucide="clock" class="w-16 h-16 text-yellow-400 animate-pulse"></i>
    </div>
    <h1 class="text-2xl font-bold text-white mb-2">Order Sent to Bar</h1>
    <p id="waiting-message" class="text-slate-400 text-sm mb-8">Please wait for the barman to confirm your payment.</p>
    <button onclick="resetOrder()" class="bg-slate-800 text-white px-6 py-3 rounded-xl font-bold">Start New Order</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.log(err))); }

    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    const urlParams = new URLSearchParams(window.location.search);
    const tableNum = urlParams.get('table') || 'N/A';
    document.getElementById('nav-table-num').textContent = tableNum;

    let allProducts = [];
    let cart = [];
    let selectedPayment = null;

    async function loadProducts() {
      const { data: products } = await db.from('inventory')
        .select('*')
        .eq('department', 'Bar')
        .gt('stock_quantity', 0)
        .order('item_name');

      if (!products || products.length === 0) {
        document.getElementById('product-grid').innerHTML = '<p class="text-center text-slate-500 col-span-2 py-10">No drinks available right now.</p>';
        return;
      }

      allProducts = products;

      document.getElementById('product-grid').innerHTML = products.map(p => `
        <div onclick="addToCart('${p.id}')" class="glass-card rounded-2xl p-3 flex flex-col justify-between active:scale-95 transition cursor-pointer h-40 fade-in relative overflow-hidden">
          ${p.image_url ? `<img src="${p.image_url}" class="absolute inset-0 w-full h-full object-cover opacity-30">` : ''}
          <div class="relative z-10">
            <h3 class="font-bold text-white text-sm leading-tight">${p.item_name}</h3>
          </div>
          <div class="relative z-10 flex justify-between items-end">
            <p class="text-yellow-400 font-black">₦${Number(p.price).toLocaleString()}</p>
            <div class="bg-yellow-500 text-black p-1 rounded-md"><i data-lucide="plus" class="w-4 h-4"></i></div>
          </div>
        </div>
      `).join('');
      
      lucide.createIcons();
    }

    function addToCart(id) {
      const item = allProducts.find(p => p.id === id);
      const existing = cart.find(c => c.id === id);
      
      if (existing) { existing.qty++; } 
      else { cart.push({ ...item, qty: 1 }); }
      
      updateCartUI();
    }

    function removeFromCart(id) {
      const index = cart.findIndex(c => c.id === id);
      if (index > -1) {
        cart[index].qty--;
        if (cart[index].qty === 0) cart.splice(index, 1);
      }
      updateCartUI();
    }

    function updateCartUI() {
      const count = document.getElementById('cart-count');
      const bar = document.getElementById('floating-cart');
      const totalEl = document.getElementById('floating-total');
      
      let totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      let totalPrice = cart.reduce((sum, item) => sum + (Number(item.price) * item.qty), 0);

      if (totalItems > 0) {
        count.classList.remove('hidden');
        count.textContent = totalItems;
        bar.classList.remove('hidden');
        totalEl.textContent = `₦${totalPrice.toLocaleString()}`;
      } else {
        count.classList.add('hidden');
        bar.classList.add('hidden');
      }
      
      if(document.getElementById('cart-modal').classList.contains('flex')) {
          renderCartModal();
      }
    }

    function openCart() {
      if (cart.length === 0) return alert("Your cart is empty.");
      document.getElementById('cart-modal').classList.remove('hidden');
      document.getElementById('cart-modal').classList.add('flex');
      renderCartModal();
    }

    function closeCart() {
      document.getElementById('cart-modal').classList.add('hidden');
      document.getElementById('cart-modal').classList.remove('flex');
    }

    function renderCartModal() {
      const list = document.getElementById('cart-items-list');
      let totalPrice = 0;

      list.innerHTML = cart.map(item => {
        totalPrice += Number(item.price) * item.qty;
        return `
          <div class="flex items-center gap-3 bg-gray-50 p-2 rounded-xl border border-gray-100">
            <div class="flex-1">
              <p class="font-bold text-gray-800 text-sm">${item.item_name}</p>
              <p class="text-xs text-blue-600 font-bold">₦${Number(item.price).toLocaleString()}</p>
            </div>
            <div class="flex items-center gap-2 bg-white border rounded-lg p-1 shadow-sm">
              <button onclick="removeFromCart('${item.id}')" class="text-gray-500 p-1 hover:text-red-500"><i data-lucide="minus" class="w-3 h-3"></i></button>
              <span class="font-bold text-sm w-4 text-center">${item.qty}</span>
              <button onclick="addToCart('${item.id}')" class="text-gray-500 p-1 hover:text-green-500"><i data-lucide="plus" class="w-3 h-3"></i></button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('modal-cart-total').textContent = `₦${totalPrice.toLocaleString()}`;
      lucide.createIcons();
    }

    function selectPayment(method) {
      selectedPayment = method;
      
      ['pay-cash', 'pay-pos', 'pay-transfer', 'pay-waiter'].forEach(id => {
        document.getElementById(id).className = "py-3 rounded-xl font-bold bg-gray-100 text-gray-600 transition border-2 border-transparent flex items-center justify-center gap-2";
      });
      
      const activeClass = "py-3 rounded-xl font-bold bg-gray-800 text-white transition border-2 border-gray-900 flex items-center justify-center gap-2 shadow-md";
      
      if (method === 'Cash') document.getElementById('pay-cash').className = activeClass;
      if (method === 'POS') document.getElementById('pay-pos').className = activeClass;
      if (method === 'Transfer') document.getElementById('pay-transfer').className = activeClass;
      if (method === 'Call_Waiter') document.getElementById('pay-waiter').className = activeClass;
    }

    async function submitOrder() {
      if (!selectedPayment) return alert("Please select a payment method.");
      
      const btn = document.getElementById('checkout-btn');
      btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Processing...`;
      btn.disabled = true;

      let totalPrice = cart.reduce((sum, item) => sum + (Number(item.price) * item.qty), 0);

      try {
        // Insert to guest_orders
        const { error } = await db.from('guest_orders').insert({
          table_number: tableNum,
          department: 'Bar',
          items: cart,
          total_amount: totalPrice,
          status: 'Pending',
          payment_method: selectedPayment 
        });

        if (error) throw error;

        closeCart();
        
        const waitModal = document.getElementById('waiting-modal');
        const waitMsg = document.getElementById('waiting-message');
        
        if (selectedPayment === 'Call_Waiter') {
            waitMsg.textContent = "A waiter is on the way to take your payment and serve you.";
        } else {
            waitMsg.textContent = "The barman is confirming your payment. Your drinks will start preparing shortly.";
        }

        waitModal.classList.remove('hidden');
        
        // Poll for status change
        const interval = setInterval(async () => {
            const { data } = await db.from('guest_orders')
              .select('status')
              .eq('table_number', tableNum)
              .order('created_at', { ascending: false })
              .limit(1)
              .single();
              
            if (data && data.status !== 'Pending') {
                clearInterval(interval);
                waitMsg.innerHTML = `Payment Confirmed!<br><span class="text-emerald-400 font-bold">Your order is being prepared.</span>`;
                try { new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3').play(); } catch(e) {}
            }
        }, 3000);
        
        setTimeout(() => clearInterval(interval), 900000);

      } catch (err) {
        alert("Error placing order: " + err.message);
        btn.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5"></i> Place Order`;
        btn.disabled = false;
      }
    }

    function resetOrder() {
        window.location.reload();
    }

    loadProducts();
  </script>
</body>
</html>
