<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos Hotel - Room Service</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap');
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; background-color: #f8fafc; }
    h1, h2, h3 { font-family: 'Playfair Display', serif; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="min-h-screen pb-24">

  <nav class="bg-white p-4 flex justify-between items-center sticky top-0 z-50 border-b border-gray-100">
    <div class="flex items-center gap-2">
      <a href="guest-portal.html" id="back-btn" class="bg-gray-50 p-2 rounded-full active:scale-95 transition"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-700"></i></a>
      <span class="font-bold text-gray-900 tracking-widest text-sm ml-2">ROOM SERVICE</span>
    </div>
    <div class="text-right bg-blue-50 px-3 py-1 rounded-lg">
      <p class="text-[9px] uppercase text-blue-500 font-bold tracking-wider">Room</p>
      <p id="nav-room-num" class="font-bold text-blue-700 leading-none text-lg">---</p>
    </div>
  </nav>

  <!-- Category Tabs -->
  <div class="bg-white px-4 py-3 sticky top-[68px] z-40 border-b border-gray-100">
    <div class="flex gap-2 overflow-x-auto hide-scroll">
      <button onclick="filterMenu('Kitchen', this)" class="tab-btn bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-sm">Food</button>
      <button onclick="filterMenu('Bar', this)" class="tab-btn bg-gray-100 text-gray-600 px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap">Drinks</button>
      <button onclick="filterMenu('Minimart', this)" class="tab-btn bg-gray-100 text-gray-600 px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap">Minimart</button>
    </div>
  </div>

  <main class="max-w-md mx-auto p-4">
    <div id="menu-grid" class="grid grid-cols-2 gap-4">
      <p class="text-center text-gray-500 col-span-2 py-10">Loading delicious meals...</p>
    </div>
  </main>

  <!-- Floating Cart Button -->
  <div id="cart-bar" class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-100 p-4 pb-safe shadow-[0_-10px_20px_rgba(0,0,0,0.05)] hidden">
    <div class="max-w-md mx-auto flex justify-between items-center">
        <div>
            <p class="text-xs text-gray-500 font-bold" id="cart-count">0 items</p>
            <p class="text-xl font-extrabold text-gray-900" id="cart-total">₦0</p>
        </div>
        <button onclick="openCart()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg active:scale-95 transition flex items-center gap-2">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i> View Cart
        </button>
    </div>
  </div>

  <!-- CART MODAL (Hidden by default) -->
  <div id="cart-modal" class="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm hidden flex-col justify-end">
    <div class="bg-white w-full max-w-md mx-auto rounded-t-3xl p-5 pb-safe h-[80vh] flex flex-col">
      
      <div class="flex justify-between items-center border-b pb-4 mb-4">
        <h2 class="text-xl font-bold text-gray-800">Your Order</h2>
        <button onclick="closeCart()" class="bg-gray-100 p-2 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <!-- Cart Items List -->
      <div id="cart-items-list" class="flex-1 overflow-y-auto space-y-3">
        <!-- Items injected here -->
      </div>

      <!-- Cart Summary & Checkout -->
      <div class="border-t pt-4 mt-4">
        <div class="flex justify-between items-center mb-4">
          <span class="text-gray-600 font-bold">Total:</span>
          <span id="modal-cart-total" class="text-2xl font-extrabold text-blue-600">₦0</span>
        </div>
        <button onclick="placeOrder()" id="checkout-btn" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-green-500/30 active:scale-95 transition">
          Charge to Room & Order
        </button>
        <p class="text-center text-[10px] text-gray-400 mt-2">This will be added to your final hotel bill.</p>
      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    const urlParams = new URLSearchParams(window.location.search);
    const roomNum = urlParams.get('room') || '101'; 
    
    document.getElementById('nav-room-num').textContent = roomNum;
    document.getElementById('back-btn').href = `guest-portal.html?room=${roomNum}`;

    let allItems = [];
    let currentCategory = 'Kitchen';
    let cart = [];

    async function loadMenu() {
      const { data: items } = await db.from('menu_items').select('*').eq('is_available', true);
      allItems = items || [];
      renderMenu(currentCategory);
    }

    function filterMenu(category, btn) {
      currentCategory = category;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.className = 'tab-btn bg-gray-100 text-gray-600 px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap';
      });
      btn.className = 'tab-btn bg-blue-600 text-white px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-sm';
      renderMenu(category);
    }

    function renderMenu(category) {
      const grid = document.getElementById('menu-grid');
      const filtered = allItems.filter(item => item.category === category);
      
      if (filtered.length === 0) {
        grid.innerHTML = '<p class="text-center text-gray-500 col-span-2 py-10">No items available in this category right now.</p>';
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden active:scale-95 transition flex flex-col h-full">
          <img src="${item.image_url}" class="w-full h-36 object-cover">
          <div class="p-3 flex flex-col flex-1 justify-between">
            <div>
                <h3 class="font-bold text-gray-800 text-sm leading-tight mb-1">${item.name}</h3>
                <p class="text-[10px] text-gray-500 leading-tight mb-2 line-clamp-2">${item.description || 'Freshly prepared.'}</p>
            </div>
            <div class="flex justify-between items-center mt-2">
              <span class="font-extrabold text-blue-600 text-sm">₦${Number(item.price).toLocaleString()}</span>
              <button onclick="addToCart('${item.id}')" class="bg-orange-100 text-orange-600 p-2 rounded-xl active:bg-orange-200 transition"><i data-lucide="plus" class="w-4 h-4"></i></button>
            </div>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    // --- CART LOGIC ---
    function addToCart(id) {
      const item = allItems.find(i => i.id === id);
      const existing = cart.find(c => c.id === id);
      
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...item, qty: 1 });
      }
      updateCartUI();
    }

    function removeFromCart(id) {
      const index = cart.findIndex(c => c.id === id);
      if (index > -1) {
        cart[index].qty--;
        if (cart[index].qty === 0) cart.splice(index, 1);
      }
      updateCartUI();
    }

    function updateCartUI() {
      const bar = document.getElementById('cart-bar');
      const count = document.getElementById('cart-count');
      const total = document.getElementById('cart-total');
      
      let totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      let totalPrice = cart.reduce((sum, item) => sum + (Number(item.price) * item.qty), 0);

      if (totalItems === 0) {
        bar.classList.add('hidden');
      } else {
        bar.classList.remove('hidden');
        count.innerText = `${totalItems} item${totalItems > 1 ? 's' : ''}`;
        total.innerText = `₦${totalPrice.toLocaleString()}`;
      }
    }

    function openCart() {
      const modal = document.getElementById('cart-modal');
      const list = document.getElementById('cart-items-list');
      const total = document.getElementById('modal-cart-total');

      modal.classList.remove('hidden');
      modal.classList.add('flex');

      let totalPrice = 0;
      list.innerHTML = cart.map(item => {
        totalPrice += Number(item.price) * item.qty;
        return `
          <div class="flex items-center gap-3 bg-gray-50 p-2 rounded-xl border">
            <img src="${item.image_url}" class="w-12 h-12 rounded-lg object-cover">
            <div class="flex-1">
              <p class="font-bold text-gray-800 text-sm">${item.name}</p>
              <p class="text-xs text-blue-600 font-bold">₦${Number(item.price).toLocaleString()}</p>
            </div>
            <div class="flex items-center gap-2 bg-white border rounded-lg p-1">
              <button onclick="removeFromCart('${item.id}')" class="text-gray-500 p-1"><i data-lucide="minus" class="w-3 h-3"></i></button>
              <span class="font-bold text-sm w-4 text-center">${item.qty}</span>
              <button onclick="addToCart('${item.id}')" class="text-gray-500 p-1"><i data-lucide="plus" class="w-3 h-3"></i></button>
            </div>
          </div>
        `;
      }).join('');
      
      total.innerText = `₦${totalPrice.toLocaleString()}`;
      lucide.createIcons();
    }

    function closeCart() {
      const modal = document.getElementById('cart-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // --- PLACE ORDER LOGIC ---
    async function placeOrder() {
      if (cart.length === 0) return;
      
      const btn = document.getElementById('checkout-btn');
      btn.innerText = "Processing Order...";
      btn.disabled = true;

      try {
        // 1. Get Room ID and Active Booking ID
        const { data: roomData } = await db.from('rooms').select('id').eq('room_number', roomNum).single();
        if (!roomData) throw new Error("Room not found");

        const { data: bookingData } = await db.from('bookings')
          .select('id')
          .eq('room_id', roomData.id)
          .eq('status', 'Checked In')
          .limit(1)
          .single();

        if (!bookingData) throw new Error("No active booking found for this room.");

        let totalAmount = cart.reduce((sum, item) => sum + (Number(item.price) * item.qty), 0);

        // 2. Save Order to guest_orders (For the Kitchen)
        const { error: orderError } = await db.from('guest_orders').insert({
          room_id: roomData.id,
          booking_id: bookingData.id,
          items: cart,
          total_amount: totalAmount,
          status: 'Pending'
        });
        if (orderError) throw orderError;

        // 3. Add to Folio (For the Bill)
        for (const item of cart) {
            await db.from('folio_charges').insert({
              booking_id: bookingData.id,
              department: item.category,
              description: `${item.qty}x ${item.name}`,
              amount: Number(item.price) * item.qty
            });
        }

        // 4. Success
        alert("✅ Order Sent to Kitchen!\nIt has been added to your room bill.");
        cart = [];
        updateCartUI();
        closeCart();

      } catch (err) {
        alert("Order Failed: " + err.message);
      } finally {
        btn.innerText = "Charge to Room & Order";
        btn.disabled = false;
      }
    }

    loadMenu();
  </script>
</body>
</html>
