<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos Hotel - POS</title>
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) { registration.unregister(); }
      });
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Outfit', sans-serif; background-color: #0f172a; color: #f8fafc; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen pb-10 flex flex-col md:flex-row">

  <!-- LEFT SIDE: MENU -->
  <div class="flex-1 p-4 md:p-6 overflow-y-auto h-screen border-b md:border-b-0 md:border-r border-slate-700/50">
    <div class="flex justify-between items-center mb-6">
      <div class="flex items-center gap-3">
        <a href="dashboard.html" class="bg-slate-800 p-2 rounded-xl text-slate-300 hover:bg-slate-700 transition"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
        <div>
          <h1 id="pos-title" class="font-bold text-white text-xl leading-tight">POS Terminal</h1>
          <p id="pos-dept" class="text-[10px] text-yellow-400 uppercase tracking-widest font-bold">Loading...</p>
        </div>
      </div>
      <div id="shift-status" class="bg-slate-800 px-3 py-1 rounded-lg text-xs font-bold text-red-400">No Active Shift</div>
    </div>

    <!-- Category Tabs -->
    <div class="flex gap-2 overflow-x-auto hide-scroll mb-4 pb-2" id="category-tabs">
      <button onclick="filterCategory('All')" class="cat-btn bg-yellow-500 text-black px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap shadow-md">All Items</button>
    </div>

    <!-- Product Grid -->
    <div id="product-grid" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
      <p class="text-slate-400 text-sm animate-pulse col-span-full">Loading menu...</p>
    </div>
  </div>

  <!-- RIGHT SIDE: CART -->
  <div class="w-full md:w-96 bg-slate-900 flex flex-col h-screen">
    <div class="p-4 border-b border-slate-700/50 bg-slate-800/30">
      <h2 class="font-bold text-white flex items-center gap-2"><i data-lucide="shopping-cart" class="w-5 h-5 text-emerald-400"></i> Current Order</h2>
    </div>

    <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3 hide-scroll">
      <p class="text-center text-slate-500 text-sm mt-10">No items added yet.</p>
    </div>

    <div class="p-4 border-t border-slate-700/50 bg-slate-800/80">
      <div class="flex justify-between items-center mb-4">
        <span class="text-slate-400 font-medium">Total:</span>
        <span id="cart-total" class="text-3xl font-black text-white">₦0</span>
      </div>

      <!-- PAYMENT METHODS -->
      <div class="grid grid-cols-2 gap-2 mb-2">
        <button onclick="setPaymentMethod('Cash')" id="pay-cash" class="py-3 rounded-xl font-bold bg-slate-700 text-white transition active:scale-95">Cash</button>
        <button onclick="setPaymentMethod('POS')" id="pay-pos" class="py-3 rounded-xl font-bold bg-slate-700 text-white transition active:scale-95">Card / POS</button>
        <button onclick="setPaymentMethod('Transfer')" id="pay-transfer" class="py-3 rounded-xl font-bold bg-slate-700 text-white transition active:scale-95">Transfer</button>
        <button onclick="setPaymentMethod('Charge_to_Room')" id="pay-room" class="py-3 rounded-xl font-bold bg-slate-700 text-white transition active:scale-95">To Room</button>
      </div>

      <button onclick="processCheckout()" id="checkout-btn" class="w-full bg-emerald-500 text-black py-4 rounded-xl font-black text-lg shadow-lg active:scale-95 transition mt-2">Complete & Print</button>
    </div>
  </div>

  <!-- Room Selection Modal -->
  <div id="room-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-[100] p-4">
    <div class="bg-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-700 fade-in">
      <h2 class="text-xl font-bold text-white mb-4 text-center">Charge to Room</h2>
      <p class="text-xs text-slate-400 text-center mb-4">Select the guest's room to post this charge.</p>
      <select id="room-select" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl text-white outline-none font-bold text-lg mb-4">
        <option value="">-- Select Room --</option>
      </select>
      <div class="flex gap-2">
        <button onclick="closeRoomModal()" class="w-1/3 bg-slate-700 text-white font-bold py-3 rounded-xl">Cancel</button>
        <button onclick="confirmRoomCharge()" class="flex-1 bg-emerald-500 text-black font-bold py-3 rounded-xl shadow-lg">Confirm Room</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.log(err))); }

    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    const urlParams = new URLSearchParams(window.location.search);
    const department = urlParams.get('dept') || 'Bar';
    
    document.getElementById('pos-dept').textContent = department + ' Station';
    document.getElementById('pos-title').textContent = department + ' POS';

    let allProducts = [];
    let cart = [];
    let currentUser = null;
    let selectedPaymentMethod = 'Cash';
    let selectedRoomForCharge = null;

    async function init() {
      const { data: { user } } = await db.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }
      currentUser = user;

      // Check Shift Status
      const { data: shifts } = await db.from('shifts').select('*').eq('user_id', user.id).eq('department', department).eq('status', 'Active').limit(1);
      if (shifts && shifts.length > 0) {
        document.getElementById('shift-status').textContent = "Active Shift";
        document.getElementById('shift-status').className = "bg-slate-800 px-3 py-1 rounded-lg text-xs font-bold text-emerald-400";
      }

      loadProducts();
      loadRoomsForCharge();
      setPaymentMethod('Cash');
    }

    async function loadProducts() {
      const { data: products } = await db.from('inventory').select('*').eq('department', department).order('item_name');
      allProducts = products || [];

      // Extract unique categories
      const categories = ['All', ...new Set(allProducts.map(p => p.category || 'Uncategorized'))];
      const tabsContainer = document.getElementById('category-tabs');
      tabsContainer.innerHTML = categories.map(cat => `
        <button onclick="filterCategory('${cat}')" class="cat-btn ${cat === 'All' ? 'bg-yellow-500 text-black' : 'bg-slate-800 text-slate-300'} px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap shadow-md">${cat}</button>
      `).join('');

      renderProducts('All');
    }

    function renderProducts(category) {
      const grid = document.getElementById('product-grid');
      const filtered = category === 'All' ? allProducts : allProducts.filter(p => (p.category || 'Uncategorized') === category);

      if (filtered.length === 0) {
        grid.innerHTML = '<p class="text-slate-500 col-span-full">No items found.</p>';
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div onclick="addToCart('${p.id}', '${p.item_name.replace(/'/g, "\\'")}', ${p.price}, ${p.stock_quantity})" class="bg-slate-800 p-3 rounded-xl border border-slate-700 shadow-sm cursor-pointer hover:border-yellow-500 transition active:scale-95 flex flex-col justify-between">
          <div>
            <h3 class="font-bold text-white text-sm leading-tight mb-1">${p.item_name}</h3>
            <p class="text-yellow-400 font-black">₦${Number(p.price).toLocaleString()}</p>
          </div>
          <div class="mt-2 flex justify-between items-center">
            <span class="text-[10px] ${p.stock_quantity > 5 ? 'text-slate-400' : 'text-red-400 font-bold'}">${p.stock_quantity} left</span>
            <i data-lucide="plus-circle" class="w-5 h-5 text-emerald-400"></i>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function filterCategory(category) {
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = "cat-btn bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap shadow-md";
      });
      event.target.className = "cat-btn bg-yellow-500 text-black px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap shadow-md";
      renderProducts(category);
    }

    function addToCart(id, name, price, stock) {
      const existing = cart.find(item => item.id === id);
      if (existing) {
        if (existing.qty >= stock) return alert("Not enough stock available!");
        existing.qty++;
      } else {
        if (stock < 1) return alert("Out of stock!");
        cart.push({ id, name, price, qty: 1 });
      }
      renderCart();
    }

    function renderCart() {
      const list = document.getElementById('cart-items');
      if (cart.length === 0) {
        list.innerHTML = '<p class="text-center text-slate-500 text-sm mt-10">No items added yet.</p>';
        document.getElementById('cart-total').textContent = '₦0';
        return;
      }

      let total = 0;
      list.innerHTML = cart.map((item, index) => {
        total += (item.price * item.qty);
        return `
          <div class="flex justify-between items-center bg-slate-800 p-3 rounded-xl border border-slate-700">
            <div>
              <p class="font-bold text-white text-sm">${item.name}</p>
              <p class="text-xs text-yellow-400">₦${item.price.toLocaleString()}</p>
            </div>
            <div class="flex items-center gap-3">
              <button onclick="changeQty(${index}, -1)" class="bg-slate-700 w-8 h-8 rounded-full text-white font-bold flex items-center justify-center">-</button>
              <span class="font-bold text-white w-4 text-center">${item.qty}</span>
              <button onclick="changeQty(${index}, 1)" class="bg-slate-700 w-8 h-8 rounded-full text-white font-bold flex items-center justify-center">+</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('cart-total').textContent = `₦${total.toLocaleString()}`;
    }

    function changeQty(index, change) {
      cart[index].qty += change;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      renderCart();
    }

    function setPaymentMethod(method) {
      selectedPaymentMethod = method;
      ['Cash', 'POS', 'Transfer', 'Charge_to_Room'].forEach(m => {
        const btn = document.getElementById(`pay-${m.toLowerCase().replace('_', '-')}`) || document.getElementById(`pay-room`);
        // Reset all
        document.getElementById('pay-cash').className = "py-3 rounded-xl font-bold bg-slate-700 text-white transition active:scale-95";
        document.getElementById('pay-pos').className = "py-3 rounded-xl font-bold bg-slate-700 text-white transition active:scale-95";
        document.getElementById('pay-transfer').className = "py-3 rounded-xl font-bold bg-slate-700 text-white transition active:scale-95";
        document.getElementById('pay-room').className = "py-3 rounded-xl font-bold bg-slate-700 text-white transition active:scale-95";
      });

      // Highlight active
      if (method === 'Cash') document.getElementById('pay-cash').className = "py-3 rounded-xl font-bold bg-emerald-500 text-black shadow-md transition active:scale-95";
      if (method === 'POS') document.getElementById('pay-pos').className = "py-3 rounded-xl font-bold bg-blue-500 text-white shadow-md transition active:scale-95";
      if (method === 'Transfer') document.getElementById('pay-transfer').className = "py-3 rounded-xl font-bold bg-purple-500 text-white shadow-md transition active:scale-95";
      if (method === 'Charge_to_Room') document.getElementById('pay-room').className = "py-3 rounded-xl font-bold bg-orange-500 text-white shadow-md transition active:scale-95";
    }

    async function loadRoomsForCharge() {
      const { data: rooms } = await db.from('rooms').select('room_number').eq('status', 'Occupied').order('room_number');
      const select = document.getElementById('room-select');
      if (rooms && rooms.length > 0) {
        rooms.forEach(r => {
          select.innerHTML += `<option value="${r.room_number}">Room ${r.room_number}</option>`;
        });
      } else {
        select.innerHTML = '<option value="">No occupied rooms found.</option>';
      }
    }

    function closeRoomModal() {
      document.getElementById('room-modal').classList.add('hidden');
      document.getElementById('room-modal').classList.remove('flex');
    }

    function confirmRoomCharge() {
      const room = document.getElementById('room-select').value;
      if (!room) return alert("Please select a room.");
      selectedRoomForCharge = room;
      closeRoomModal();
      processCheckout(); // Proceed immediately after room selection
    }

    async function processCheckout() {
      if (cart.length === 0) return alert("Cart is empty.");
      
      if (selectedPaymentMethod === 'Charge_to_Room' && !selectedRoomForCharge) {
        document.getElementById('room-modal').classList.remove('hidden');
        document.getElementById('room-modal').classList.add('flex');
        return;
      }

      const btn = document.getElementById('checkout-btn');
      btn.innerHTML = `<i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i> Processing...`;
      btn.disabled = true;

      let total = 0;
      cart.forEach(item => total += (item.price * item.qty));

      try {
        // 1. Insert into POS Orders
        const { data: order, error: orderErr } = await db.from('pos_orders').insert({
          department: department,
          total_amount: total,
          payment_method: selectedPaymentMethod,
          created_by: currentUser.id
        }).select().single();
        
        if (orderErr) throw orderErr;

        // 2. Insert Items & Deduct Inventory
        for (const item of cart) {
          await db.from('pos_order_items').insert({
            pos_order_id: order.id,
            item_name: item.name,
            quantity: item.qty,
            price: item.price
          });

          // Deduct stock
          const { data: prod } = await db.from('inventory').select('stock_quantity').eq('id', item.id).single();
          if (prod) {
            await db.from('inventory').update({ stock_quantity: prod.stock_quantity - item.qty }).eq('id', item.id);
          }
        }

        // 3. If Charged to Room, create Folio Charge
        if (selectedPaymentMethod === 'Charge_to_Room' && selectedRoomForCharge) {
          const { data: roomData } = await db.from('rooms').select('id').eq('room_number', selectedRoomForCharge).single();
          const { data: booking } = await db.from('bookings').select('id').eq('room_id', roomData.id).eq('status', 'Checked In').single();
          
          if (booking) {
            await db.from('folio_charges').insert({
              booking_id: booking.id,
              department: department,
              description: cart.map(i => `${i.qty}x ${i.name}`).join(', '),
              amount: total
            });
          }
        }

        alert(`✅ Order Completed!\nTotal: ₦${total.toLocaleString()}\nPaid via: ${selectedPaymentMethod}`);
        cart = [];
        selectedRoomForCharge = null;
        renderCart();
        loadProducts(); // Reload to show updated stock
        
      } catch (err) {
        alert("Checkout Error: " + err.message);
      } finally {
        btn.innerHTML = `Complete & Print`;
        btn.disabled = false;
      }
    }

    init();
  </script>
</body>
</html>
