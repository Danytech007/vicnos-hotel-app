<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos Hotel - Bar POS</title>
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) { registration.unregister(); }
      });
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Outfit', sans-serif; background-color: #0f172a; color: #f8fafc; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; overflow: hidden; height: 100vh; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    .product-card { transition: all 0.2s ease; cursor: pointer; }
    .product-card:active { transform: scale(0.96); }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="flex flex-col md:flex-row">

  <!-- LEFT SIDE: MENU & SEARCH -->
  <div class="flex-1 flex flex-col min-h-0 border-b md:border-b-0 md:border-r border-slate-700/50">
    
    <!-- HEADER -->
    <div class="p-4 md:p-6 bg-slate-900/50 backdrop-blur-md border-b border-slate-700/50 flex justify-between items-center shrink-0">
      <div class="flex items-center gap-3">
        <a href="dashboard.html" class="bg-slate-800 p-2 rounded-xl text-slate-300 hover:bg-slate-700 transition"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
        <div>
          <h1 class="font-bold text-white text-xl leading-tight">Vicnos Bar</h1>
          <p class="text-[10px] text-yellow-400 uppercase tracking-widest font-bold">Outdoor & Lounge</p>
        </div>
      </div>
      
      <!-- SEARCH BAR -->
      <div class="relative w-full max-w-xs hidden md:block">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
        <input type="text" id="search-input" oninput="filterProducts()" placeholder="Search drinks..." class="w-full bg-slate-800 border border-slate-700 rounded-xl py-2 pl-10 pr-4 text-white text-sm outline-none focus:border-yellow-500 transition">
      </div>
    </div>

    <!-- CATEGORY TABS -->
    <div class="px-4 md:px-6 py-3 overflow-x-auto hide-scroll flex gap-2 shrink-0 border-b border-slate-800" id="category-tabs">
      <button onclick="filterCategory('All')" class="cat-btn bg-yellow-500 text-black px-5 py-2 rounded-xl text-sm font-bold whitespace-nowrap shadow-md transition">All Drinks</button>
    </div>

    <!-- PRODUCT GRID -->
    <div class="flex-1 overflow-y-auto hide-scroll p-4 md:p-6 min-h-0">
      <div id="product-grid" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 md:gap-4 pb-20">
        <p class="text-slate-400 text-sm animate-pulse col-span-full">Loading menu...</p>
      </div>
    </div>
  </div>

  <!-- RIGHT SIDE: CART & CHECKOUT -->
  <div class="w-full md:w-[400px] bg-slate-900 flex flex-col min-h-0 shrink-0 relative z-10 shadow-2xl">
    
    <!-- CART HEADER -->
    <div class="p-4 border-b border-slate-700/50 bg-slate-800/30 flex justify-between items-center shrink-0">
      <h2 class="font-bold text-white flex items-center gap-2"><i data-lucide="shopping-bag" class="w-5 h-5 text-yellow-400"></i> Current Order</h2>
      <button onclick="clearCart()" class="text-xs text-red-400 font-bold hover:text-red-300 transition">Clear</button>
    </div>

    <!-- TABLE / GUEST NAME INPUT -->
    <div class="px-4 py-3 bg-slate-800/50 border-b border-slate-700/50 shrink-0">
      <input type="text" id="table-number" placeholder="Table No. or Guest Name (Optional)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white outline-none focus:border-yellow-500 transition">
    </div>

    <!-- CART ITEMS -->
    <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3 hide-scroll min-h-0">
      <div class="h-full flex flex-col items-center justify-center text-slate-500">
        <i data-lucide="glass-water" class="w-12 h-12 mb-3 opacity-20"></i>
        <p class="text-sm">Tap a drink to add it</p>
      </div>
    </div>

    <!-- TOTALS & PAYMENT -->
    <div class="p-4 border-t border-slate-700/50 bg-slate-800/80 shrink-0">
      <div class="flex justify-between items-center mb-4">
        <span class="text-slate-400 font-medium">Total:</span>
        <span id="cart-total" class="text-4xl font-black text-white">₦0</span>
      </div>

      <!-- PAYMENT BUTTONS -->
      <div class="grid grid-cols-2 gap-2 mb-3">
        <button onclick="setPaymentMethod('Cash')" id="pay-cash" class="py-3 rounded-xl font-bold bg-slate-700 text-white transition active:scale-95 flex items-center justify-center gap-2"><i data-lucide="banknote" class="w-4 h-4"></i> Cash</button>
        <button onclick="setPaymentMethod('POS')" id="pay-pos" class="py-3 rounded-xl font-bold bg-slate-700 text-white transition active:scale-95 flex items-center justify-center gap-2"><i data-lucide="credit-card" class="w-4 h-4"></i> POS</button>
        <button onclick="setPaymentMethod('Transfer')" id="pay-transfer" class="py-3 rounded-xl font-bold bg-slate-700 text-white transition active:scale-95 flex items-center justify-center gap-2"><i data-lucide="smartphone" class="w-4 h-4"></i> Transfer</button>
        <button onclick="setPaymentMethod('Charge_to_Room')" id="pay-room" class="py-3 rounded-xl font-bold bg-slate-700 text-white transition active:scale-95 flex items-center justify-center gap-2"><i data-lucide="door-closed" class="w-4 h-4"></i> To Room</button>
      </div>

      <button onclick="processCheckout()" id="checkout-btn" class="w-full bg-yellow-500 text-black py-4 rounded-xl font-black text-lg shadow-lg shadow-yellow-500/20 active:scale-95 transition flex items-center justify-center gap-2">
        <i data-lucide="check-circle" class="w-6 h-6"></i> Charge ₦0
      </button>
    </div>
  </div>

  <!-- Room Selection Modal -->
  <div id="room-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-[100] p-4">
    <div class="glass-card w-full max-w-sm rounded-3xl p-6 shadow-2xl fade-in border-t-4 border-yellow-500">
      <h2 class="text-xl font-bold text-white mb-2 text-center">Charge to Room</h2>
      <p class="text-xs text-slate-400 text-center mb-6">Select the guest's room number.</p>
      <select id="room-select" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl text-white outline-none font-bold text-lg mb-6">
        <option value="">-- Select Room --</option>
      </select>
      <div class="flex gap-3">
        <button onclick="closeRoomModal()" class="w-1/3 bg-slate-800 text-white font-bold py-3 rounded-xl border border-slate-700">Cancel</button>
        <button onclick="confirmRoomCharge()" class="flex-1 bg-yellow-500 text-black font-bold py-3 rounded-xl shadow-lg">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.log(err))); }

    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    const urlParams = new URLSearchParams(window.location.search);
    const department = urlParams.get('dept') || 'Bar';
    
    let allProducts = [];
    let filteredProducts = [];
    let cart = [];
    let currentUser = null;
    let selectedPaymentMethod = 'Cash';
    let selectedRoomForCharge = null;
    let currentCategory = 'All';

    async function init() {
      const { data: { user } } = await db.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }
      currentUser = user;

      loadProducts();
      loadRoomsForCharge();
      setPaymentMethod('Cash');
    }

    async function loadProducts() {
      try {
        // We explicitly select the columns we need, including the new image_url
        const { data: products, error } = await db.from('inventory')
          .select('id, item_name, price, stock_quantity, category, image_url')
          .eq('department', department)
          .order('item_name');
          
        if (error) {
            // If it fails, show the error on the screen so we know why
            document.getElementById('product-grid').innerHTML = `<p class="text-red-400 col-span-full font-bold">Database Error: ${error.message}</p>`;
            return;
        }

        allProducts = products || [];

        const categories = ['All', ...new Set(allProducts.map(p => p.category || 'Uncategorized'))];
        const tabsContainer = document.getElementById('category-tabs');
        tabsContainer.innerHTML = '';
        
        categories.forEach(cat => {
          tabsContainer.innerHTML += `
            <button onclick="filterCategory('${cat}')" class="cat-btn ${cat === 'All' ? 'bg-yellow-500 text-black' : 'bg-slate-800 text-slate-300'} px-5 py-2 rounded-xl text-sm font-bold whitespace-nowrap shadow-sm border border-slate-700 transition">${cat}</button>
          `;
        });

        filterCategory('All');
      } catch (err) {
        document.getElementById('product-grid').innerHTML = `<p class="text-red-400 col-span-full font-bold">Error loading menu: ${err.message}</p>`;
      }
    }

    function filterCategory(category) {
      currentCategory = category;
      
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = "cat-btn bg-slate-800 text-slate-300 px-5 py-2 rounded-xl text-sm font-bold whitespace-nowrap shadow-sm border border-slate-700 transition";
      });
      event.target.className = "cat-btn bg-yellow-500 text-black px-5 py-2 rounded-xl text-sm font-bold whitespace-nowrap shadow-sm border border-yellow-500 transition";
      
      if (category === 'All') {
        filteredProducts = allProducts;
      } else {
        filteredProducts = allProducts.filter(p => (p.category || 'Uncategorized') === category);
      }
      
      renderProducts();
    }

    function filterProducts() {
      const query = document.getElementById('search-input').value.toLowerCase();
      let baseList = currentCategory === 'All' ? allProducts : allProducts.filter(p => (p.category || 'Uncategorized') === currentCategory);
      filteredProducts = baseList.filter(p => p.item_name.toLowerCase().includes(query));
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('product-grid');
      
      if (filteredProducts.length === 0) {
        grid.innerHTML = '<p class="text-slate-500 col-span-full text-center py-10">No drinks found.</p>';
        return;
      }

      grid.innerHTML = filteredProducts.map(p => {
        // If image_url exists, show the image. Otherwise, show a sleek gradient and icon.
        const imageHtml = p.image_url 
          ? `<img src="${p.image_url}" class="w-full h-full object-cover absolute top-0 left-0 opacity-90" onerror="this.style.display='none'; document.getElementById('fallback-${p.id}').style.display='flex';">` 
          : ``;

        const fallbackIcon = `
          <div id="fallback-${p.id}" class="absolute top-0 left-0 w-full h-full flex items-center justify-center bg-gradient-to-br from-slate-700 to-slate-800 ${p.image_url ? 'hidden' : 'flex'}">
            <i data-lucide="${p.category === 'Beer' ? 'beer' : p.category === 'Spirits' ? 'wine' : 'glass-water'}" class="w-16 h-16 text-slate-600"></i>
          </div>
        `;

        return `
        <div onclick="addToCart('${p.id}', '${p.item_name.replace(/'/g, "\\'")}', ${p.price}, ${p.stock_quantity})" class="product-card glass-card rounded-2xl flex flex-col justify-between h-40 relative overflow-hidden group">
          
          <!-- Image or Fallback Icon -->
          ${imageHtml}
          ${fallbackIcon}
          
          <!-- Dark Gradient Overlay for Text Readability -->
          <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/60 to-transparent"></div>

          <!-- Content -->
          <div class="relative z-10 p-3 h-full flex flex-col justify-end">
            <h3 class="font-bold text-white text-sm leading-tight mb-1 line-clamp-2 drop-shadow-md">${p.item_name}</h3>
            <div class="flex justify-between items-end w-full">
              <p class="text-yellow-400 font-black text-lg drop-shadow-md">₦${Number(p.price).toLocaleString()}</p>
              <div class="bg-yellow-500/20 p-1 rounded-md mb-1 backdrop-blur-sm border border-yellow-500/30"><i data-lucide="plus" class="w-4 h-4 text-yellow-400"></i></div>
            </div>
            <span class="text-[10px] ${p.stock_quantity > 5 ? 'text-slate-300' : 'text-red-400 font-bold'} mt-1 drop-shadow-md">${p.stock_quantity} left</span>
          </div>
        </div>
      `}).join('');
      lucide.createIcons();
    }

    function addToCart(id, name, price, stock) {
      const existing = cart.find(item => item.id === id);
      if (existing) {
        if (existing.qty >= stock) return alert("Not enough stock available!");
        existing.qty++;
      } else {
        if (stock < 1) return alert("Out of stock!");
        cart.push({ id, name, price, qty: 1 });
      }
      renderCart();
    }

    function changeQty(index, change) {
      cart[index].qty += change;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      renderCart();
    }

    function clearCart() {
      if (cart.length === 0) return;
      if (!confirm("Clear this order?")) return;
      cart = [];
      document.getElementById('table-number').value = '';
      renderCart();
    }

    function renderCart() {
      const list = document.getElementById('cart-items');
      if (cart.length === 0) {
        list.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-slate-500 fade-in">
            <i data-lucide="glass-water" class="w-12 h-12 mb-3 opacity-20"></i>
            <p class="text-sm">Tap a drink to add it</p>
          </div>
        `;
        document.getElementById('cart-total').textContent = '₦0';
        document.getElementById('checkout-btn').innerHTML = `<i data-lucide="check-circle" class="w-6 h-6"></i> Charge ₦0`;
        lucide.createIcons();
        return;
      }

      let total = 0;
      list.innerHTML = cart.map((item, index) => {
        total += (item.price * item.qty);
        return `
          <div class="flex justify-between items-center bg-slate-800/80 p-3 rounded-xl border border-slate-700 fade-in">
            <div class="flex-1">
              <p class="font-bold text-white text-sm">${item.name}</p>
              <p class="text-xs text-yellow-400 font-medium">₦${item.price.toLocaleString()}</p>
            </div>
            <div class="flex items-center gap-3 bg-slate-900 rounded-lg p-1">
              <button onclick="changeQty(${index}, -1)" class="w-7 h-7 rounded-md text-slate-400 hover:text-white hover:bg-slate-700 flex items-center justify-center transition"><i data-lucide="minus" class="w-4 h-4"></i></button>
              <span class="font-bold text-white w-4 text-center">${item.qty}</span>
              <button onclick="changeQty(${index}, 1)" class="w-7 h-7 rounded-md text-slate-400 hover:text-white hover:bg-slate-700 flex items-center justify-center transition"><i data-lucide="plus" class="w-4 h-4"></i></button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('cart-total').textContent = `₦${total.toLocaleString()}`;
      document.getElementById('checkout-btn').innerHTML = `<i data-lucide="check-circle" class="w-6 h-6"></i> Charge ₦${total.toLocaleString()}`;
      lucide.createIcons();
    }

    function setPaymentMethod(method) {
      selectedPaymentMethod = method;
      
      ['pay-cash', 'pay-pos', 'pay-transfer', 'pay-room'].forEach(id => {
        const el = document.getElementById(id);
        if(el) el.className = "py-3 rounded-xl font-bold bg-slate-700 text-white transition active:scale-95 flex items-center justify-center gap-2 border border-slate-600";
      });

      if (method === 'Cash') document.getElementById('pay-cash').className = "py-3 rounded-xl font-bold bg-emerald-500 text-white shadow-md shadow-emerald-500/20 transition active:scale-95 flex items-center justify-center gap-2 border border-emerald-400";
      if (method === 'POS') document.getElementById('pay-pos').className = "py-3 rounded-xl font-bold bg-blue-500 text-white shadow-md shadow-blue-500/20 transition active:scale-95 flex items-center justify-center gap-2 border border-blue-400";
      if (method === 'Transfer') document.getElementById('pay-transfer').className = "py-3 rounded-xl font-bold bg-purple-500 text-white shadow-md shadow-purple-500/20 transition active:scale-95 flex items-center justify-center gap-2 border border-purple-400";
      if (method === 'Charge_to_Room') document.getElementById('pay-room').className = "py-3 rounded-xl font-bold bg-orange-500 text-white shadow-md shadow-orange-500/20 transition active:scale-95 flex items-center justify-center gap-2 border border-orange-400";
    }

    async function loadRoomsForCharge() {
      const { data: rooms } = await db.from('rooms').select('room_number').eq('status', 'Occupied').order('room_number');
      const select = document.getElementById('room-select');
      if (rooms && rooms.length > 0) {
        rooms.forEach(r => {
          select.innerHTML += `<option value="${r.room_number}">Room ${r.room_number}</option>`;
        });
      } else {
        select.innerHTML = '<option value="">No occupied rooms found.</option>';
      }
    }

    function closeRoomModal() {
      document.getElementById('room-modal').classList.add('hidden');
      document.getElementById('room-modal').classList.remove('flex');
    }

    function confirmRoomCharge() {
      const room = document.getElementById('room-select').value;
      if (!room) return alert("Please select a room.");
      selectedRoomForCharge = room;
      closeRoomModal();
      processCheckout(); 
    }

    async function processCheckout() {
      if (cart.length === 0) return alert("Cart is empty.");
      
      if (selectedPaymentMethod === 'Charge_to_Room' && !selectedRoomForCharge) {
        document.getElementById('room-modal').classList.remove('hidden');
        document.getElementById('room-modal').classList.add('flex');
        return;
      }

      const btn = document.getElementById('checkout-btn');
      btn.innerHTML = `<i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i> Processing...`;
      btn.disabled = true;

      let total = 0;
      cart.forEach(item => total += (item.price * item.qty));
      const tableNum = document.getElementById('table-number').value.trim();

      try {
        const { data: order, error: orderErr } = await db.from('pos_orders').insert({
          department: department,
          total_amount: total,
          payment_method: selectedPaymentMethod,
          created_by: currentUser.id,
          table_number: tableNum || null
        }).select().single();
        
        if (orderErr) throw orderErr;

        for (const item of cart) {
          await db.from('pos_order_items').insert({
            pos_order_id: order.id,
            item_name: item.name,
            quantity: item.qty,
            price: item.price
          });

          const { data: prod } = await db.from('inventory').select('stock_quantity').eq('id', item.id).single();
          if (prod) {
            await db.from('inventory').update({ stock_quantity: prod.stock_quantity - item.qty }).eq('id', item.id);
          }
          
          const localProduct = allProducts.find(p => p.id === item.id);
          if (localProduct) {
             localProduct.stock_quantity -= item.qty;
          }
        }

        if (selectedPaymentMethod === 'Charge_to_Room' && selectedRoomForCharge) {
          const { data: roomData } = await db.from('rooms').select('id').eq('room_number', selectedRoomForCharge).single();
          const { data: booking } = await db.from('bookings').select('id').eq('room_id', roomData.id).eq('status', 'Checked In').single();
          
          if (booking) {
            await db.from('folio_charges').insert({
              booking_id: booking.id,
              department: department,
              description: cart.map(i => `${i.qty}x ${i.name}`).join(', '),
              amount: total
            });
          }
        }

        const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3');
        audio.play().catch(e => console.log('Audio block'));

        alert(`✅ Order Completed!\nTotal: ₦${total.toLocaleString()}\nMethod: ${selectedPaymentMethod}${tableNum ? '\nTable: '+tableNum : ''}`);
        
        cart = [];
        selectedRoomForCharge = null;
        document.getElementById('table-number').value = '';
        renderCart();
        filterCategory(currentCategory);
        
      } catch (err) {
        alert("Checkout Error: " + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    init();
  </script>
</body>
</html>
