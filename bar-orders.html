<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vicnos - Bar Live Orders</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen p-4 pb-24">

  <nav class="bg-slate-800 p-4 rounded-2xl shadow-sm flex justify-between items-center mb-6 border border-slate-700">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="bg-slate-700 p-2 rounded-xl text-slate-300 hover:bg-slate-600 transition"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
      <div><h1 class="font-bold text-white text-lg leading-tight">Bar Orders</h1><p class="text-[10px] text-amber-400 font-bold uppercase tracking-wider">Live Feed</p></div>
    </div>
    <div class="bg-amber-500/20 p-2 rounded-full text-amber-400"><i data-lucide="wine" class="w-5 h-5 animate-pulse"></i></div>
  </nav>

  <main class="max-w-2xl mx-auto space-y-4">
    <div id="orders-list" class="space-y-4"><p class="text-center text-slate-400 text-sm py-10 animate-pulse">Listening for Bar orders...</p></div>
  </main>

  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.log(err))); }

    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    async function loadLiveOrders() {
      const list = document.getElementById('orders-list');
      const { data: orders, error } = await db.from('guest_orders').select('*').eq('department', 'Bar').not('status', 'in', '("Completed","Delivered","Cancelled")').order('created_at', { ascending: true });

      if (error || !orders) return list.innerHTML = '<p class="text-center text-red-500">Error loading orders.</p>';

      if (orders.length === 0) {
        list.innerHTML = `<div class="text-center py-20"><div class="bg-slate-800 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4"><i data-lucide="check-circle" class="w-8 h-8 text-emerald-500"></i></div><p class="text-slate-400 font-medium">No active bar orders right now.</p></div>`;
        lucide.createIcons(); return;
      }

      list.innerHTML = orders.map(order => {
        let itemsHtml = '';
        try {
          const items = typeof order.items === 'string' ? JSON.parse(order.items) : order.items;
          itemsHtml = items.map(i => `<li class="flex justify-between text-sm text-slate-300 border-b border-slate-700 py-1 last:border-0"><span class="font-bold text-white">${i.qty}x</span> <span>${i.name}</span></li>`).join('');
        } catch(e) { itemsHtml = `<li>Error reading items</li>`; }

        let statusBadge = `<span class="bg-slate-700 text-slate-300 text-[10px] font-bold px-2 py-1 rounded">${order.status}</span>`;
        if (order.status === 'Pending') statusBadge = `<span class="bg-amber-500/20 text-amber-400 text-[10px] font-bold px-2 py-1 rounded animate-pulse">NEW ORDER</span>`;
        if (order.status === 'Preparing') statusBadge = `<span class="bg-blue-500/20 text-blue-400 text-[10px] font-bold px-2 py-1 rounded">POURING</span>`;
        if (order.status === 'Ready') statusBadge = `<span class="bg-emerald-500/20 text-emerald-400 text-[10px] font-bold px-2 py-1 rounded">READY</span>`;

        return `
          <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg fade-in">
            <div class="flex justify-between items-start mb-3">
              <div><h3 class="text-white font-bold text-xl">Room ${order.room_number}</h3><p class="text-[10px] text-slate-400">${new Date(order.created_at).toLocaleTimeString()}</p></div>
              ${statusBadge}
            </div>
            <ul class="mb-4 bg-slate-900/50 p-3 rounded-xl">${itemsHtml}</ul>
            <div class="flex justify-between items-center border-t border-slate-700 pt-3">
              <p class="font-black text-emerald-400">₦${Number(order.total_amount).toLocaleString()}</p>
              <div class="flex gap-2">
                ${order.status === 'Pending' || !order.status ? `<button onclick="updateOrderStatus('${order.id}', 'Preparing')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2 px-4 rounded-lg shadow-sm">Start Pouring</button>` : ''}
                ${order.status === 'Preparing' ? `<button onclick="updateOrderStatus('${order.id}', 'Ready')" class="bg-amber-500 hover:bg-amber-400 text-white text-xs font-bold py-2 px-4 rounded-lg shadow-sm">Mark Ready</button>` : ''}
                ${order.status === 'Ready' ? `<button onclick="updateOrderStatus('${order.id}', 'Delivered')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 px-4 rounded-lg shadow-sm">Delivered to Room</button>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function updateOrderStatus(orderId, newStatus) {
      await db.from('guest_orders').update({ status: newStatus }).eq('id', orderId);
      loadLiveOrders();
    }

    db.channel('bar-orders-channel')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'guest_orders' }, payload => {
          if (payload.new.department === 'Bar') {
              const msg = new SpeechSynthesisUtterance("New bar order from room " + payload.new.room_number);
              window.speechSynthesis.speak(msg);
              loadLiveOrders();
          }
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'guest_orders' }, payload => { loadLiveOrders(); })
      .subscribe();

    loadLiveOrders();
  </script>
</body>
</html>
