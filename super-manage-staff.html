<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DEKY - Super Manage Staff</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; background-color: #0f172a; color: #f8fafc; }
  </style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
</head>
<body class="min-h-screen pb-24 font-sans">

  <nav class="bg-slate-900 border-b border-slate-700/50 p-5 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="bg-slate-800 p-2 rounded-xl text-slate-300 hover:bg-slate-700">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <div>
        <h1 class="font-bold text-white text-lg leading-tight">Super Manage Staff</h1>
        <p class="text-[10px] text-yellow-400 uppercase tracking-widest font-bold">DEKY Authority</p>
      </div>
    </div>
  </nav>

  <main class="p-4 max-w-2xl mx-auto space-y-5 mt-4">
    <div class="bg-slate-800/40 p-5 rounded-2xl shadow-sm border border-slate-700/50">
      <h2 class="font-bold text-white mb-4 flex items-center gap-2">
        <i data-lucide="users" class="w-5 h-5 text-cyan-400"></i> Executive Staff
      </h2>
      <div id="staff-list" class="space-y-3">
        <p class="text-center text-slate-500 text-sm">Loading...</p>
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    async function loadStaff() {
      const list = document.getElementById('staff-list');
      
      // ADDED 'admin' TO THE LIST
      const { data: staff, error } = await db.from('profiles')
          .select('*')
          .in('role', ['md', 'manager', 'admin', 'accountant', 'supervisor', 'store_keeper', 'blogger'])
          .order('role', { ascending: true });
      
      list.innerHTML = '';
      
      if (error) {
        list.innerHTML = `<p class="text-center text-red-500 text-sm">Error: ${error.message}</p>`;
        return;
      }

      if (!staff || staff.length === 0) {
        list.innerHTML = '<p class="text-center text-slate-500 text-sm">No executive staff found.</p>';
        return;
      }
      
      staff.forEach(s => {
        const isActive = s.is_active;
        const statusBadge = isActive 
            ? `<span class="bg-green-500/20 text-green-400 text-[10px] font-bold px-2 py-1 rounded">ACTIVE</span>`
            : `<span class="bg-red-500/20 text-red-400 text-[10px] font-bold px-2 py-1 rounded">INACTIVE</span>`;

        list.innerHTML += `
          <div class="flex flex-col p-4 border border-slate-700 rounded-xl bg-slate-800 mb-3">
            <div class="flex justify-between items-start mb-3">
              <div>
                <p class="font-bold text-white text-sm">${s.full_name}</p>
                <p class="text-xs text-cyan-400 uppercase font-semibold">${s.role.replace('_', ' ')}</p>
              </div>
              ${statusBadge}
            </div>
            
            <div class="flex gap-2 mt-1">
                <button onclick="resetPassword('${s.id}', '${s.full_name}')" class="flex-1 bg-slate-700 border border-slate-600 text-white py-2 rounded-lg text-xs font-bold active:scale-95 transition flex items-center justify-center gap-1">
                    <i data-lucide="key" class="w-3 h-3"></i> Reset PW
                </button>
                <button onclick="toggleActive('${s.id}', ${isActive})" class="flex-1 ${isActive ? 'bg-red-500/20 text-red-400 border-red-500/30' : 'bg-green-500/20 text-green-400 border-green-500/30'} border py-2 rounded-lg text-xs font-bold active:scale-95 transition flex items-center justify-center gap-1">
                    <i data-lucide="${isActive ? 'user-x' : 'user-check'}" class="w-3 h-3"></i> ${isActive ? 'Deactivate' : 'Activate'}
                </button>
            </div>
          </div>
        `;
      });
      lucide.createIcons();
    }

    async function resetPassword(userId, name) {
        const newPassword = prompt(`Enter new password for ${name}:`);
        if (!newPassword || newPassword.length < 6) return alert("Password must be at least 6 characters.");
        
        const { data, error } = await db.functions.invoke('manage-staff', {
            body: { action: 'reset_password', user_id: userId, new_password: newPassword }
        });
        
        if (error || data.error) alert("Error: " + (error?.message || data.error));
        else alert(`✅ Password reset for ${name}!`);
    }

    async function toggleActive(userId, currentStatus) {
        const newStatus = !currentStatus;
        if (!confirm(`Are you sure you want to ${newStatus ? 'activate' : 'deactivate'} this account?`)) return;

        const { data, error } = await db.functions.invoke('manage-staff', {
            body: { action: 'toggle_active', user_id: userId, is_active: newStatus }
        });
        
        if (error || data.error) alert("Error: " + (error?.message || data.error));
        else loadStaff();
    }

    loadStaff();
  </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg failed', err));
    });
  }
</script>
</body>
</html>
