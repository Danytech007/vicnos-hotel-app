<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos - Housekeeping</title>
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) { registration.unregister(); }
      });
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen pb-24">

  <nav class="bg-slate-900 border-b border-slate-700/50 p-4 flex justify-between items-center sticky top-0 z-50 shadow-md">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="bg-slate-800 p-2 rounded-full text-slate-300 hover:bg-slate-700 transition"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
      <div><h1 class="font-bold text-white text-lg leading-tight">Housekeeping</h1><p class="text-[10px] text-emerald-400 uppercase tracking-widest font-bold">Live Command</p></div>
    </div>
    <button onclick="loadAllData()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2.5 px-4 rounded-xl flex items-center gap-2 shadow-md transition">
      <i data-lucide="refresh-cw" class="w-4 h-4"></i> Refresh
    </button>
  </nav>

  <main class="p-4 max-w-4xl mx-auto mt-2 space-y-6 fade-in">
    
    <!-- 1. GUEST REQUESTS (Rendered beautifully) -->
    <div>
      <h2 class="text-sm font-bold text-slate-300 mb-3 ml-1 uppercase tracking-wider flex items-center gap-2"><i data-lucide="bell-ring" class="w-4 h-4 text-orange-400"></i> Pending Guest Requests</h2>
      <div id="requests-list" class="space-y-3">
        <div class="bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50 text-center">
          <p class="text-slate-400 text-sm animate-pulse">Scanning for requests...</p>
        </div>
      </div>
    </div>

    <!-- 2. ROOM STATUS (Occupied & Dirty only) -->
    <div>
      <h2 class="text-sm font-bold text-slate-300 mb-3 ml-1 uppercase tracking-wider flex items-center gap-2"><i data-lucide="bed" class="w-4 h-4 text-indigo-400"></i> Room Status</h2>
      <div id="rooms-list" class="grid grid-cols-2 md:grid-cols-3 gap-3">
        <p class="col-span-full text-center text-slate-500 text-sm animate-pulse py-4">Loading rooms...</p>
      </div>
    </div>

  </main>

  <!-- CLEANING MODAL -->
  <div id="cleaning-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-[100] p-4">
    <div class="bg-slate-800 w-full max-w-md rounded-3xl p-6 shadow-2xl border border-slate-700 max-h-[90vh] overflow-y-auto hide-scroll">
      
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-white">Room <span id="clean-room-num" class="text-emerald-400">---</span></h2>
        <button onclick="closeCleaningModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-400 mb-1">Cleaned By (Staff Name)</label>
          <input type="text" id="clean-staff-name" placeholder="e.g. Blessing" class="w-full bg-slate-900 border border-slate-700 p-3 rounded-xl text-white outline-none focus:border-emerald-500">
        </div>

        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
          <h3 class="text-sm font-bold text-white mb-3 border-b border-slate-700 pb-1">Facility Status Check</h3>
          <div class="space-y-2 text-sm">
            <div class="flex justify-between items-center">
              <span class="text-slate-300">AC</span>
              <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" id="toggle-ac" class="sr-only peer"><div class="w-9 h-5 bg-slate-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div></label>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-slate-300">Fridge</span>
              <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" id="toggle-fridge" class="sr-only peer"><div class="w-9 h-5 bg-slate-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div></label>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-slate-300">Water Heater</span>
              <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" id="toggle-heater" class="sr-only peer"><div class="w-9 h-5 bg-slate-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div></label>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-slate-300">Ceiling Fan</span>
              <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" id="toggle-fan" class="sr-only peer"><div class="w-9 h-5 bg-slate-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div></label>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-slate-300">TV</span>
              <label class="relative inline-flex items-center cursor-pointer"><input type="checkbox" id="toggle-tv" class="sr-only peer"><div class="w-9 h-5 bg-slate-700 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div></label>
            </div>
          </div>
        </div>

        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
          <h3 class="text-sm font-bold text-white mb-2 text-red-400">Report Broken Item (Optional)</h3>
          <textarea id="clean-note" rows="2" placeholder="Describe the fault..." class="w-full bg-slate-800 border border-slate-700 p-2 rounded-lg text-white text-sm outline-none focus:border-red-500 mb-2"></textarea>
          <div class="flex items-center gap-2">
            <input type="file" id="clean-photo" accept="image/*" capture="environment" class="hidden">
            <button onclick="document.getElementById('clean-photo').click()" class="bg-slate-800 border border-slate-600 text-white text-xs font-bold py-2 px-3 rounded-lg flex items-center gap-2">
              <i data-lucide="camera" class="w-4 h-4"></i> Snap Photo
            </button>
            <span id="photo-name" class="text-xs text-slate-400">No photo attached</span>
          </div>
        </div>

        <button onclick="submitCleaning()" id="clean-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl shadow-lg transition text-lg mt-2">
          Complete & Mark Available
        </button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.log(err))); }
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    let myUserId = null;
    let selectedRoomId = null;

    window.addEventListener('DOMContentLoaded', async () => {
        const { data: { user } } = await db.auth.getUser();
        if(user) myUserId = user.id;
        loadAllData();
        setInterval(loadAllData, 30000); // Auto refresh every 30s
    });

    function loadAllData() {
        loadGuestRequests();
        loadRooms();
    }

    // 1. GUEST REQUESTS
    async function loadGuestRequests() {
        const list = document.getElementById('requests-list');
        const { data: reqs } = await db.from('guest_orders').select('*').eq('department', 'Housekeeping').eq('status', 'Pending').order('created_at', { ascending: true });

        if (!reqs || reqs.length === 0) {
            list.innerHTML = `<div class="bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50 text-center"><p class="text-slate-400 text-sm">No pending guest requests right now. 🎉</p></div>`;
            return;
        }

        list.innerHTML = reqs.map(r => {
            let itemsHtml = '';
            try {
                if (r.items && Array.isArray(r.items)) {
                    itemsHtml = r.items.map(i => `<span class="inline-block bg-orange-500/20 text-orange-400 px-2.5 py-1 rounded-lg text-xs font-bold mr-2 mb-2">${i.qty}x ${i.name}</span>`).join('');
                } else {
                    itemsHtml = `<span class="text-orange-400 font-bold text-sm">${JSON.stringify(r.items)}</span>`;
                }
            } catch (e) {
                itemsHtml = `<span class="text-orange-400 font-bold text-sm">${JSON.stringify(r.items)}</span>`;
            }

            return `
            <div class="bg-slate-900 p-4 rounded-2xl border border-orange-500/30 flex justify-between items-center shadow-lg">
                <div>
                    <h3 class="font-black text-white text-xl">Room ${r.room_number}</h3>
                    <p class="text-[10px] text-slate-400 font-bold uppercase mt-1">${new Date(r.created_at).toLocaleTimeString()}</p>
                    <div class="mt-2 flex flex-wrap">${itemsHtml}</div>
                </div>
                <button onclick="completeRequest('${r.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-5 rounded-xl shadow-md transition flex items-center gap-2">
                    <i data-lucide="check" class="w-5 h-5"></i> Done
                </button>
            </div>
            `;
        }).join('');
        lucide.createIcons();
    }

    async function completeRequest(id) {
        if(!confirm("Mark this request as completed? The guest will be notified.")) return;
        await db.from('guest_orders').update({ status: 'Completed' }).eq('id', id);
        loadGuestRequests();
    }

    // 2. ROOM STATUS (Only Occupied & Dirty)
    async function loadRooms() {
        const list = document.getElementById('rooms-list');
        const today = new Date().toISOString().split('T')[0];

        // Fetch rooms that are Occupied or Dirty
        const { data: rooms } = await db.from('rooms').select('*').in('status', ['Occupied', 'Dirty']).order('room_number');

        // Fetch active bookings to get guest names and checkout times for Occupied rooms
        const { data: bookings } = await db.from('bookings').select('room_id, expected_check_out, guests(full_name)').eq('status', 'Checked In');

        if (!rooms || rooms.length === 0) {
            list.innerHTML = '<p class="col-span-full text-center text-slate-500 py-6">No rooms need cleaning right now.</p>';
            return;
        }

        list.innerHTML = rooms.map(r => {
            let colorClass = '';
            let badge = '';
            let guestInfo = '';

            if (r.status === 'Dirty') {
                colorClass = 'bg-amber-500/10 border-amber-500/50 hover:bg-amber-500/20';
                badge = `<span class="bg-amber-500 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase mt-2 inline-block">Needs Cleaning</span>`;
            } else if (r.status === 'Occupied') {
                colorClass = 'bg-blue-500/10 border-blue-500/50 hover:bg-blue-500/20';
                
                // Find if this room has an active booking
                const booking = bookings?.find(b => b.room_id === r.id);
                if (booking) {
                    const isCheckingOutToday = booking.expected_check_out === today;
                    const textColor = isCheckingOutToday ? 'text-red-400 font-bold' : 'text-slate-400';
                    const icon = isCheckingOutToday ? '<i data-lucide="alert-circle" class="w-3 h-3 inline mr-1"></i>' : '';
                    
                    guestInfo = `
                        <p class="text-[11px] text-white mt-1 truncate">${booking.guests?.full_name || 'Guest'}</p>
                        <p class="text-[10px] ${textColor} mt-1">${icon}Out: ${new Date(booking.expected_check_out).toLocaleDateString()}</p>
                    `;
                }
            }

            return `
                <div class="p-4 rounded-2xl border ${colorClass} cursor-pointer transition transform active:scale-95 shadow-sm" onclick="openCleaningModal('${r.id}', '${r.room_number}', '${r.status}')">
                    <p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Room</p>
                    <p class="text-3xl font-black text-white">${r.room_number}</p>
                    ${guestInfo}
                    ${badge}
                </div>
            `;
        }).join('');
        lucide.createIcons();
    }

    // 3. CLEANING MODAL
    function openCleaningModal(roomId, roomNumber, status) {
        if (status !== 'Dirty') {
            alert(`Room ${roomNumber} is currently Occupied. You can only clean Dirty rooms.`);
            return;
        }
        
        selectedRoomId = roomId;
        document.getElementById('clean-room-num').textContent = roomNumber;
        document.getElementById('clean-staff-name').value = '';
        document.getElementById('clean-note').value = '';
        document.getElementById('clean-photo').value = '';
        document.getElementById('photo-name').textContent = "No photo attached";
        
        document.getElementById('toggle-ac').checked = true;
        document.getElementById('toggle-fridge').checked = true;
        document.getElementById('toggle-heater').checked = true;
        document.getElementById('toggle-fan').checked = true;
        document.getElementById('toggle-tv').checked = true;

        document.getElementById('cleaning-modal').classList.remove('hidden');
        document.getElementById('cleaning-modal').classList.add('flex');
    }

    function closeCleaningModal() {
        document.getElementById('cleaning-modal').classList.add('hidden');
        document.getElementById('cleaning-modal').classList.remove('flex');
    }

    document.getElementById('clean-photo').addEventListener('change', function(e) {
        if(e.target.files.length > 0) {
            document.getElementById('photo-name').textContent = e.target.files[0].name;
        }
    });

    async function submitCleaning() {
        const staffName = document.getElementById('clean-staff-name').value;
        if(!staffName) return alert("Please enter the name of the cleaner.");

        const btn = document.getElementById('clean-submit-btn');
        btn.innerHTML = `<i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i> Saving...`;
        btn.disabled = true;

        try {
            const acStatus = document.getElementById('toggle-ac').checked;
            const fridgeStatus = document.getElementById('toggle-fridge').checked;
            const heaterStatus = document.getElementById('toggle-heater').checked;
            const fanStatus = document.getElementById('toggle-fan').checked;
            const tvStatus = document.getElementById('toggle-tv').checked;
            const note = document.getElementById('clean-note').value;
            const photoFile = document.getElementById('clean-photo').files[0];

            await db.from('rooms').update({ 
                status: 'Available',
                ac_status: acStatus,
                fridge_status: fridgeStatus,
                heater_status: heaterStatus,
                fan_status: fanStatus,
                tv_status: tvStatus,
                cleaned_by: staffName,
                last_cleaned_at: new Date().toISOString()
            }).eq('id', selectedRoomId);

            if (note.trim() !== '' || photoFile) {
                let photoUrl = null;
                if (photoFile) {
                    const fileName = `${Date.now()}_${photoFile.name}`;
                    const { data: uploadData, error: uploadError } = await db.storage.from('maintenance-photos').upload(fileName, photoFile);
                    if (!uploadError) {
                        const { data: urlData } = db.storage.from('maintenance-photos').getPublicUrl(fileName);
                        photoUrl = urlData.publicUrl;
                    }
                }

                await db.from('maintenance_tickets').insert({
                    room_id: selectedRoomId,
                    reported_by: myUserId,
                    issue_description: `Cleaned by ${staffName}. Complaint: ${note || 'See attached photo.'}`,
                    priority: 'Normal',
                    status: 'Pending',
                    photo_url: photoUrl
                });
            }

            alert("✅ Room marked available and logs saved!");
            closeCleaningModal();
            loadAllData();
        } catch (err) {
            alert("Error: " + err.message);
        } finally {
            btn.innerHTML = `Complete & Mark Available`;
            btn.disabled = false;
        }
    }
  </script>
</body>
</html>
