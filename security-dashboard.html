<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos - Security Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
  </style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
</head>
<body class="min-h-screen p-4 flex flex-col items-center pb-24">

  <div class="w-full max-w-md bg-slate-800 p-6 rounded-3xl shadow-2xl border border-slate-700 mt-6">
    
    <div class="text-center mb-6">
        <div class="bg-red-500/20 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-3 border border-red-500/30">
            <i data-lucide="shield-alert" class="w-10 h-10 text-red-400"></i>
        </div>
        <h1 class="text-2xl font-bold text-white">Security Control</h1>
        <p class="text-sm text-slate-400">Gate & Emergency Management</p>
    </div>

    <!-- Emergency Button -->
    <button onclick="triggerPanic()" class="w-full bg-red-600 hover:bg-red-500 text-white py-6 rounded-2xl font-bold text-xl shadow-[0_0_20px_rgba(220,38,38,0.5)] active:scale-95 transition mb-6 flex flex-col items-center gap-2">
        <i data-lucide="alarm-clock" class="w-8 h-8 animate-pulse"></i>
        SOUND PANIC ALARM
    </button>

    <!-- Staff Clock In/Out (With Scanner & Selfie) -->
    <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700 mb-4">
        <h2 class="text-sm font-bold text-slate-300 mb-3 flex items-center gap-2"><i data-lucide="scan" class="w-4 h-4 text-blue-400"></i> Clock In / Out Staff</h2>
        
        <select id="staff-select" class="w-full bg-slate-800 border border-slate-600 p-3 rounded-xl text-white outline-none mb-3 text-sm">
            <option value="">-- Select Staff to Clock --</option>
        </select>

        <!-- Hidden File Input for Selfie -->
        <input type="file" id="selfie-camera" accept="image/*" capture="user" class="hidden" onchange="processClockIn(this)">
        
        <!-- Hidden Div for QR Scanner -->
        <div id="reader" class="hidden w-full mb-4 rounded-xl overflow-hidden border-2 border-blue-500"></div>

        <button id="clock-btn" onclick="startScan()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl active:scale-95 text-sm transition">
            Scan Gate Code & Take Selfie
        </button>
        <p id="clock-msg" class="text-center text-xs font-bold text-green-400 mt-2"></p>
    </div>

    <!-- Incident Report -->
    <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700 mb-6">
        <h2 class="text-sm font-bold text-slate-300 mb-3 flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4 text-orange-400"></i> Report Incident</h2>
        <input id="inc-title" type="text" placeholder="Title (e.g., Broken Gate Light)" class="w-full bg-slate-800 border border-slate-600 p-3 rounded-xl text-white outline-none mb-2 text-sm">
        <textarea id="inc-desc" placeholder="Describe what happened..." rows="2" class="w-full bg-slate-800 border border-slate-600 p-3 rounded-xl text-white outline-none mb-2 text-sm"></textarea>
        <button onclick="submitIncident()" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-xl active:scale-95 text-sm transition">
            Submit Report to Management
        </button>
        <p id="inc-msg" class="text-center text-xs font-bold text-green-400 mt-2"></p>
    </div>

    <button onclick="window.location.href='dashboard.html'" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-400 py-3 rounded-xl font-bold text-sm transition">Back to Dashboard</button>

  </div>

  <script>
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    let secUserId = null;
    let qrScanner = null;
    const SECRET_GATE_CODE = "VICNOS_GATE_2026";

    async function init() {
        const { data: { user } } = await db.auth.getUser();
        if (!user) return window.location.href = 'index.html';
        secUserId = user.id;

        // Load staff list
        const { data: staff } = await db.from('profiles').select('id, full_name, role').neq('role', 'super_admin').neq('role', 'security').order('full_name');
        const select = document.getElementById('staff-select');
        if(staff) {
            staff.forEach(s => {
                select.innerHTML += `<option value="${s.id}">${s.full_name} (${s.role})</option>`;
            });
        }
    }

    // --- PANIC BUTTON ---
    async function triggerPanic() {
        const confirmAlarm = confirm("⚠️ Are you sure you want to trigger the SILENT PANIC ALARM? This will alert Management.");
        if(!confirmAlarm) return;

        await db.from('panic_alerts').insert({
            user_id: secUserId,
            location: 'Main Gate / Security Post',
            message: 'EMERGENCY ALARM TRIGGERED BY SECURITY',
            status: 'Active'
        });
        alert("🚨 ALARM SENT! Management has been notified.");
    }

    // --- SCANNER & SELFIE LOGIC ---
    function startScan() {
        const staffId = document.getElementById('staff-select').value;
        if(!staffId) return alert("Please select a staff member first.");

        document.getElementById('reader').classList.remove('hidden');
        document.getElementById('clock-btn').innerText = "Scanning... Point camera at Gate Code";
        
        qrScanner = new Html5Qrcode("reader");
        
        qrScanner.start(
            { facingMode: "environment" }, // Back camera
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
                if (decodedText === SECRET_GATE_CODE) {
                    qrScanner.stop().then(() => {
                        document.getElementById('reader').classList.add('hidden');
                        document.getElementById('clock-btn').innerText = "Scan Gate Code & Take Selfie";
                        // Trigger the selfie camera
                        document.getElementById('selfie-camera').click();
                    });
                } else {
                    alert("❌ Invalid QR Code. Please scan the Vicnos Gate Code.");
                }
            },
            (errorMessage) => { /* Ignore focusing errors */ }
        ).catch((err) => alert("Camera error: " + err));
    }

    async function processClockIn(input) {
        if (!input.files || input.files.length === 0) return;
        const file = input.files[0];
        const staffId = document.getElementById('staff-select').value;
        const msg = document.getElementById('clock-msg');
        
        msg.textContent = "Uploading selfie & logging attendance...";
        msg.className = "text-center text-xs font-bold text-blue-400 mt-2 animate-pulse";

        try {
            // 1. Upload Selfie
            const fileName = `staff-${staffId}-${Date.now()}.jpg`;
            const { error: uploadError } = await db.storage.from('attendance_photos').upload(fileName, file);
            if (uploadError) throw uploadError;

            const { data: urlData } = db.storage.from('attendance_photos').getPublicUrl(fileName);

            // 2. Check Current Status
            const today = new Date().toISOString().split('T')[0];
            const { data: records } = await db.from('attendance')
                .select('*').eq('user_id', staffId).eq('date', today)
                .order('clock_in', { ascending: false }).limit(1);

            if (records && records.length > 0) {
                const record = records[0];
                if (record.clock_out === null) {
                    // Clock out
                    await db.from('attendance').update({ clock_out: new Date().toISOString() }).eq('id', record.id);
                    msg.textContent = "✅ Staff Clocked OUT successfully.";
                } else {
                    // Clock in again (new shift)
                    await db.from('attendance').insert({ user_id: staffId, clock_in: new Date().toISOString(), date: today, photo_url: urlData.publicUrl });
                    msg.textContent = "✅ Staff Clocked IN successfully.";
                }
            } else {
                // First clock in
                await db.from('attendance').insert({ user_id: staffId, clock_in: new Date().toISOString(), date: today, photo_url: urlData.publicUrl });
                msg.textContent = "✅ Staff Clocked IN successfully.";
            }

            msg.className = "text-center text-xs font-bold text-green-400 mt-2";
            document.getElementById('staff-select').value = "";
            input.value = ""; // reset file input

        } catch (err) {
            msg.textContent = "Error: " + err.message;
            msg.className = "text-center text-xs font-bold text-red-400 mt-2";
            input.value = "";
        }
    }

    // --- INCIDENT REPORTS ---
    async function submitIncident() {
        const title = document.getElementById('inc-title').value;
        const desc = document.getElementById('inc-desc').value;
        const msg = document.getElementById('inc-msg');

        if(!title || !desc) return alert("Please fill in both title and description.");

        msg.textContent = "Submitting...";
        msg.className = "text-center text-xs font-bold text-blue-400 mt-2 animate-pulse";

        const { error } = await db.from('incident_reports').insert({
            reported_by: secUserId,
            title: title,
            description: desc
        });

        if (error) {
            msg.textContent = "Error: " + error.message;
            msg.className = "text-center text-xs font-bold text-red-400 mt-2";
        } else {
            msg.textContent = "✅ Report sent to Management.";
            msg.className = "text-center text-xs font-bold text-green-400 mt-2";
            document.getElementById('inc-title').value = '';
            document.getElementById('inc-desc').value = '';
            setTimeout(() => msg.textContent = '', 3000);
        }
    }

    init();
  </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg failed', err));
    });
  }
</script>
</body>
</html>
