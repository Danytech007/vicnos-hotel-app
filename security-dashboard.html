<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos - Security Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">

  <div class="w-full max-w-md bg-slate-800 p-6 rounded-3xl shadow-2xl border border-slate-700 mt-6">
    
    <div class="text-center mb-6">
        <div class="bg-red-500/20 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-3 border border-red-500/30">
            <i data-lucide="shield-alert" class="w-10 h-10 text-red-400"></i>
        </div>
        <h1 class="text-2xl font-bold text-white">Security Control</h1>
        <p class="text-sm text-slate-400">Gate & Emergency Management</p>
    </div>

    <!-- Emergency Button -->
    <button onclick="triggerPanic()" class="w-full bg-red-600 text-white py-6 rounded-2xl font-bold text-xl shadow-[0_0_20px_rgba(220,38,38,0.5)] active:scale-95 transition mb-6 flex flex-col items-center gap-2">
        <i data-lucide="alarm-clock" class="w-8 h-8"></i>
        SOUND PANIC ALARM
    </button>

    <!-- Staff Clock In/Out -->
    <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700 mb-4">
        <h2 class="text-sm font-bold text-slate-300 mb-3 flex items-center gap-2"><i data-lucide="clock" class="w-4 h-4 text-blue-400"></i> Log Staff Attendance</h2>
        <select id="staff-select" class="w-full bg-slate-800 border border-slate-600 p-3 rounded-xl text-white outline-none mb-2 text-sm">
            <option value="">-- Select Staff --</option>
        </select>
        <button onclick="clockStaff()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl active:scale-95 text-sm">Clock In / Out</button>
        <p id="clock-msg" class="text-center text-xs font-bold text-green-400 mt-2"></p>
    </div>

    <button onclick="window.location.href='dashboard.html'" class="w-full bg-slate-800 text-slate-400 py-3 rounded-xl font-bold text-sm">Back to Dashboard</button>

  </div>

  <script>
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    let secUserId = null;

    async function init() {
        const { data: { user } } = await db.auth.getUser();
        if (!user) return window.location.href = 'index.html';
        secUserId = user.id;

        // Load staff list for dropdown
        const { data: staff } = await db.from('profiles').select('id, full_name, role').neq('role', 'super_admin').order('full_name');
        const select = document.getElementById('staff-select');
        if(staff) {
            staff.forEach(s => {
                select.innerHTML += `<option value="${s.id}">${s.full_name} (${s.role})</option>`;
            });
        }
    }

    async function triggerPanic() {
        const confirmAlarm = confirm("⚠️ Are you sure you want to trigger the SILENT PANIC ALARM? This will alert Management.");
        if(!confirmAlarm) return;

        await db.from('panic_alerts').insert({
            user_id: secUserId,
            location: 'Main Gate / Security Post',
            message: 'EMERGENCY ALARM TRIGGERED BY SECURITY',
            status: 'Active'
        });
        alert("🚨 ALARM SENT! Management has been notified.");
    }

    async function clockStaff() {
        const staffId = document.getElementById('staff-select').value;
        const msg = document.getElementById('clock-msg');
        if(!staffId) return alert("Select a staff member.");

        const today = new Date().toISOString().split('T')[0];

        // Check if they already clocked in today
        const { data: records } = await db.from('attendance').select('*').eq('user_id', staffId).eq('date', today).order('clock_in', { ascending: false }).limit(1);

        if (records && records.length > 0) {
            const record = records[0];
            if (record.clock_out === null) {
                // Clock out
                await db.from('attendance').update({ clock_out: new Date().toISOString() }).eq('id', record.id);
                msg.textContent = "✅ Staff Clocked OUT successfully.";
            } else {
                // Clock in again (new shift)
                await db.from('attendance').insert({ user_id: staffId, clock_in: new Date().toISOString(), date: today });
                msg.textContent = "✅ Staff Clocked IN successfully.";
            }
        } else {
            // First clock in
            await db.from('attendance').insert({ user_id: staffId, clock_in: new Date().toISOString(), date: today });
            msg.textContent = "✅ Staff Clocked IN successfully.";
        }

        setTimeout(() => msg.textContent = '', 3000);
    }

    init();
  </script>
</body>
</html>
