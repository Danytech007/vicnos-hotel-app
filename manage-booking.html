<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos Hotel - Manage Bookings</title>
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) { registration.unregister(); }
      });
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f8fafc">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen pb-10">

  <nav class="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-50 border-b border-gray-100">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="bg-gray-50 p-2 rounded-xl text-gray-600 hover:bg-gray-200 transition"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
      <div><h1 class="font-bold text-gray-900 text-lg leading-tight">Manage Bookings</h1><p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Front Desk Operations</p></div>
    </div>
    <div class="bg-indigo-50 p-2 rounded-full text-indigo-600"><i data-lucide="arrow-up-right" class="w-5 h-5"></i></div>
  </nav>

  <main class="p-4 max-w-2xl mx-auto space-y-6 mt-2">
    
    <!-- PENDING REQUESTS SECTION -->
    <div id="pending-requests-container" class="hidden space-y-4 fade-in">
      <h2 class="text-lg font-bold text-orange-600 flex items-center gap-2">
        <i data-lucide="bell" class="w-5 h-5 animate-pulse"></i> Pending Guest Requests
      </h2>
      <div id="requests-list" class="space-y-3"></div>
    </div>

    <!-- MANUAL OPERATIONS SECTION -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="users" class="w-5 h-5 text-blue-500"></i> Manual Guest Management</h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Select Active Guest</label>
          <select id="guest-select" onchange="loadGuestDetails()" class="w-full bg-gray-50 border border-gray-300 p-3 rounded-xl text-gray-800 outline-none font-bold">
            <option value="">-- Loading Active Guests... --</option>
          </select>
        </div>

        <div id="operations-container" class="hidden space-y-4 border-t pt-4">
          
          <div class="bg-blue-50 p-3 rounded-lg border border-blue-100 flex justify-between items-center">
            <div>
              <p class="text-xs text-blue-800 font-bold">Current Room: <span id="current-room-num" class="text-lg">---</span></p>
              <p class="text-[10px] text-blue-600">Rate: <span id="current-room-rate">₦0</span>/night</p>
            </div>
            <div class="text-right">
              <p class="text-xs text-blue-800 font-bold">Checkout Date</p>
              <p id="current-checkout-date" class="text-[10px] text-blue-600">---</p>
            </div>
          </div>

          <!-- TABS -->
          <div class="grid grid-cols-2 gap-2 bg-gray-100 p-1 rounded-xl">
            <button onclick="switchOpTab('upgrade')" id="btn-tab-upgrade" class="py-2 rounded-lg text-sm font-bold bg-white text-gray-900 shadow-sm transition">Room Upgrade</button>
            <button onclick="switchOpTab('extend')" id="btn-tab-extend" class="py-2 rounded-lg text-sm font-bold text-gray-500 hover:text-gray-900 transition">Extend Stay</button>
          </div>

          <!-- UPGRADE TAB -->
          <div id="tab-upgrade" class="space-y-4 fade-in">
            <div>
              <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Select New Room</label>
              <select id="new-room-select" onchange="calculateUpgradeCost()" class="w-full bg-white border border-gray-300 p-3 rounded-xl text-gray-800 outline-none font-semibold">
                <option value="">-- Choose an Available Room --</option>
              </select>
            </div>
            <div id="upgrade-cost-display" class="hidden bg-emerald-50 border border-emerald-200 p-3 rounded-xl">
              <p class="text-xs text-emerald-700 font-bold mb-1">New Room Rate</p>
              <p id="new-room-rate-text" class="text-xl font-black text-emerald-800">₦0</p>
            </div>
            <button onclick="processManualUpgrade()" id="upgrade-btn" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold shadow-lg shadow-indigo-500/30 active:scale-95 transition flex items-center justify-center gap-2">
              <i data-lucide="arrow-up-right" class="w-5 h-5"></i> Confirm Upgrade
            </button>
          </div>

          <!-- EXTEND TAB -->
          <div id="tab-extend" class="hidden space-y-4 fade-in">
            <div>
              <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">New Checkout Date</label>
              <input type="date" id="extend-date-input" onchange="calculateExtensionCost()" class="w-full bg-white border border-gray-300 p-3 rounded-xl text-gray-800 outline-none font-semibold">
            </div>
            <div id="extend-cost-display" class="hidden bg-amber-50 border border-amber-200 p-3 rounded-xl">
              <p class="text-xs text-amber-700 font-bold mb-1">Additional Cost</p>
              <p id="extend-cost-text" class="text-xl font-black text-amber-800">₦0</p>
              <p class="text-[10px] text-amber-600 mt-1">For <span id="extra-nights-text">0</span> extra nights.</p>
            </div>
            <button onclick="processExtension()" id="extend-btn" class="w-full bg-amber-600 text-white py-3 rounded-xl font-bold shadow-lg shadow-amber-500/30 active:scale-95 transition flex items-center justify-center gap-2">
              <i data-lucide="calendar-plus" class="w-5 h-5"></i> Confirm Extension
            </button>
          </div>

        </div>
      </div>
    </div>

  </main>

  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.log(err))); }

    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    let activeBookings = [];
    let availableRooms = [];
    let currentBooking = null;
    let selectedNewRoom = null;

    async function loadPage() {
      const { data: bookings } = await db.from('bookings')
        .select('*, rooms(id, room_number, price_per_night, room_type), guests(full_name)')
        .eq('status', 'Checked In');

      activeBookings = bookings || [];
      const select = document.getElementById('guest-select');
      select.innerHTML = '<option value="">-- Select Guest to Manage --</option>';
      activeBookings.forEach(b => {
        select.innerHTML += `<option value="${b.id}">Room ${b.rooms.room_number} - ${b.guests.full_name}</option>`;
      });

      const { data: rooms } = await db.from('rooms').select('*').eq('status', 'Available').order('room_number');
      availableRooms = rooms || [];

      loadPendingRequests();
    }

    async function loadPendingRequests() {
      const container = document.getElementById('pending-requests-container');
      const list = document.getElementById('requests-list');

      const { data: requests } = await db.from('guest_orders')
        .select('*')
        .eq('department', 'Upgrade Request')
        .eq('status', 'Pending');

      if (!requests || requests.length === 0) {
        container.classList.add('hidden');
        return;
      }

      container.classList.remove('hidden');
      list.innerHTML = requests.map(req => {
        const details = req.items[0]; 
        return `
          <div class="bg-orange-50 border border-orange-200 p-4 rounded-xl shadow-sm">
            <div class="flex justify-between items-start mb-2">
              <div>
                <p class="font-bold text-gray-800 text-sm">Upgrade Request</p>
                <p class="text-xs text-gray-600">From Room <strong>${details.old_room}</strong> to Room <strong>${details.new_room}</strong></p>
              </div>
              <span class="bg-orange-200 text-orange-800 text-[10px] font-bold px-2 py-1 rounded">PENDING</span>
            </div>
            <div class="flex gap-2 mt-3">
              <button onclick="approveRequest('${req.id}', '${req.booking_id}', '${details.new_room_id}', '${req.room_id}', '${details.new_room}')" class="flex-1 bg-emerald-600 text-white py-2 rounded-lg text-xs font-bold shadow active:scale-95 transition">Approve & Encode Key</button>
              <button onclick="rejectRequest('${req.id}')" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg text-xs font-bold active:scale-95 transition">Reject</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function approveRequest(requestId, bookingId, newRoomId, oldRoomId, newRoomNum) {
      try {
        await db.from('bookings').update({ room_id: newRoomId }).eq('id', bookingId);
        await db.from('rooms').update({ status: 'Dirty' }).eq('id', oldRoomId);
        await db.from('rooms').update({ status: 'Occupied' }).eq('id', newRoomId);
        await db.from('guest_orders').update({ status: 'Completed' }).eq('id', requestId);
        alert(`✅ Upgrade Approved! Guest moved to Room ${newRoomNum}.`);
        window.location.reload();
      } catch (err) {
        alert("Error approving upgrade: " + err.message);
      }
    }

    async function rejectRequest(requestId) {
      await db.from('guest_orders').update({ status: 'Rejected' }).eq('id', requestId);
      loadPendingRequests();
    }

    function loadGuestDetails() {
      const bookingId = document.getElementById('guest-select').value;
      const container = document.getElementById('operations-container');
      
      if (!bookingId) {
        container.classList.add('hidden');
        currentBooking = null;
        return;
      }

      currentBooking = activeBookings.find(b => b.id === bookingId);
      
      document.getElementById('current-room-num').textContent = currentBooking.rooms.room_number;
      document.getElementById('current-room-rate').textContent = `₦${Number(currentBooking.rooms.price_per_night).toLocaleString()}`;
      
      const currentOutDate = new Date(currentBooking.expected_check_out).toISOString().split('T')[0];
      document.getElementById('current-checkout-date').textContent = new Date(currentBooking.expected_check_out).toLocaleDateString();
      
      // Set up Upgrade Tab
      const roomSelect = document.getElementById('new-room-select');
      roomSelect.innerHTML = '<option value="">-- Choose a Better Room --</option>';
      availableRooms.forEach(r => {
        roomSelect.innerHTML += `<option value="${r.id}" data-price="${r.price_per_night}" data-num="${r.room_number}">Room ${r.room_number} (${r.room_type}) - ₦${Number(r.price_per_night).toLocaleString()}</option>`;
      });

      // Set up Extend Tab
      const extendInput = document.getElementById('extend-date-input');
      extendInput.min = currentOutDate;
      extendInput.value = currentOutDate;
      document.getElementById('extend-cost-display').classList.add('hidden');

      container.classList.remove('hidden');
      switchOpTab('upgrade');
    }

    function switchOpTab(tab) {
      document.getElementById('tab-upgrade').classList.add('hidden');
      document.getElementById('tab-extend').classList.add('hidden');
      
      document.getElementById('btn-tab-upgrade').className = "py-2 rounded-lg text-sm font-bold text-gray-500 hover:text-gray-900 transition";
      document.getElementById('btn-tab-extend').className = "py-2 rounded-lg text-sm font-bold text-gray-500 hover:text-gray-900 transition";

      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      document.getElementById(`btn-tab-${tab}`).className = "py-2 rounded-lg text-sm font-bold bg-white text-gray-900 shadow-sm transition";
    }

    // --- UPGRADE LOGIC ---
    function calculateUpgradeCost() {
      const roomId = document.getElementById('new-room-select').value;
      const display = document.getElementById('upgrade-cost-display');
      
      if (!roomId) {
        display.classList.add('hidden');
        selectedNewRoom = null;
        return;
      }

      selectedNewRoom = availableRooms.find(r => r.id === roomId);
      document.getElementById('new-room-rate-text').textContent = `₦${Number(selectedNewRoom.price_per_night).toLocaleString()}`;
      display.classList.remove('hidden');
    }

    async function processManualUpgrade() {
      if (!selectedNewRoom) return alert("Please select a new room first.");
      if (!confirm(`Move guest from Room ${currentBooking.rooms.room_number} to Room ${selectedNewRoom.room_number}?`)) return;

      const btn = document.getElementById('upgrade-btn');
      btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Processing...`;
      btn.disabled = true;

      try {
        await db.from('bookings').update({ room_id: selectedNewRoom.id }).eq('id', currentBooking.id);
        await db.from('rooms').update({ status: 'Dirty' }).eq('id', currentBooking.rooms.id);
        await db.from('rooms').update({ status: 'Occupied' }).eq('id', selectedNewRoom.id);
        alert(`✅ Upgrade Successful!\nGuest moved to Room ${selectedNewRoom.room_number}.`);
        window.location.href = 'dashboard.html';
      } catch (err) {
        alert("Upgrade Failed: " + err.message);
        btn.innerHTML = `<i data-lucide="arrow-up-right" class="w-5 h-5"></i> Confirm Upgrade`;
        btn.disabled = false;
      }
    }

    // --- EXTEND LOGIC ---
    function calculateExtensionCost() {
      const newDateVal = document.getElementById('extend-date-input').value;
      const display = document.getElementById('extend-cost-display');
      
      if (!newDateVal) {
        display.classList.add('hidden');
        return;
      }

      const oldDate = new Date(currentBooking.expected_check_out);
      const newDate = new Date(newDateVal);

      const diffTime = newDate - oldDate;
      const extraNights = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (extraNights <= 0) {
        display.classList.add('hidden');
        return;
      }

      const extraCost = extraNights * Number(currentBooking.rooms.price_per_night);
      
      document.getElementById('extra-nights-text').textContent = extraNights;
      document.getElementById('extend-cost-text').textContent = `₦${extraCost.toLocaleString()}`;
      display.classList.remove('hidden');
    }

    async function processExtension() {
      const newDateVal = document.getElementById('extend-date-input').value;
      if (!newDateVal) return alert("Please select a new checkout date.");

      const btn = document.getElementById('extend-btn');
      btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Processing...`;
      btn.disabled = true;

      try {
        await db.from('bookings').update({ expected_check_out: newDateVal }).eq('id', currentBooking.id);
        alert(`✅ Stay Extended successfully to ${new Date(newDateVal).toLocaleDateString()}!`);
        window.location.href = 'dashboard.html';
      } catch (err) {
        alert("Extension Failed: " + err.message);
        btn.innerHTML = `<i data-lucide="calendar-plus" class="w-5 h-5"></i> Confirm Extension`;
        btn.disabled = false;
      }
    }

    loadPage();
    setInterval(loadPendingRequests, 10000); 
  </script>
</body>
</html>
