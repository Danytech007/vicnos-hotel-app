<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos Hotel - Manage Bookings</title>
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) { registration.unregister(); }
      });
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f8fafc">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen pb-10">

  <nav class="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-50 border-b border-gray-100">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="bg-gray-50 p-2 rounded-xl text-gray-600 hover:bg-gray-200 transition"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
      <div><h1 class="font-bold text-gray-900 text-lg leading-tight">Manage Bookings</h1><p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Front Desk Operations</p></div>
    </div>
    <div class="bg-indigo-50 p-2 rounded-full text-indigo-600"><i data-lucide="arrow-up-right" class="w-5 h-5"></i></div>
  </nav>

  <main class="p-4 max-w-2xl mx-auto space-y-6 mt-2">
    
    <!-- PENDING REQUESTS SECTION -->
    <div id="pending-requests-container" class="hidden space-y-4 fade-in">
      <h2 class="text-lg font-bold text-orange-600 flex items-center gap-2">
        <i data-lucide="bell" class="w-5 h-5 animate-pulse"></i> Pending Guest Requests
      </h2>
      <div id="requests-list" class="space-y-3"></div>
    </div>

    <!-- MANUAL UPGRADE SECTION -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
      <h2 class="font-bold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="users" class="w-5 h-5 text-blue-500"></i> Manual Room Upgrade</h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Select Active Guest</label>
          <select id="guest-select" onchange="loadGuestDetails()" class="w-full bg-gray-50 border border-gray-300 p-3 rounded-xl text-gray-800 outline-none font-bold">
            <option value="">-- Loading Active Guests... --</option>
          </select>
        </div>

        <div id="upgrade-options" class="hidden space-y-4 border-t pt-4">
          <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
            <p class="text-xs text-blue-800 font-bold">Current Room: <span id="current-room-num" class="text-lg">---</span> (<span id="current-room-rate">₦0</span>/night)</p>
          </div>
          
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wider">Select New Room</label>
            <select id="new-room-select" class="w-full bg-white border border-gray-300 p-3 rounded-xl text-gray-800 outline-none font-semibold">
              <option value="">-- Choose an Available Room --</option>
            </select>
          </div>

          <button onclick="processManualUpgrade()" id="upgrade-btn" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold shadow-lg shadow-indigo-500/30 active:scale-95 transition flex items-center justify-center gap-2">
            <i data-lucide="arrow-up-right" class="w-5 h-5"></i> Confirm Upgrade
          </button>
        </div>
      </div>
    </div>

  </main>

  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.log(err))); }

    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    let activeBookings = [];
    let availableRooms = [];
    let currentBooking = null;

    async function loadPage() {
      // 1. Load Active Guests for Manual Upgrade
      const { data: bookings } = await db.from('bookings')
        .select('*, rooms(id, room_number, price_per_night, room_type), guests(full_name)')
        .eq('status', 'Checked In');

      activeBookings = bookings || [];
      const select = document.getElementById('guest-select');
      select.innerHTML = '<option value="">-- Select Guest to Upgrade --</option>';
      activeBookings.forEach(b => {
        select.innerHTML += `<option value="${b.id}">Room ${b.rooms.room_number} - ${b.guests.full_name}</option>`;
      });

      // 2. Load Available Rooms
      const { data: rooms } = await db.from('rooms').select('*').eq('status', 'Available').order('room_number');
      availableRooms = rooms || [];

      // 3. Load Pending Upgrade Requests
      loadPendingRequests();
    }

    async function loadPendingRequests() {
      const container = document.getElementById('pending-requests-container');
      const list = document.getElementById('requests-list');

      const { data: requests } = await db.from('guest_orders')
        .select('*, bookings(room_number)')
        .eq('department', 'Upgrade Request')
        .eq('status', 'Pending');

      if (!requests || requests.length === 0) {
        container.classList.add('hidden');
        return;
      }

      container.classList.remove('hidden');
      list.innerHTML = requests.map(req => {
        const details = req.items[0]; // We stored old_room and new_room here
        return `
          <div class="bg-orange-50 border border-orange-200 p-4 rounded-xl shadow-sm">
            <div class="flex justify-between items-start mb-2">
              <div>
                <p class="font-bold text-gray-800 text-sm">Upgrade Request</p>
                <p class="text-xs text-gray-600">From Room <strong>${details.old_room}</strong> to Room <strong>${details.new_room}</strong></p>
              </div>
              <span class="bg-orange-200 text-orange-800 text-[10px] font-bold px-2 py-1 rounded">PENDING</span>
            </div>
            <div class="flex gap-2 mt-3">
              <button onclick="approveRequest('${req.id}', '${req.booking_id}', '${details.new_room_id}', '${req.room_id}')" class="flex-1 bg-emerald-600 text-white py-2 rounded-lg text-xs font-bold shadow active:scale-95 transition">Approve</button>
              <button onclick="rejectRequest('${req.id}')" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-lg text-xs font-bold active:scale-95 transition">Reject</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function approveRequest(requestId, bookingId, newRoomId, oldRoomId) {
      if(!confirm("Approve this upgrade? The guest's room will change and their folio will update.")) return;

      try {
        // 1. Update Booking
        await db.from('bookings').update({ room_id: newRoomId }).eq('id', bookingId);
        
        // 2. Old Room -> Dirty
        await db.from('rooms').update({ status: 'Dirty' }).eq('id', oldRoomId);
        
        // 3. New Room -> Occupied
        await db.from('rooms').update({ status: 'Occupied' }).eq('id', newRoomId);

        // 4. Mark request as Completed
        await db.from('guest_orders').update({ status: 'Completed' }).eq('id', requestId);

        alert("✅ Upgrade Approved! Guest has been moved.");
        window.location.reload();
      } catch (err) {
        alert("Error approving upgrade: " + err.message);
      }
    }

    async function rejectRequest(requestId) {
      await db.from('guest_orders').update({ status: 'Rejected' }).eq('id', requestId);
      loadPendingRequests();
    }

    function loadGuestDetails() {
      const bookingId = document.getElementById('guest-select').value;
      const optionsDiv = document.getElementById('upgrade-options');
      
      if (!bookingId) {
        optionsDiv.classList.add('hidden');
        currentBooking = null;
        return;
      }

      currentBooking = activeBookings.find(b => b.id === bookingId);
      document.getElementById('current-room-num').textContent = currentBooking.rooms.room_number;
      document.getElementById('current-room-rate').textContent = `₦${Number(currentBooking.rooms.price_per_night).toLocaleString()}`;
      
      const roomSelect = document.getElementById('new-room-select');
      roomSelect.innerHTML = '<option value="">-- Choose an Available Room --</option>';
      availableRooms.forEach(r => {
        roomSelect.innerHTML += `<option value="${r.id}">Room ${r.room_number} (${r.room_type}) - ₦${Number(r.price_per_night).toLocaleString()}</option>`;
      });

      optionsDiv.classList.remove('hidden');
    }

    async function processManualUpgrade() {
      const newRoomId = document.getElementById('new-room-select').value;
      if (!newRoomId) return alert("Please select a new room.");
      if (!confirm(`Move guest from Room ${currentBooking.rooms.room_number} to the new room?`)) return;

      const btn = document.getElementById('upgrade-btn');
      btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Processing...`;
      btn.disabled = true;

      try {
        await db.from('bookings').update({ room_id: newRoomId }).eq('id', currentBooking.id);
        await db.from('rooms').update({ status: 'Dirty' }).eq('id', currentBooking.rooms.id);
        await db.from('rooms').update({ status: 'Occupied' }).eq('id', newRoomId);

        alert("✅ Room Upgraded Successfully!");
        window.location.href = 'dashboard.html';
      } catch (err) {
        alert("Upgrade Failed: " + err.message);
        btn.innerHTML = `<i data-lucide="arrow-up-right" class="w-5 h-5"></i> Confirm Upgrade`;
        btn.disabled = false;
      }
    }

    loadPage();
  </script>
</body>
</html>
