<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos Hotel - My Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>* { -webkit-tap-highlight-color: transparent; }</style>
</head>
<body class="bg-gray-50 min-h-screen p-4 font-sans flex flex-col items-center justify-center">
  
  <div class="bg-white p-6 rounded-3xl shadow-xl border border-gray-100 w-full max-w-md text-center">
    
    <div class="bg-blue-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
      <i data-lucide="clock" class="w-10 h-10 text-blue-600"></i>
    </div>
    
    <h1 class="text-2xl font-bold text-gray-900 mb-1">My Attendance</h1>
    <p id="staff-name" class="text-gray-500 mb-6 font-medium">Loading...</p>

    <div id="status-area" class="bg-gray-50 p-5 rounded-2xl mb-6 border border-gray-200">
      <p id="status-text" class="text-lg font-bold text-gray-700">Checking status...</p>
      <p id="time-display" class="text-3xl font-black text-blue-600 mt-2 font-mono">--:--:--</p>
    </div>

    <!-- Hidden Selfie Camera -->
    <input type="file" id="selfie-camera" accept="image/*" capture="user" class="hidden" onchange="processClockIn(this)">

    <!-- QR Scanner Div -->
    <div id="reader" class="hidden w-full mb-4 rounded-xl overflow-hidden border-2 border-blue-500 shadow-inner"></div>

    <button id="clock-btn" onclick="startScan()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-blue-500/30 active:scale-95 transition hidden">
      Scan Gate Code to Clock In
    </button>
    
    <a href="dashboard.html" class="block mt-6 text-sm text-gray-500 font-bold hover:text-gray-900 transition">Back to Dashboard</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    let currentUser = null;
    let currentRecord = null;
    let hotelWorkTime = "08:00"; 
    let qrScanner = null;

    const SECRET_GATE_CODE = "VICNOS_GATE_2026";

    setInterval(() => {
      document.getElementById('time-display').innerText = new Date().toLocaleTimeString();
    }, 1000);

    async function loadAttendance() {
      const { data: { user } } = await db.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }
      currentUser = user;

      const { data: profile } = await db.from('profiles').select('full_name').eq('id', user.id).single();
      if (profile) document.getElementById('staff-name').innerText = profile.full_name;

      const { data: settings } = await db.from('settings').select('work_start_time').single();
      if (settings) hotelWorkTime = settings.work_start_time;

      const today = new Date().toISOString().split('T')[0];
      const { data: records } = await db.from('attendance')
        .select('*').eq('user_id', user.id).eq('date', today)
        .order('clock_in', { ascending: false }).limit(1);

      const btn = document.getElementById('clock-btn');
      const statusText = document.getElementById('status-text');

      if (records && records.length > 0) {
        currentRecord = records[0];
        if (currentRecord.clock_out === null) {
          statusText.innerHTML = `Clocked In at <br><span class="text-blue-600">${new Date(currentRecord.clock_in).toLocaleTimeString()}</span>`;
          btn.innerText = "Clock Out (No Scan Needed)";
          btn.className = "w-full bg-red-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-red-500/30 active:scale-95 transition";
          btn.classList.remove('hidden');
          btn.onclick = clockOut; 
        } else {
          statusText.innerHTML = `Shift Completed. <br><span class="text-green-600">Out at ${new Date(currentRecord.clock_out).toLocaleTimeString()}</span>`;
          btn.classList.add('hidden');
        }
      } else {
        statusText.innerText = "You must scan the Gate QR code to clock in.";
        btn.innerText = "Scan Gate Code to Clock In";
        btn.className = "w-full bg-blue-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-blue-500/30 active:scale-95 transition";
        btn.classList.remove('hidden');
        btn.onclick = startScan; 
      }
    }

    function startScan() {
      document.getElementById('reader').classList.remove('hidden');
      document.getElementById('clock-btn').innerText = "Scanning... Point camera at Gate Code";
      
      qrScanner = new Html5Qrcode("reader");
      
      qrScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          if (decodedText === SECRET_GATE_CODE) {
            qrScanner.stop().then(() => {
              document.getElementById('reader').classList.add('hidden');
              document.getElementById('selfie-camera').click();
            });
          } else {
            alert("❌ Invalid QR Code. Please scan the Vicnos Gate Code.");
          }
        },
        (errorMessage) => { }
      ).catch((err) => alert("Camera error: " + err));
    }

    async function processClockIn(input) {
      if (!input.files || input.files.length === 0) return;
      const file = input.files[0];
      
      const btn = document.getElementById('clock-btn');
      btn.innerText = "Uploading Selfie...";
      btn.disabled = true;

      try {
        const fileName = `${currentUser.id}-${Date.now()}.jpg`;
        const { error: uploadError } = await db.storage.from('attendance_photos').upload(fileName, file);

        if (uploadError) throw uploadError;

        const { data: urlData } = db.storage.from('attendance_photos').getPublicUrl(fileName);

        await db.from('attendance').insert({
          user_id: currentUser.id,
          clock_in: new Date().toISOString(),
          date: new Date().toISOString().split('T')[0],
          photo_url: urlData.publicUrl
        });

        alert(`Clocked In Successfully!\nResumption Time: ${hotelWorkTime}`);
        window.location.reload(); 

      } catch (err) {
        alert("Upload failed: " + err.message);
        btn.disabled = false;
        btn.innerText = "Scan Gate Code to Clock In";
      }
    }

    async function clockOut() {
        const btn = document.getElementById('clock-btn');
        btn.innerText = "Processing...";
        btn.disabled = true;
        await db.from('attendance').update({ clock_out: new Date().toISOString() }).eq('id', currentRecord.id);
        alert("Successfully Clocked Out!");
        window.location.reload();
    }

    loadAttendance();
  </script>
</body>
</html>
