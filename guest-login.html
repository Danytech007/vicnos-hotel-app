<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos Hotel - Guest Login</title>
  
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) { registration.unregister(); }
      });
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f8fafc">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
    h1, h2, h3 { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="items-center justify-center p-4">

  <div id="loading-screen" class="fixed inset-0 bg-white flex flex-col items-center justify-center z-[200]">
    <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="text-gray-500 font-bold animate-pulse">Verifying your room...</p>
  </div>

  <div id="error-msg" class="fixed inset-0 bg-red-900 text-white p-6 flex flex-col items-center justify-center z-[300] hidden overflow-y-auto">
    <h1 class="text-2xl font-bold mb-4 text-center">DEBUG DATA DUMP</h1>
    <p class="text-sm mb-4 text-center">Copy this text and send it to Daniel:</p>
    <pre id="debug-text" class="bg-black/50 p-4 rounded-xl text-xs w-full max-w-2xl whitespace-pre-wrap"></pre>
    <button onclick="window.location.reload()" class="mt-6 bg-white text-red-900 px-6 py-2 rounded-full font-bold">Retry</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function init() {
        const urlParams = new URLSearchParams(window.location.search);
        let urlRoom = urlParams.get('room');
        
        if (!urlRoom) {
            document.getElementById('loading-screen').innerHTML = '<p class="text-red-500 font-bold">No room number in URL. Please scan the QR code again.</p>';
            return;
        }

        urlRoom = urlRoom.trim();
        
        try {
            // 1. Get Room ID
            const { data: roomData, error: roomErr } = await db.from('rooms').select('*').eq('room_number', urlRoom).maybeSingle();
            if (roomErr) throw new Error(`ROOM ERROR: ${roomErr.message}`);
            if (!roomData) throw new Error(`ROOM NOT FOUND: No room matches '${urlRoom}' in the database.`);

            // 2. Get Booking
            const { data: booking, error: bookErr } = await db.from('bookings')
              .select('*')
              .eq('room_id', roomData.id)
              .eq('status', 'Checked In')
              .maybeSingle();

            if (bookErr) throw new Error(`BOOKING ERROR: ${bookErr.message}`);
            if (!booking) throw new Error(`NOT CHECKED IN: Room ${urlRoom} exists, but no booking has status 'Checked In'.`);

            // 3. Get Guest
            let guestData = null;
            if (booking.guest_id) {
                const { data: g, error: gErr } = await db.from('guests').select('*').eq('id', booking.guest_id).maybeSingle();
                if (!gErr) guestData = g;
            }

            // 4. SHOW THE DUMP
            const dump = `
ROOM NUMBER: ${urlRoom}
ROOM ID: ${roomData.id}

--- BOOKING DATA ---
ID: ${booking.id}
Guest ID in Booking: ${booking.guest_id}
additional_guest_name: ${booking.additional_guest_name}
Status: ${booking.status}

--- GUEST DATA (Found by Guest ID) ---
${guestData ? `Full Name: ${guestData.full_name}` : 'GUEST ID DOES NOT EXIST IN GUESTS TABLE'}

--- HOW TO FIX ---
If 'Full Name' is blank or says ID does not exist, it means the check-in form failed to save the guest properly.
`;

            document.getElementById('debug-text').textContent = dump;
            document.getElementById('error-msg').classList.remove('hidden');
            document.getElementById('loading-screen').classList.add('hidden');

        } catch (err) {
            document.getElementById('debug-text').textContent = err.message;
            document.getElementById('error-msg').classList.remove('hidden');
            document.getElementById('loading-screen').classList.add('hidden');
        }
    }

    init();
  </script>
</body>
</html>
