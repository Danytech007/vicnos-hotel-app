<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos Hotel - Finance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    input, select, textarea { user-select: text; }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
</head>
<body class="min-h-screen pb-24">

  <nav class="bg-white p-5 shadow-sm flex justify-between items-center sticky top-0 z-50 border-b border-gray-100">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="bg-gray-50 p-2 rounded-xl text-gray-600 hover:bg-gray-100 transition"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
      <div>
        <h1 class="font-bold text-gray-900 text-lg leading-tight">Finance Overview</h1>
        <p class="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Accountant Dashboard</p>
      </div>
    </div>
    <div class="bg-emerald-50 p-2 rounded-full text-emerald-600">
      <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
    </div>
  </nav>

  <main class="p-4 max-w-3xl mx-auto space-y-6">
    
    <!-- Live Operations (New) -->
    <div class="grid grid-cols-2 gap-4">
      <a href="order-board.html" class="bg-slate-900 p-5 rounded-2xl shadow-lg border border-slate-700 flex flex-col justify-between group active:scale-95 transition">
        <div class="flex justify-between items-start mb-4">
          <div class="bg-orange-500/20 p-2 rounded-xl text-orange-400"><i data-lucide="bell" class="w-6 h-6"></i></div>
          <i data-lucide="arrow-up-right" class="w-5 h-5 text-slate-500 group-hover:text-white transition"></i>
        </div>
        <div>
          <p class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">Live Orders</p>
          <p id="live-orders-count" class="text-3xl font-black text-white">...</p>
        </div>
      </a>

      <a href="order-board.html" class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between group active:scale-95 transition">
        <div class="flex justify-between items-start mb-4">
          <div class="bg-red-50 p-2 rounded-xl text-red-500"><i data-lucide="alert-triangle" class="w-6 h-6"></i></div>
          <i data-lucide="arrow-up-right" class="w-5 h-5 text-gray-400 group-hover:text-gray-800 transition"></i>
        </div>
        <div>
          <p class="text-xs text-gray-500 font-bold uppercase tracking-wider mb-1">Low Stock</p>
          <p id="low-stock-count" class="text-3xl font-black text-gray-900">...</p>
        </div>
      </a>
    </div>

    <!-- Daily Sales Breakdown -->
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-200">
      <div class="flex justify-between items-center mb-6">
        <h2 class="font-bold text-gray-800 flex items-center gap-2"><i data-lucide="wallet" class="w-5 h-5 text-emerald-600"></i> Today's Revenue</h2>
        <span id="date-display" class="text-xs font-bold text-gray-400 bg-gray-50 px-3 py-1 rounded-lg"></span>
      </div>
      
      <div class="space-y-3">
        <div class="flex justify-between items-center bg-gray-50 p-4 rounded-xl border border-gray-100">
          <div class="flex items-center gap-3">
            <div class="bg-blue-100 p-2 rounded-lg text-blue-600"><i data-lucide="door-closed" class="w-4 h-4"></i></div>
            <span class="text-sm font-bold text-gray-700">Reception (Rooms)</span>
          </div>
          <span id="total-rooms" class="font-bold text-blue-600 text-lg">₦0</span>
        </div>
        <div class="flex justify-between items-center bg-gray-50 p-4 rounded-xl border border-gray-100">
          <div class="flex items-center gap-3">
            <div class="bg-teal-100 p-2 rounded-lg text-teal-600"><i data-lucide="wine" class="w-4 h-4"></i></div>
            <span class="text-sm font-bold text-gray-700">Bar</span>
          </div>
          <span id="total-bar" class="font-bold text-teal-600 text-lg">₦0</span>
        </div>
        <div class="flex justify-between items-center bg-gray-50 p-4 rounded-xl border border-gray-100">
          <div class="flex items-center gap-3">
            <div class="bg-orange-100 p-2 rounded-lg text-orange-600"><i data-lucide="chef-hat" class="w-4 h-4"></i></div>
            <span class="text-sm font-bold text-gray-700">Kitchen</span>
          </div>
          <span id="total-kitchen" class="font-bold text-orange-600 text-lg">₦0</span>
        </div>
        <div class="flex justify-between items-center bg-gray-50 p-4 rounded-xl border border-gray-100">
          <div class="flex items-center gap-3">
            <div class="bg-purple-100 p-2 rounded-lg text-purple-600"><i data-lucide="shirt" class="w-4 h-4"></i></div>
            <span class="text-sm font-bold text-gray-700">Minimart / Laundry</span>
          </div>
          <span id="total-other" class="font-bold text-purple-600 text-lg">₦0</span>
        </div>
        
        <div class="flex justify-between items-center bg-emerald-900 p-5 rounded-2xl mt-4 shadow-lg">
          <span class="text-sm font-bold text-emerald-300 uppercase tracking-wider">Total Revenue</span>
          <span id="total-all" class="font-black text-white text-2xl">₦0</span>
        </div>
      </div>
    </div>

    <!-- Staff Credit (Unpaid) -->
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-200">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-gray-800 flex items-center gap-2"><i data-lucide="hand-coins" class="w-5 h-5 text-red-600"></i> Staff Credit Log</h2>
      </div>
      
      <!-- Form to add credit -->
      <div class="flex flex-col md:flex-row gap-2 mb-6">
        <select id="credit-staff" class="flex-1 px-4 py-3 border border-gray-200 rounded-xl text-sm bg-gray-50 outline-none focus:border-emerald-500 font-medium">
          <option value="">Select Staff Member...</option>
        </select>
        <input id="credit-desc" type="text" placeholder="Item (e.g. Rice & Chicken)" class="flex-1 px-4 py-3 border border-gray-200 rounded-xl text-sm bg-gray-50 outline-none focus:border-emerald-500 font-medium">
        <div class="flex gap-2 w-full md:w-auto">
          <input id="credit-amt" type="number" placeholder="Amount (₦)" class="w-full md:w-32 px-4 py-3 border border-gray-200 rounded-xl text-sm bg-gray-50 outline-none focus:border-emerald-500 font-medium">
          <button onclick="addCredit()" class="bg-red-600 hover:bg-red-700 text-white px-5 py-3 rounded-xl font-bold active:scale-95 transition shadow-md"><i data-lucide="plus" class="w-5 h-5"></i></button>
        </div>
      </div>

      <div id="credit-list" class="space-y-2 max-h-80 overflow-y-auto hide-scroll pr-1">
        <p class="text-center text-gray-400 text-sm py-4 animate-pulse">Loading credit records...</p>
      </div>
    </div>

  </main>

  <footer class="text-center text-xs text-gray-400 py-6">
    Powered by <strong class="text-gray-600">DEKY</strong>
  </footer>

  <script>
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    async function loadFinance() {
      // Set Date Display
      document.getElementById('date-display').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
      
      const today = new Date().toISOString().split('T')[0];

      // Fetch Live Operational Counts (Parallel for speed)
      const [ordersRes, stockRes] = await Promise.all([
        db.from('guest_orders').select('*', { count: 'exact', head: true }).in('status', ['Pending', 'Preparing', 'Ready']),
        db.from('inventory').select('id').lte('stock_quantity', 5)
      ]);

      document.getElementById('live-orders-count').textContent = ordersRes.count || 0;
      document.getElementById('low-stock-count').textContent = stockRes.data ? stockRes.data.length : 0;

      // Fetch POS Revenue (Optimized)
      const { data: orders } = await db.from('pos_orders').select('department, total_amount').gte('created_at', today);
      
      let bar = 0, kitchen = 0, other = 0;
      if (orders) {
        orders.forEach(o => {
          const amt = Number(o.total_amount);
          if (o.department === 'Bar') bar += amt;
          else if (o.department === 'Kitchen') kitchen += amt;
          else other += amt; // Minimart, Laundry, etc.
        });
      }

      // Fetch Today's Bookings Revenue
      const { data: bookings } = await db.from('bookings')
        .select(`created_at, rooms(price_per_night)`)
        .gte('created_at', today);

      let rooms = 0;
      if (bookings) {
        bookings.forEach(b => {
          if (b.rooms && b.rooms.price_per_night) rooms += Number(b.rooms.price_per_night);
        });
      }

      // Update UI
      document.getElementById('total-bar').textContent = `₦${bar.toLocaleString()}`;
      document.getElementById('total-kitchen').textContent = `₦${kitchen.toLocaleString()}`;
      document.getElementById('total-other').textContent = `₦${other.toLocaleString()}`;
      document.getElementById('total-rooms').textContent = `₦${rooms.toLocaleString()}`; 
      
      const total = bar + kitchen + other + rooms;
      document.getElementById('total-all').textContent = `₦${total.toLocaleString()}`;

      // Load Staff Dropdown
      const { data: staff } = await db.from('profiles').select('id, full_name').neq('role', 'md');
      const select = document.getElementById('credit-staff');
      if (staff) {
        staff.forEach(s => select.innerHTML += `<option value="${s.id}">${s.full_name}</option>`);
      }

      loadCredits();
    }

    async function loadCredits() {
      const list = document.getElementById('credit-list');
      const { data: credits } = await db.from('staff_credits')
        .select(`*, profiles(full_name)`)
        .eq('status', 'Unpaid')
        .order('created_at', { ascending: false });

      if (!credits || credits.length === 0) {
        list.innerHTML = '<p class="text-center text-gray-500 text-sm py-4 font-medium">No unpaid staff credits right now.</p>';
        return;
      }

      list.innerHTML = credits.map(c => `
        <div class="flex justify-between items-center bg-red-50 p-4 rounded-xl border border-red-100">
          <div>
            <p class="font-bold text-sm text-red-900">${c.profiles.full_name}</p>
            <p class="text-xs text-red-700 mt-0.5">${c.item_description}</p>
          </div>
          <div class="text-right">
            <p class="font-black text-red-900 text-lg">₦${Number(c.amount).toLocaleString()}</p>
            <button onclick="clearCredit('${c.id}')" class="text-[10px] bg-red-600 hover:bg-red-700 text-white font-bold px-3 py-1.5 rounded-lg mt-1 shadow-sm active:scale-95 transition">Mark Paid</button>
          </div>
        </div>
      `).join('');
    }

    async function addCredit() {
      const staffId = document.getElementById('credit-staff').value;
      const desc = document.getElementById('credit-desc').value;
      const amt = document.getElementById('credit-amt').value;

      if (!staffId || !desc || !amt) return alert("Fill all fields");

      const { error } = await db.from('staff_credits').insert({
        staff_id: staffId,
        item_description: desc,
        amount: amt,
        status: 'Unpaid'
      });

      if (error) return alert("Error adding credit: " + error.message);

      document.getElementById('credit-desc').value = '';
      document.getElementById('credit-amt').value = '';
      loadCredits();
    }

    async function clearCredit(id) {
      if (!confirm("Has this staff member paid?")) return;
      await db.from('staff_credits').update({ status: 'Paid' }).eq('id', id);
      loadCredits();
    }

    loadFinance();
  </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg failed', err));
    });
  }
</script>
</body>
</html>
