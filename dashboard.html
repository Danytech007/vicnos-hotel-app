<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vicnos HotelStack - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script> 
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
    body { 
      font-family: 'Outfit', sans-serif; 
      background-color: #0f172a; 
      background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,0.1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,0.1) 0, transparent 50%);
      -webkit-tap-highlight-color: transparent; user-select: none;
    }
  </style>
</head>
<body class="min-h-screen pb-24 text-slate-200">
  
  <nav class="bg-slate-800/50 backdrop-blur-xl border-b border-slate-700/50 p-5 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="bg-blue-600/20 p-2 rounded-xl border border-blue-500/30">
        <i data-lucide="hotel" class="w-6 h-6 text-blue-400"></i>
      </div>
      <div>
        <h1 class="font-bold text-white text-lg leading-tight tracking-wide">Vicnos HotelStack</h1>
        <p id="user-role-display" class="text-[10px] text-blue-400 uppercase tracking-widest font-bold">Loading Role...</p>
      </div>
    </div>
    <button onclick="logout()" class="bg-slate-700/50 p-2 rounded-full text-slate-300 hover:bg-slate-700 transition"><i data-lucide="log-out" class="w-5 h-5"></i></button>
  </nav>

  <main class="p-4 max-w-2xl mx-auto space-y-6 mt-4">
    
    <!-- Profile Card -->
    <div class="bg-slate-800/40 backdrop-blur-md rounded-3xl p-5 border border-slate-700/50 shadow-lg flex justify-between items-center relative overflow-hidden">
      <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-full blur-3xl"></div>
      <div class="relative z-10">
        <p class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-1">User Profile</p>
        <h2 id="admin-name" class="text-2xl font-bold text-white">Loading... 👋</h2>
        <p class="text-sm text-slate-400">Welcome back to the portal.</p>
      </div>
      <span id="role-badge" class="relative z-10 bg-blue-500/20 text-blue-400 text-xs font-bold px-3 py-1.5 rounded-lg border border-blue-500/30 tracking-wide">ROLE</span>
    </div>

    <!-- Stats Grid -->
    <div id="stats-section">
      <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 ml-1">Hotel Overview</h3>
      <div class="grid grid-cols-2 gap-3">
        
        <div class="bg-slate-800/40 backdrop-blur-md p-4 rounded-2xl border border-slate-700/50 flex items-center gap-3 shadow-md hover:bg-slate-800/60 transition">
          <div class="bg-blue-500/20 p-3 rounded-xl"><i data-lucide="bed-double" class="w-6 h-6 text-blue-400"></i></div>
          <div><p class="text-[11px] text-slate-400 font-medium">Available Rooms</p><p id="stat-available" class="text-2xl font-bold text-white">0</p></div>
        </div>

        <div class="bg-slate-800/40 backdrop-blur-md p-4 rounded-2xl border border-slate-700/50 flex items-center gap-3 shadow-md hover:bg-slate-800/60 transition">
          <div class="bg-teal-500/20 p-3 rounded-xl"><i data-lucide="users" class="w-6 h-6 text-teal-400"></i></div>
          <div><p class="text-[11px] text-slate-400 font-medium">Guests Inside</p><p id="stat-guests" class="text-2xl font-bold text-white">0</p></div>
        </div>

        <div class="bg-slate-800/40 backdrop-blur-md p-4 rounded-2xl border border-slate-700/50 flex items-center gap-3 shadow-md hover:bg-slate-800/60 transition">
          <div class="bg-orange-500/20 p-3 rounded-xl"><i data-lucide="sparkles" class="w-6 h-6 text-orange-400"></i></div>
          <div><p class="text-[11px] text-slate-400 font-medium">Dirty Rooms</p><p id="stat-dirty" class="text-2xl font-bold text-white">0</p></div>
        </div>

        <div class="bg-slate-800/40 backdrop-blur-md p-4 rounded-2xl border border-slate-700/50 flex items-center gap-3 shadow-md hover:bg-slate-800/60 transition">
          <div class="bg-red-500/20 p-3 rounded-xl"><i data-lucide="alert-triangle" class="w-6 h-6 text-red-400"></i></div>
          <div><p class="text-[11px] text-slate-400 font-medium">Maintenance</p><p id="stat-maint" class="text-2xl font-bold text-white">0</p></div>
        </div>

      </div>
    </div>

    <!-- Core Operations Grid -->
    <div>
      <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 ml-1 mt-6">Core Operations</h3>
      <div id="operations-grid" class="grid grid-cols-3 gap-3"></div>
    </div>

    <!-- DEKY Branding -->
    <div class="text-center pt-8 pb-4">
      <p class="text-[10px] text-slate-500 tracking-wider">Vicnos HotelStack &copy; 2026</p>
      <p class="text-xs font-bold text-slate-400 tracking-widest mt-1">POWERED BY DEKY</p>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://yphhfnbzgexwkzaoiokf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlwaGhmbmJ6Z2V4d2t6YW9pb2tmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Mzk2MjcsImV4cCI6MjEwODMxNTYyN30.jux_BYQ2ZxMQyArrnhNtbRT8cuBD3BM-FVrMq1lIWFU';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    lucide.createIcons();

    async function loadDashboard() {
      const { data: { user } } = await db.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }

      const { data: profile } = await db.from('profiles').select('full_name, role').eq('id', user.id).single();
      
      if (profile) {
        document.getElementById('admin-name').textContent = profile.full_name + ' 👋';
        document.getElementById('user-role-display').textContent = profile.role + ' Portal';
        
        const badge = document.getElementById('role-badge');
        badge.textContent = profile.role.toUpperCase();
        
        renderOperations(profile.role);
        loadStats(profile.role);
      }
    }

    function renderOperations(role) {
      const grid = document.getElementById('operations-grid');
      let buttons = '';

      // New glowing card style for dashboard buttons
      const btn = (href, icon, color, bg, label) => `
        <a href="${href}" class="bg-slate-800/40 backdrop-blur-md p-3 rounded-2xl border border-slate-700/50 flex flex-col items-center justify-center gap-2 hover:bg-slate-700/50 active:scale-95 transition-all shadow-sm">
          <div class="${bg} p-2.5 rounded-xl"><i data-lucide="${icon}" class="w-5 h-5 ${color}"></i></div>
          <span class="text-[10px] font-medium text-slate-300 text-center leading-tight">${label}</span>
        </a>
      `;

      const clockBtn = btn('attendance.html', 'clock', 'text-indigo-400', 'bg-indigo-500/20', 'Clock In/Out');
      const maintBtn = btn('maintenance.html', 'wrench', 'text-red-400', 'bg-red-500/20', 'Maintenance');
      const orderBtn = btn('order-board.html', 'bell', 'text-orange-400 animate-pulse', 'bg-orange-500/20', 'Live Orders'); 

      // 1. MD, ADMIN, MANAGER, & ACCOUNTANT
      if (['md', 'admin', 'manager', 'accountant'].includes(role)) {
        buttons += btn('checkin.html', 'log-in', 'text-blue-400', 'bg-blue-500/20', 'Check In');
        buttons += btn('rooms.html?view=checkout', 'log-out', 'text-orange-400', 'bg-orange-500/20', 'Check Out');
        buttons += btn('pos.html', 'shopping-cart', 'text-teal-400', 'bg-teal-500/20', 'POS');
        buttons += orderBtn;
        buttons += btn('admin-menu.html', 'coffee', 'text-yellow-400', 'bg-yellow-500/20', 'Menu Manager');
        buttons += btn('finance.html', 'bar-chart-2', 'text-emerald-400', 'bg-emerald-500/20', 'Finance');
        buttons += btn('payroll.html', 'banknote', 'text-green-400', 'bg-green-500/20', 'Payroll');
        buttons += btn('manager-settings.html', 'settings', 'text-purple-400', 'bg-purple-500/20', 'Manage Rooms');
        buttons += btn('staff.html', 'users', 'text-cyan-400', 'bg-cyan-500/20', 'Staff');
        buttons += btn('store.html', 'package', 'text-amber-400', 'bg-amber-500/20', 'Store');
        buttons += btn('rooms.html', 'door-closed', 'text-blue-400', 'bg-blue-500/20', 'Rooms');
        buttons += btn('attendance-report.html', 'clipboard-list', 'text-indigo-400', 'bg-indigo-500/20', 'Attendance');
        buttons += maintBtn;
        buttons += clockBtn;
        buttons += btn('guest-portal.html?room=101', 'smartphone', 'text-pink-400', 'bg-pink-500/20', 'Test Guest Portal');
      } 
      // 2. SUPERVISOR
      else if (role === 'supervisor') {
        buttons += btn('rooms.html', 'eye', 'text-purple-400', 'bg-purple-500/20', 'Inspect Rooms');
        buttons += btn('attendance-report.html', 'clipboard-list', 'text-indigo-400', 'bg-indigo-500/20', 'Attendance');
        buttons += maintBtn;
        buttons += clockBtn;
      }
      // 3. RECEPTIONIST
      else if (role === 'receptionist') {
        buttons += btn('checkin.html', 'log-in', 'text-blue-400', 'bg-blue-500/20', 'Check In');
        buttons += btn('rooms.html?view=checkout', 'log-out', 'text-orange-400', 'bg-orange-500/20', 'Check Out');
        buttons += btn('pos.html', 'shopping-cart', 'text-teal-400', 'bg-teal-500/20', 'POS');
        buttons += orderBtn;
        buttons += btn('rooms.html', 'door-closed', 'text-blue-400', 'bg-blue-500/20', 'Rooms');
        buttons += maintBtn;
        buttons += clockBtn;
      }
      // 4. HOUSEKEEPING
      else if (role === 'housekeeping') {
        buttons += btn('rooms.html', 'sparkles', 'text-orange-400', 'bg-orange-500/20', 'Clean Rooms');
        buttons += maintBtn;
        buttons += clockBtn;
      }
      // 5. STORE KEEPER
      else if (role === 'store_keeper') {
        buttons += btn('store.html', 'package', 'text-amber-400', 'bg-amber-500/20', 'Store');
        buttons += clockBtn;
      }
      // 6. LAUNDRY
      else if (role === 'laundry') {
        buttons += btn('laundry.html', 'shirt', 'text-blue-400', 'bg-blue-500/20', 'Laundry Hub');
        buttons += maintBtn;
        buttons += clockBtn;
      }
      // 7. BARMAN, WAITRESS, CHEF
      else if (['barman', 'waitress', 'chef'].includes(role)) {
        buttons += btn('pos.html', 'shopping-cart', 'text-teal-400', 'bg-teal-500/20', 'POS');
        buttons += orderBtn;
        buttons += clockBtn;
      }
      // 8. SECURITY
      else if (role === 'security') {
        buttons += clockBtn;
      }
      // 9. FALLBACK
      else {
        buttons += clockBtn;
      }

      grid.innerHTML = buttons;
      lucide.createIcons();
    }

    async function loadStats(role) {
      if (['barman', 'waitress', 'chef', 'housekeeping', 'store_keeper', 'security', 'laundry'].includes(role)) {
        document.getElementById('stats-section').style.display = 'none';
        return;
      }

      const [roomsData, guestsData] = await Promise.all([
        db.from('rooms').select('status'),
        db.from('bookings').select('*', { count: 'exact', head: true }).eq('status', 'Checked In')
      ]);
      if (roomsData.data) {
        document.getElementById('stat-available').textContent = roomsData.data.filter(r => r.status === 'Available').length;
        document.getElementById('stat-dirty').textContent = roomsData.data.filter(r => r.status === 'Dirty' || r.status === 'Pending Inspection').length;
        document.getElementById('stat-maint').textContent = roomsData.data.filter(r => r.status === 'Maintenance').length;
      }
      if (guestsData.count !== null) document.getElementById('stat-guests').textContent = guestsData.count;
    }

    async function logout() { await db.auth.signOut(); window.location.href = 'index.html'; }
    loadDashboard();
  </script>
</body>
</html>
